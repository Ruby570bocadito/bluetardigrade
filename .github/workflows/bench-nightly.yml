# Nightly performance bench (ADVISORY, never a merge gate): runs the
# real ingest->rule->alert->SSE pipeline over loopback with the
# documented baseline parameters (-n 2000 -rate 1000) and records the
# latency percentiles in the run summary.
#
# Why this job can stay green on a perf regression: the contract fixes
# it - "the nightly bench informs, it does not block merges". A p99
# above the README phase-1 promise (< 10 ms) raises a ::warning::
# annotation; only a pipeline COMPLETENESS failure (lost alerts,
# functional defect) turns the run red. The job does not run on push
# or pull_request, so it can never gate a landing.
#
# Advisory baselines for reading the numbers (NOT CI thresholds):
#   - dedicated local hardware measured p99 319-434 µs with these
#     exact parameters (README "Measured performance"; shared CI
#     runners are noisier);
#   - the enforced reference bound is the README contract, p99 < 10 ms.
#
# The actual logic lives in scripts/dev-tests/bench_nightly.sh so the
# same commands run locally and in CI (the ci.yml philosophy).
#
# Second job (fuzz): nightly Go fuzzing, advisory like the bench. The
# job matrix is GENERATED by discovery - every `func FuzzX` declared
# in a *_test.go file of the module becomes one matrix job - so a fuzz
# target added anywhere in the tree is under nightly coverage without
# touching this file. The previous explicit step list drifted out of
# sync with the tree: while the module shipped twenty targets the job
# silently ran one, and nothing failed. Discovery closes that failure
# mode structurally; the discover job refuses to emit an empty matrix
# (an empty matrix would skip silently and look green). Each target
# keeps its 5-minute budget; parallelizing across matrix jobs fits the
# whole batch in a fraction of the old serial wall time. Like the
# bench, this workflow never runs on push or pull_request - a fuzzing
# crash informs, it cannot gate.
name: bench-nightly

on:
  schedule:
    # 02:30 UTC = 04:30/03:30 Madrid (nocturnal). GitHub schedules are
    # best-effort: the run may drift during high-load periods, which is
    # acceptable for an advisory job.
    - cron: "30 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: bench-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    name: Pipeline bench (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by SHA: the commit hashes were verified with
      # git ls-remote against the official tags (same pins as ci.yml).
      # A mutable tag is not a trusted reference for a security repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: nightly bench (real engine over loopback, advisory)
        run: bash scripts/dev-tests/bench_nightly.sh

  discover-fuzz-targets:
    name: Discover fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        # One matrix entry per fuzz target: {target, package}. The
        # target name is captured strictly as Fuzz[A-Za-z0-9_]+ (Go
        # identifier), so it is safe to interpolate into the go test
        # command and the artifact name; any `func Fuzz...` line that
        # does not match the identifier shape is skipped rather than
        # passed through. No Go toolchain needed: this is text
        # discovery over the checked-out tree.
        run: |
          entries="$(
            git grep '^func Fuzz' -- '*.go' |
            while IFS= read -r row; do
              file="${row%%:*}"
              sig="${row#*:}"
              target="$(printf '%s\n' "$sig" | sed -nE 's/^func (Fuzz[A-Za-z0-9_]+)\(.*/\1/p')"
              [ -n "$target" ] || continue
              printf '{"target":"%s","package":"./%s"}\n' "$target" "$(dirname "$file")"
            done | sort -u
          )"
          count="$(printf '%s\n' "$entries" | grep -c . || true)"
          if [ "$count" -eq 0 ]; then
            echo "::error::no fuzz targets discovered - the discovery broke or the corpus was removed; refusing to emit an empty (silently green) matrix" >&2
            exit 1
          fi
          matrix="$(printf '%s\n' "$entries" | jq -sc '{include: .}')"
          n="$(printf '%s' "$matrix" | jq '.include | length')"
          if [ "$n" -ne "$count" ]; then
            echo "::error::matrix lost entries ($n of $count)" >&2
            exit 1
          fi
          echo "discovered $n fuzz target(s)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Go fuzzing (advisory, ${{ matrix.target }})
    needs: discover-fuzz-targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Ten parallel targets keep the whole batch inside roughly two
      # waves; GitHub-hosted runners are the constraint, not the 5m
      # per-target budget.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.discover-fuzz-targets.outputs.matrix) }}
    steps:
      # Actions pinned by SHA: the commit hashes were verified with
      # git ls-remote against the official tags (same pins as ci.yml).
      # A mutable tag is not a trusted reference for a security repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz ${{ matrix.target }} (advisory)
        # -fuzz matches exactly one target per invocation; -run '^$'
        # skips the unit battery so the fuzz round owns the whole time
        # budget. A failing input is written to the package's
        # testdata/fuzz/ corpus, which turns the run red and preserves
        # the reproducer for whoever fixes the defect.
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 5m ${{ matrix.package }}
      - name: Upload crashing input (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: '**/testdata/fuzz/${{ matrix.target }}/'
          retention-days: 30
          if-no-files-found: ignore
