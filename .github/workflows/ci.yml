# Continuous integration: every push and pull request re-verifies the
# three build surfaces of the project with the same commands the agents
# run locally (see the Makefile and docs/OPERATIONS.md):
#   engine : gofmt + build + vet + test -race (Go from go.mod, 1.26+)
#   console: hub (bun test, tsc), web console (bun test, tsc, next build) and the DOM regression fixture
#   spec   : OpenAPI drift guard against internal/api/api.go
# The Windows-first ETW sensor gets `cargo check --locked` on two
# targets: the host and a Windows cross-check (x86_64-pc-windows-msvc,
# type/borrow check, no linking). A full Windows cross-build (a linked
# .exe) stays a release concern, not a CI concern.
#
# Reading runs (Director directive 23h55 s3.3): a "cancelled" run is
# concurrency supersession (cancel-in-progress on the next push), NOT a
# code failure - the UI and the badge may still paint it with a grey
# cross. Only "failure" signals a real defect.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Go engine (fmt, build, vet, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fijadas por SHA (ronda 20h40, agente 04): el SHA se verificó
      # con git ls-remote contra la tag oficial; un tag mutable no es una
      # referencia de confianza para un repo de seguridad.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt (no diffs allowed)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needs normalization on:" >&2
            echo "$out" >&2
            gofmt -d . >&2
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      # staticcheck (defect-class G2 of the 2026-09-30 gap-analysis round):
      # vet no ve la clase de hallazgo que el carril de pulimiento ya certifica
      # localmente (ST1000 doc-comment anclado a una cláusula package de un
      # fichero nuevo, U1000 código muerto, ST1012 vocabulario de errores) — un
      # hallazgo real de esa clase aterrizó CON el CI verde (ronda 19h15_A).
      # Dos pasadas, exactamente el estándar local de 03-A: el juego completo
      # menos el grupo de estilo, más el grupo de estilo/documentación.
      # Versión fijada: 2026.2.1 es la que soporta la linea Go del go.mod
      # (1.26+); 2024.1.1 quedaba por debajo y rompía los PRs de dependabot
      # que suben la directiva go (causa raíz del rojo en PR #5). Un @latest
      # flotaría a la versión que el registry sirva en el push, la misma clase
      # de referencia mutable que este workflow rechaza arriba.
      - name: staticcheck (dos pasadas, estándar del carril de pulimiento)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck -checks "all,-ST1000" ./...
          staticcheck -checks "ST1000,ST1020,ST1021,ST1022" ./...
      - name: test
        # -count=1: no test cache, same standard as the local rounds.
        # -race: the engine is concurrent by design (SSE, fsync-per-line
        # audit, kill dispatcher, network sinks) and the house standard
        # (GUIA-VERIFICACION) already demands the race detector locally on
        # the concurrent packages — CI enforces it on every push now
        # (defect-class G3 of the 2026-09-30 gap-analysis round).
        run: go test -race -count=1 ./...
      - name: file alarms and forensic evidence (inert loopback fixtures)
        run: |
          go build -o "$RUNNER_TEMP/bluetardigrade-file-smoke" ./cmd/engine
          python3 scripts/dev-tests/smoke_file_forensics.py --engine "$RUNNER_TEMP/bluetardigrade-file-smoke"
      # Windows cross-check del motor (C3, requisito vinculante R1 del
      # dictamen 04-B 16h11): internal/respond tiene un carril windows
      # (process_windows.go, OpenProcess/QueryFullProcessImageNameW/
      # TerminateProcess) que sin este paso no compilaría certificado
      # en ningún sitio — el sensor Rust ya tiene el suyo abajo.
      - name: Go engine Windows cross-check (respond kill_process, C3 R1)
        run: |
          GOOS=windows go build ./...
          GOOS=windows go vet ./internal/respond/ ./internal/api/ ./cmd/engine/
      - name: OpenAPI spec drift guard
        run: |
          # PyYAML pinned: a PyPI version release is immutable once
          # published, so an exact pin is a stable reference — the same
          # rationale as the SHA-pinned actions above (ronda 20h40):
          # an unpinned install floats to whatever the registry serves
          # at run time, the mutable-reference class this repo rejects
          # for CI supply-chain.
          python3 -m pip install --quiet pyyaml==6.0.3
          python3 scripts/dev-tests/check_openapi.py
          # El guard también verifica el guard: fixtures embebidas
          # que deben producir hallazgos (el recuento crece con cada check nuevo).
          python3 scripts/dev-tests/check_openapi.py --self-test
          # Keep the full operator inventory/counts in sync with rule packs.
          python3 scripts/dev-tests/check_rule_inventory.py

  # Smoke CONDUCTUAL de la respuesta activa en Windows real (C3, R1):
  # hasta hoy el camino handle solo tenía certificación de COMPILACIÓN
  # (el cross-check GOOS=windows del job engine); la condición de
  # cierre del paquete respond (actas 04-B 17h35 §4 y 17h58) exigía
  # conducta en host Windows. Este job la ejecuta en cada push con
  # kills reales sobre procesos que el propio smoke arranca (ping
  # desechable, sebo csrss.exe en temp) — nada del runner real es
  # tocado: el guard R6 niega el protegido antes de señalizar y el
  # resto de los kills recae en hijos del propio smoke.
  engine-windows:
    name: Engine conductual Windows (respond handle path, C3)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build engine (nativo Windows)
        run: go build -o engine-smoke.exe ./cmd/engine
      - name: smoke conductual del camino handle (kills reales, audit JSONL)
        shell: pwsh
        # Reintento flaky-tolerant ACOTADO (directiva 23h55 §3.4, decision
        # documentada del carril 02-A): exactamente UNA re-ejecucion. El
        # smoke ejecuta kills reales sobre procesos propios en un runner
        # compartido (orden de planificacion, antivirus, carga) — la clase
        # de flakiness de entorno que produjo los 3 failures historicos
        # (f7428ff/d1737c0/02c5c55, todos durante el aterrizaje C3, verde
        # desde entonces). Un solo reintento acota el coste (el job entero
        # sigue dentro de su timeout de 10 min) y no enmascara defectos
        # reales: dos fallos consecutivos sobre el mismo arbol siguen
        # fallando el job. Entre intentos se espera (polling activo, misma
        # receta anti re-bind del bench_nightly) a que los puertos del
        # smoke queden libres para que el reintento no herede sockets a
        # medio cerrar del intento anterior.
        run: |
          $ok = $false
          foreach ($attempt in 1..2) {
            Write-Host "::group::smoke_respond intento $attempt/2"
            & ./scripts/windows/smoke_respond.ps1 -Engine ./engine-smoke.exe
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -eq 0) { $ok = $true; break }
            if ($attempt -eq 1) {
              Write-Host "::warning::smoke intento 1 fallo (exit $code); re-ejecucion unica tras esperar puertos libres"
              foreach ($port in 18227, 18228, 18237, 18238) {
                $free = $false
                foreach ($i in 1..50) {
                  $busy = Test-NetConnection -ComputerName 127.0.0.1 -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue
                  if (-not $busy) { $free = $true; break }
                  Start-Sleep -Milliseconds 200
                }
                if (-not $free) { Write-Host "puerto $port sigue ocupado; el reintento lo denunciara si es la causa" }
              }
            }
          }
          if (-not $ok) { exit 1 }

  console:
    name: Console (hub tests, tsc, next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: hub install + tests + typecheck
        working-directory: web/console-service
        run: |
          bun install --frozen-lockfile
          bun test
          bunx tsc --noEmit
      - name: web console install + tests + typecheck + build
        working-directory: web/console
        run: |
          bun install --frozen-lockfile
          # The 19-test/58-expect client floor (proxy route + triage
          # lifecycle validation) runs on every push now: a regression in
          # the r6 client-side gate used to pass CI green because only the
          # hub battery ran here (defect-class G1 of
          # the 2026-09-30 gap-analysis round).
          bun test
          bunx tsc --noEmit
          bun run build
      - name: console DOM regression (real provider + dashboard in jsdom)
        run: |
          npm install --prefix tools/console-tests --no-audit --no-fund esbuild@0.25.11 jsdom@26.1.0
          node scripts/dev-tests/check_console_dom.mjs
      - name: console browser regression (Chromium, desktop and mobile)
        run: |
          npm install --prefix tools/console-tests --no-audit --no-fund playwright@1.63.0
          node tools/console-tests/node_modules/playwright/cli.js install --with-deps chromium
          node scripts/dev-tests/check_console_browser.mjs
      - name: browser regression captures (isolated fixtures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-browser-regression
          path: captures/browser-regression/
          retention-days: 7
          if-no-files-found: ignore

  sensor:
    name: Sensor (cargo check, locked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ensure a recent stable Rust (>= 1.85; lockfile resolves
          time-core 0.1.9, which needs edition2024 — see README)
        run: |
          rustup toolchain install --profile minimal stable
          rustup default stable
      - name: cargo check --locked
        run: cargo check --locked --manifest-path sensor/Cargo.toml
      # Windows cross-check (agent-04 delta, convergencia ronda 20h31): el
      # sensor es Windows-first (colector ETW) y este check es la única vía
      # de verificar ese código sin host Windows; coste ~1-2 min por push.
      # Pulimiento lo certificó en frío dos veces con este comando exacto.
      # Contra-argumento documentado: "release concern, not CI concern" —
      # decisión final para el Director si el tiempo de CI pesa.
      - name: cargo check --locked (Windows cross-check)
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --locked --target x86_64-pc-windows-msvc --manifest-path sensor/Cargo.toml
