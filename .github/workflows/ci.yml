# Continuous integration: every push and pull request re-verifies the
# three build surfaces of the project with the same commands the agents
# run locally (see the Makefile and docs/OPERATIONS.md):
#   engine : gofmt + build + vet + test -race (Go from go.mod, 1.26+)
#   console: hub (bun test, tsc), web console (bun test, tsc, next build) and the DOM regression fixture
#   spec   : OpenAPI drift guard against internal/api/api.go
# The Windows-first ETW sensor gets `cargo check --locked` on two
# targets: the host and a Windows cross-check (x86_64-pc-windows-msvc,
# type/borrow check, no linking). A full Windows cross-build (a linked
# .exe) stays a release concern, not a CI concern.
#
# Reading runs: a "cancelled" run is
# concurrency supersession (cancel-in-progress on the next push), NOT a
# code failure - the UI and the badge may still paint it with a grey
# cross. Only "failure" signals a real defect.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Go engine (fmt, build, vet, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by SHA: the commit hash was verified with
      # git ls-remote against the official tag. A mutable tag is not a
      # trusted reference for a security repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt (no diffs allowed)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needs normalization on:" >&2
            echo "$out" >&2
            gofmt -d . >&2
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      # staticcheck catches a defect class vet does not see: ST1000
      # (doc comment anchored to one package clause of a new file),
      # U1000 (dead code), ST1012 (error vocabulary) - a real finding
      # of that class landed with CI green before staticcheck ran
      # here. Two passes, matching the local standard: the full set
      # minus the style group, plus the style/documentation group.
      # Version pinned: 2026.2.1 is the release that supports the
      # go.mod Go line (1.26+); 2024.1.1 sat below it and broke
      # dependabot PRs that raise the go directive (root cause of the
      # PR #5 red). A floating @latest would drift to whatever the
      # registry serves at push time - the same mutable-reference
      # class this workflow rejects above.
      - name: staticcheck (two passes, local standard)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck -checks "all,-ST1000" ./...
          staticcheck -checks "ST1000,ST1020,ST1021,ST1022" ./...
      - name: test
        # -count=1: no test cache, so a pass certifies this exact tree.
        # -race: the engine is concurrent by design (SSE, fsync-per-line
        # audit, kill dispatcher, network sinks) and the house standard
        # (GUIA-VERIFICACION) already demands the race detector locally on
        # the concurrent packages - a data race shipped to main behind a
        # green suite before, so CI enforces the detector on every push.
        run: go test -race -count=1 ./...
      - name: file alarms and forensic evidence (inert loopback fixtures)
        run: |
          go build -o "$RUNNER_TEMP/bluetardigrade-file-smoke" ./cmd/engine
          python3 scripts/dev-tests/smoke_file_forensics.py --engine "$RUNNER_TEMP/bluetardigrade-file-smoke"
      - name: SOC connectors, alert triage and analyst report (inert loopback fixtures)
        run: |
          go build -o "$RUNNER_TEMP/bluetardigrade-collector-smoke" ./cmd/collector
          python3 scripts/dev-tests/smoke_soc_pipeline.py --engine "$RUNNER_TEMP/bluetardigrade-file-smoke" --collector "$RUNNER_TEMP/bluetardigrade-collector-smoke"
      # Windows cross-check of the engine: internal/respond has a
      # windows-only build lane (process_windows.go, OpenProcess/
      # QueryFullProcessImageNameW/TerminateProcess) that without this
      # step would never be compile-certified anywhere - the Rust
      # sensor already has its own below.
      # The vet sweeps the WHOLE module, not a hand-picked package
      # list. A package list drifts silently - the exact failure mode
      # bench-nightly.yml documents for its old fuzz step list
      # ("while the module shipped twenty targets the job silently
      # ran one, and nothing failed"). The next package that grows a
      # windows-only file (a future connector, a new collector lane)
      # is vetted the day it appears, with zero list maintenance.
      # vet under GOOS=windows also type-checks the *_test.go files
      # of every package against the windows constraints, which the
      # GOOS=windows go build above never compiles. Measured cost of
      # the wider vet: ~9 s cold, ~1 s warm (Go 1.26.6, whole module)
      # - noise against this job's 15-minute budget.
      - name: Go engine Windows cross-check (respond kill_process, C3 R1)
        run: |
          GOOS=windows go build ./...
          GOOS=windows go vet ./...
      - name: PowerShell syntax guard (pwsh AST parse)
        # The $Url: parse error class (InvalidVariableReferenceWithDrive)
        # shipped a BROKEN installer through a green CI: nothing parsed
        # install.ps1 before it reached users via irm|iex. This guard runs
        # the real PowerShell parser over every .ps1 in the tree; the
        # engine-windows job below repeats it under Windows PowerShell
        # 5.1, the installer's declared minimum target.
        shell: pwsh
        run: ./scripts/dev-tests/check_powershell_syntax.ps1
      - name: Installer native stderr guard
        # Native stderr redirected under EAP='Stop' (2>&1 / 2>$null)
        # is a terminating NativeCommandError on Windows PowerShell
        # 5.1: git's own 'Cloning into...' progress line killed the
        # one-command installer. Invoke-Native is the only sanctioned
        # pattern; this lint keeps the class from coming back.
        run: python3 scripts/dev-tests/check_installer_native_stderr.py
      - name: Makefile recipe guard (tab indentation)
        # An editor expanded every Makefile recipe tab to 8 spaces
        # (63fa077) and `make` died with "missing separator" on every
        # target - silently, because this pipeline runs the underlying
        # commands directly and never invokes make, so a broken build
        # entry point shipped behind a green run. The guard pins the
        # GNU make contract (recipe lines start with TAB); it lives
        # here and NOT inside `make ci` on purpose: a broken Makefile
        # cannot run its own guard. Static, stdlib only, no make
        # binary needed; --self-test covers both directions.
        run: |
          python3 scripts/dev-tests/check_makefile_tabs.py --self-test
          python3 scripts/dev-tests/check_makefile_tabs.py
      - name: OpenAPI spec drift guard
        run: |
          # PyYAML pinned: a PyPI version release is immutable once
          # published, so an exact pin is a stable reference — the same
          # rationale as the SHA-pinned actions above: an unpinned
          # install floats to whatever the registry serves at run time,
          # the mutable-reference class this repo rejects for CI
          # supply-chain.
          python3 -m pip install --quiet pyyaml==6.0.3
          python3 scripts/dev-tests/check_openapi.py
          # El guard también verifica el guard: fixtures embebidas
          # que deben producir hallazgos (el recuento crece con cada check nuevo).
          python3 scripts/dev-tests/check_openapi.py --self-test
          # Keep the full operator inventory/counts in sync with rule packs.
          python3 scripts/dev-tests/check_rule_inventory.py

  # Behavioral smoke of active response on real Windows: until this
  # job existed, the kill path only had BUILD certification (the
  # GOOS=windows cross-check in the engine job); the respond package
  # closure criteria demanded behavior on a real Windows host. This
  # job runs it on every push with real kills over processes the
  # smoke itself starts (disposable ping, csrss.exe decoy in temp) —
  # nothing on the runner is touched: the R6 guard denies the
  # protected process before signaling and the rest of the kills fall
  # on the smoke's own children.
  engine-windows:
    name: Engine conductual Windows (respond handle path, C3)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: PowerShell syntax guard (Windows PowerShell 5.1 parser)
        # Same guard as the ubuntu job, but under the 5.1 parser: the
        # one that actually runs "irm | iex" on a stock Windows box.
        shell: powershell
        run: ./scripts/dev-tests/check_powershell_syntax.ps1
      - name: build engine (nativo Windows)
        run: go build -o engine-smoke.exe ./cmd/engine
      - name: Windows unit tests and provider fixtures
        run: |
          go test -count=1 ./...
          go build -o collector-smoke.exe ./cmd/collector
          python scripts/dev-tests/smoke_soc_pipeline.py --engine engine-smoke.exe --collector collector-smoke.exe
          python scripts/dev-tests/smoke_file_forensics.py --engine engine-smoke.exe
      - name: Shared launcher configuration and process ownership
        shell: powershell
        run: ./scripts/dev-tests/check_runtime_behavior.ps1
      - name: Sysmon sensor mapping self-test (sample records, no Sysmon needed)
        shell: powershell
        run: ./scripts/windows/sensor.ps1 -SelfTest
      - name: Windows Server task plans and failure handling (isolated fixtures)
        shell: powershell
        run: ./scripts/windows/check-server-deployment.ps1
      - name: Windows Server foreground runner (inert local fixture)
        shell: powershell
        run: ./scripts/windows/smoke-server-runner.ps1
      - name: Windows package signing policy and read-only verification
        shell: powershell
        run: ./scripts/release/test-sign-windows.ps1
      - name: installer PATH order, running-binary lock and UTF-8 tool output (scratch registry key)
        shell: powershell
        run: ./scripts/dev-tests/check_installer_path.ps1
      - name: installer behavior (Windows PowerShell 5.1, real engine/collector/console installation)
        shell: powershell
        run: ./scripts/dev-tests/check_installer_behavior.ps1
      - name: smoke conductual del camino handle (kills reales, audit JSONL)
        shell: pwsh
        # Bounded flaky-tolerant retry: exactly ONE re-run. The smoke
        # performs real kills on its own processes on a shared runner
        # (scheduling order, antivirus, load) - the environment
        # flakiness class behind the 3 historical failures
        # (f7428ff/d1737c0/02c5c55, all during the C3 landing, green
        # ever since). A single retry bounds the cost (the job stays
        # within its 10 min timeout) and does not mask real defects:
        # two consecutive failures on the same tree still fail the
        # job. Between attempts it waits (active polling, the same
        # anti-rebind recipe as bench_nightly) for the smoke ports to
        # go free so the retry does not inherit half-closed sockets
        # from the previous attempt.
        run: |
          $ok = $false
          foreach ($attempt in 1..2) {
            Write-Host "::group::smoke_respond intento $attempt/2"
            & ./scripts/windows/smoke_respond.ps1 -Engine ./engine-smoke.exe
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -eq 0) { $ok = $true; break }
            if ($attempt -eq 1) {
              Write-Host "::warning::smoke intento 1 fallo (exit $code); re-ejecucion unica tras esperar puertos libres"
              foreach ($port in 18227, 18228, 18237, 18238) {
                $free = $false
                foreach ($i in 1..50) {
                  $busy = Test-NetConnection -ComputerName 127.0.0.1 -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue
                  if (-not $busy) { $free = $true; break }
                  Start-Sleep -Milliseconds 200
                }
                if (-not $free) { Write-Host "puerto $port sigue ocupado; el reintento lo denunciara si es la causa" }
              }
            }
          }
          if (-not $ok) { exit 1 }

  console:
    name: Console (hub tests, tsc, next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: hub install + tests + typecheck
        working-directory: web/console-service
        run: |
          bun install --frozen-lockfile
          bun test
          bunx tsc --noEmit
      - name: web console install + tests + typecheck + build
        working-directory: web/console
        run: |
          bun install --frozen-lockfile
          # The 19-test/58-expect client floor (proxy route + triage
          # lifecycle validation) runs on every push now: a regression
          # in the client-side gate used to pass CI green because only
          # the hub battery ran here.
          bun test
          bunx tsc --noEmit
          bun run build
      - name: console theme pairs (WCAG contrast + CVD, both themes)
        # The palette is a contract, not a taste: text/UI contrast
        # pairs, the sequential ramp and color-vision-deficiency
        # separation are checked in both themes on every push, right
        # after the build they decorate. Stdlib-only, seconds to run.
        run: python3 scripts/dev-tests/check_console_theme.py
      - name: console DOM regression (real provider + dashboard in jsdom)
        run: |
          npm install --prefix tools/console-tests --no-audit --no-fund esbuild@0.25.11 jsdom@26.1.0
          node scripts/dev-tests/check_console_dom.mjs
      - name: console browser regression (Chromium, desktop and mobile)
        run: |
          npm install --prefix tools/console-tests --no-audit --no-fund playwright@1.63.0
          node tools/console-tests/node_modules/playwright/cli.js install --with-deps chromium
          node scripts/dev-tests/check_console_browser.mjs
          node scripts/dev-tests/check_analyst_browser.mjs
      - name: browser regression captures (isolated fixtures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-browser-regression
          path: captures/browser-regression/
          retention-days: 7
          if-no-files-found: ignore

  sensor:
    name: Sensor (check, tests, clippy; locked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ensure a recent stable Rust (>= 1.85; lockfile resolves
          time-core 0.1.9, which needs edition2024 — see README)
        run: |
          rustup toolchain install --profile minimal --component clippy stable
          rustup default stable
      - name: cargo check --locked
        run: cargo check --locked --manifest-path sensor/Cargo.toml
      # the platform-independent decoders (procinfo, netreg, dns,
      # imagehash, heartbeat, queue) carry their own unit tests
      - name: cargo test --locked
        run: cargo test --locked --manifest-path sensor/Cargo.toml
      - name: cargo clippy --locked (warnings are errors)
        run: cargo clippy --locked --all-targets --manifest-path sensor/Cargo.toml -- -D warnings
      # Windows cross-check: the sensor is Windows-first (ETW
      # collector) and this check is the only way to verify that code
      # without a Windows host; cost ~1-2 min per push. Counter-argument
      # on record: "release concern, not CI concern" - worth revisiting
      # if CI time ever gets tight.
      - name: cargo check --locked (Windows cross-check)
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --locked --target x86_64-pc-windows-msvc --manifest-path sensor/Cargo.toml
          cargo clippy --locked --target x86_64-pc-windows-msvc --manifest-path sensor/Cargo.toml -- -D warnings
