# Release pipeline: on a v* tag push, build the Go binaries for the two
# supported platforms, checksum them and publish a GitHub Release. The
# tag name is injected into the engine version block at link time
# (-X main.engineVersion), so `engine version` on a release binary
# always reports the exact tag it was built from.
#
# Design notes:
#   - No third-party actions: the same two SHA-pinned actions CI uses
#     (checkout, setup-go) plus the preinstalled `gh` CLI create the
#     release. A mutable third-party release action would be the exact
#     mutable-reference class this repo rejects for CI supply-chain.
#   - permissions are job-scoped: this job alone gets contents:write
#     (it must create a release); everything else in the repo runs
#     with contents:read.
#   - Cross-builds are pure Go (CGO disabled): the CI engine job
#     already certifies GOOS=windows compiles on Linux runners.
#   - The tag is the source of truth for the version; CHANGELOG.md
#     must carry an entry for it before the tag is cut.
#   - Build provenance: every published binary (and checksums.txt) gets
#     a Sigstore-signed SLSA provenance attestation from GitHub's own
#     first-party action, SHA-pinned like the rest. checksums.txt alone
#     proves integrity against the file next to it, not origin: whoever
#     can replace a release asset can replace both. Verify with
#       gh attestation verify engine-vX.Y.Z-windows-amd64.exe \
#         --repo Ruby570bocadito/bluetardigrade
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and checksum only, do not create the release"
        type: boolean
        default: true

permissions:
  contents: read

# concurrency (audit 5.10): two tags pushed in quick succession used to
# run release builds in PARALLEL — racing `gh release` mutations on the
# same repository and interleaved attestations. New runs now cancel the
# pending/superseded one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build + checksum + publish (linux, windows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release and upload binaries
      id-token: write # OIDC token for the Sigstore signing of the attestation
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # cache: false (audit 5.10): a release binary must not link
          # artifacts from a shared runner cache; the build is already
          # -trimpath CGO_ENABLED=0 from a clean checkout, so the cache
          # only ever added provenance ambiguity, never speed that
          # matters at this cadence.
          cache: false

      - name: Resolve version from the tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="v0.0.0-dispatch"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          echo "$VER" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$' \
            || { echo "tag '$VER' no es SemVer (vMAJOR.MINOR.PATCH): falla loud" >&2; exit 1; }
          grep -q "\[$VER\]" CHANGELOG.md \
            || { echo "CHANGELOG.md no tiene entrada para $VER: corta el tag despues de documentar la version" >&2; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build binaries (linux/amd64 + windows/amd64)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          VER_LDFLAGS="-s -w -X main.engineVersion=${VER}"
          GOOS=linux   CGO_ENABLED=0 go build -trimpath -ldflags "$VER_LDFLAGS" -o dist/engine-${VER}-linux-amd64        ./cmd/engine
          GOOS=windows CGO_ENABLED=0 go build -trimpath -ldflags "$VER_LDFLAGS" -o dist/engine-${VER}-windows-amd64.exe  ./cmd/engine
          GOOS=linux CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/collector-${VER}-linux-amd64 ./cmd/collector
          GOOS=windows CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/collector-${VER}-windows-amd64.exe ./cmd/collector
          # the version the linux binary reports must be the tag itself,
          # not the source default: fail loud on drift
          ./dist/engine-${VER}-linux-amd64 version | grep -qF "$VER" \
            || { echo "el binario no reporta $VER: la inyeccion -X fallo" >&2; exit 1; }
          sha256sum dist/* > dist/checksums.txt
          ls -l dist

      - name: Attest build provenance (SLSA, Sigstore)
        if: ${{ github.event_name == 'push' && inputs.dry_run != true }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' && inputs.dry_run != true }}
        env:
          VER: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # a tag with a suffix (v1.0.0-rc1) is a candidate: published as a
          # pre-release, so it never becomes the "Latest" release
          PRE=""
          case "$VER" in *-*) PRE="--prerelease" ;; esac
          gh release create "$VER" dist/* \
            --verify-tag \
            --title "$VER" \
            --generate-notes $PRE
