# Perfiles del detector de beaconing (paquete A3 del roadmap del
# propietario). El motor carga este fichero por defecto (-beacons
# ./beacons.yaml); un fichero ausente desactiva el detector, un
# fichero que existe pero no parsea es FATAL en el arranque (mismo
# estándar que suppressions: un control que el operador cree armado
# no puede quedarse silenciosamente apagado).
#
# Qué es un beacon aquí: un host que conecta a UN MISMO destino
# (dominio preferido sobre IP, con puerto) a un ritmo conspicuamente
# regular dentro de la ventana. El detector mide el coeficiente de
# variación (CV = desviación típica / media) de los intervalos entre
# conexiones; CV bajo = cadencia de implant, CV alto = navegación
# humana. No hay ML ni números mágicos: cada parámetro es visible y
# ajustable por el operador.
#
# Knob anti-falsos-positivos principal: min_interval. CDNs, balanceadores
# y pools NTP también conectan de forma regular, pero a cadencias
# sub-segundo o contra conjuntos de destinos rotatorios; un suelo de
# 2s en el perfil estricto deja ese ruido fuera por construcción.
#
# Cada alerta lleva el id del perfil como rule_id, así que suppressions
# (perfil + host), triage, store, webhook y consola funcionan igual que
# para cualquier otra alerta.

# ---------- corazón del detector: HTTPS/HTTP call-home lento ----------
- name: C2 beacon web lento
  id: bcn-periodic-web
  description: >
    Cadencia regular (CV <= 0.12) hacia un mismo destino web con
    intervalo medio >= 2s: el patrón clásico de implant dormido que
    consulta a su C2 cada pocos minutos/segundos alineados.
  severity: high
  window: 15m
  min_count: 12
  max_jitter: 0.12
  min_interval: 2s
  cooldown: 1h
  tags: [ttp:T1071.001, beacon]
  # Servicios cuyo latido es regular por diseño: la app de WhatsApp
  # (y WhatsApp Web) mantiene viva su conexión cada ~60 s contra
  # web.whatsapp.com:443/5222. Cada entrada cubre también sus
  # subdominios. Añade aquí otros servicios legítimos de tu red;
  # las conexiones conocidas solo por IP nunca se excluyen.
  exclude_domains: [whatsapp.com, whatsapp.net]

  # ---------- malla rápida: malware ruidoso y DNS-based ----------
- name: C2 beacon rapido
  id: bcn-periodic-fast
  description: >
    Cadencia regular a intervalos cortos (>= 500ms) sobre puertos de
    servicio acotados: catches implants agresivos y tunnels DNS/HTTP
    que no se atreven a dormir tanto. El suelo de 500ms filtra el
    chatter legitimo de service meshes en localhost.
  severity: medium
  window: 5m
  min_count: 20
  max_jitter: 0.10
  min_interval: 500ms
  cooldown: 30m
  ports: [53, 80, 443, 8080]
  tags: [ttp:T1071.001, beacon]
  exclude_domains: [whatsapp.com, whatsapp.net]

  # ---------- baliza lenta: implant que duerme minutos ----------
  # El perfil web de arriba necesita 12 conexiones en 15 min, asi que
  # solo ve cadencias de hasta ~80 s. Un implant configurado para
  # dormir 5, 10 o 30 minutos (lo habitual en una intrusion real) queda
  # fuera. Este perfil mira una ventana de 4 h y le bastan 8
  # conexiones: cubre intervalos medios de 75 s a ~34 min. Tolera mas
  # jitter (CV <= 0.25, el de un sleep con +-30 % de variacion)
  # porque los implants lo aleatorizan a proposito.
  # A cambio dispara tambien con software legitimo que sondea a ritmo fijo
  # (actualizadores, sincronizacion, telemetria): por eso es de
  # severidad media, calla 24 h por destino y se limita a puertos web.
  # Anade a exclude_domains los servicios periodicos de tu red.
  # Coste: sus claves viven 8 h (2x ventana); con varios perfiles
  # cargados un perfil ocupa como mucho la mitad de la cuota de claves
  # de cada equipo, asi que no deja sin sitio a los perfiles rapidos.
- name: C2 beacon lento (minutos)
  id: bcn-periodic-slow
  description: >
    Cadencia regular (CV <= 0.25) hacia un mismo destino web con
    intervalo medio entre 75 s y unos 34 minutos, sostenida durante
    horas: el patron de un implant con sleep largo y jitter. Tambien
    lo producen programas legitimos que sondean a ritmo fijo; revisar
    el proceso y el destino antes de escalar.
  severity: medium
  window: 4h
  min_count: 8
  max_jitter: 0.25
  min_interval: 75s
  cooldown: 24h
  ports: [80, 443, 8080, 8443]
  tags: [ttp:T1071.001, ttp:T1029, beacon]
  exclude_domains: [whatsapp.com, whatsapp.net]
