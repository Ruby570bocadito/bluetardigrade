{
  "options": {
    "logger_plugin": "filesystem",
    "logger_event_type": "true",
    "host_identifier": "hostname"
  },
  "schedule": {
    "bt_exposed_admin_ports": {
      "query": "SELECT l.pid, p.name, p.path, p.cmdline, l.address, l.port, l.protocol FROM listening_ports l JOIN processes p ON p.pid = l.pid WHERE l.protocol = 6 AND l.port IN (22, 445, 3389) AND l.address IN ('0.0.0.0', '::');",
      "interval": 60,
      "snapshot": false
    }
  }
}
