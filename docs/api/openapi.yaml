                $ref: '#/components/schemas/ADStatus'

  /api/ad/objects/{kind}:
    get:
      tags: [ad]
      operationId: listADObjects
      summary: One page of the directory snapshot (users, groups, computers or OUs)
      security:
        - bearerAuth: []
        - {}
      description: |
        Serves the LOCAL SQLite snapshot, paged and filtered — a console
        query never composes an LDAP filter (the connector's own filters
        are product literals, so there is no injection surface here).
        `q` is a case-insensitive substring over the object name, DN and
        operating system; wildcards are escaped.

        Users carry the security attributes the posture analysis reads
        (userAccountControl, pwdLastSet, lastLogonTimestamp, adminCount,
        SPN count, Kerberos encryption types); groups carry their direct
        member count; computers carry their OS and DNS host name.
      parameters:
        - name: kind
          in: path
          required: true
          description: object kind to list
          schema:
            type: string
            enum: [user, group, computer, ou]
        - name: q
          in: query
          required: false
          description: substring filter over name, DN and OS (case-insensitive)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: page size (default 50, max 500)
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
          description: page start (default 0)
          schema:
            type: integer
            minimum: 0
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Unknown object kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: The connector is not armed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: One filtered page plus the total that matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ADObjectsPage'

  /api/ad/posture:
    get:
      tags: [ad]
      operationId: getADPosture
      summary: Domain posture analysis with the 0-100 score (AD-2)
      security:
        - bearerAuth: []
        - {}
      description: |
        The classical defensive-audit findings computed over the last
        completed snapshot: effective members of privileged groups
        (nested membership included), krbtgt password age, unconstrained
        delegation, accounts without Kerberos pre-authentication, user
        accounts with SPN and RC4-capable encryption, end-of-support
        operating systems, inactive accounts, passwords that never
        expire, orphaned adminCount and domain computers without a
        sensor. Every finding carries severity, affected objects (the
        list is capped at 50 entries; `count` is the true total) and a
        plain-language remediation.

        The score starts at 100 and deducts per finding (critical 10,
        high 6, medium 3, low 1, each over a small per-finding cap), so
        one noisy class cannot drown a targeted one. `ready` is false
        and `score` null until the first sync completes — absence is
        never rendered as a perfect score.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          description: The connector is not armed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The stored posture document is unreadable (engine log has the detail)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The posture document frozen by the last completed sync
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ADPosture'

  /api/ad/posture/history:
    get:
      tags: [ad]
      operationId: getADPostureHistory
      summary: Past posture scores, one point per completed sync (AD-2 trend)
      security:
        - bearerAuth: []
        - {}
      description: |
        One score point per completed sync, oldest first, so the console
        renders the trend instead of a single number. The history keeps
        the most recent 500 points (over a day of worst-case 5-minute
        syncs, a year at the default 15-minute interval).
      parameters:
        - name: limit
          in: query
          required: false
          description: maximum points returned (default 500, max 500)
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          description: The connector is not armed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Score history (oldest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ADPostureHistory'

  /api/settings/ad:
    get:
      tags: [ad]
      operationId: getADSettings
      summary: Effective Active Directory connector configuration (AD-6)
      security:
        - bearerAuth: []
        - {}
      description: |
        The configuration the connector currently runs with — the same
        document the settings screen edits — plus the presence of its two
        file-backed resources (the CA bundle and the credential envelope;
        contents are never served) and the hot-reload bookkeeping.

        Admin surface: the whole `/api/settings/ad` family answers 403
        while the engine runs without `-api-write` (the engine's single
        bearer token has no role model; arming writes IS the admin gate),
        and 501 when the engine runs without `-ad` (feature off). The
        service-account password is NEVER part of the response: it lives
        in its own SEC-2 envelope file and is write-only over this API.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: API writes are disabled (no -api-write at startup)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "api writes are disabled: restart the engine with -api-write (or SF_API_WRITE=1) to allow Active Directory settings"
        '501':
          description: The connector is not armed (no -ad config at startup)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Effective configuration, credential-free
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ADSettings'
    put:
      tags: [ad]
      operationId: putADSettings
      summary: Validate, commit and hot-reload the AD connector settings (AD-6)
      security:
        - bearerAuth: []
        - {}
      description: |
        One call does four things, in this order: validate the merged
        configuration with the SAME rules the `-ad` loader applies (a
        rejected change never touches the disk); write the password, when
        the request carries one, into its own SEC-2 envelope (DPAPI on
        Windows, 0600 plain elsewhere — never into the YAML, never into a
        log); commit the YAML atomically (temp+rename+Sync); and hot-swap
        the live connector synchronously inside that same serialized
        write (the next sync uses the new settings; the old loop stops in
        the background). Overlapping PUTs therefore publish connectors in
        the order they commit — the served connector always matches the
        committed file, and no swapped-out connector is ever left
        running. The response is the new effective document with the
        swap already resolved: `reload_pending` false and the outcome in
        `last_reload_at`/`last_reload_error` (a swap that failed still
        applies on restart).

        Guard rails: 409 when the `-ad` file changed on disk since the
        engine loaded or last wrote it (hand edits are reconciled by a
        human, never clobbered); 400 carries the loader's own validation
        message. Every committed change leaves one audit line in the
        engine log listing the changed field names — the password value is
        never logged, echoed or stored in the YAML.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ADSettingsUpdate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Configuration rejected (validation) or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API writes are disabled (no -api-write at startup)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "api writes are disabled: restart the engine with -api-write (or SF_API_WRITE=1) to allow Active Directory settings"
        '409':
          description: The -ad file drifted on disk (hand edit not reconciled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Credential or config file not writable (engine log has the detail)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: The connector is not armed (no -ad config at startup)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The committed, effective configuration (reload pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ADSettings'

  /api/ad/test:
    post:
      tags: [ad]
      operationId: testADConnection
      summary: 'Probar conexión — one bounded, read-only probe of a candidate configuration (AD-6)'
      security:
        - bearerAuth: []
        - {}
      description: |
        The settings screen's "Probar conexión" button: opens the SAME
        TLS-protected transport the connector uses (organization CA only,
        pinned server name, TLS 1.2 floor), performs the authenticated
        bind and samples every object kind (users, groups, computers, OUs)
        up to 200 entries each, so the operator sees what the service
        account can actually read before committing anything. It stores
        nothing anywhere.

        A failed CONNECTION is a successful TEST: the verdict is the
        returned `ok` boolean (with a credential-free `error` reason);
        the HTTP 400s are for malformed or invalid REQUESTS. The route
        needs `-api-write` and an armed `-ad` surface: the CA and the
        credential files always come from the `-ad` file on the engine
        host, and a request that names other paths (`ca_file`,
        `password_file`) is refused with 400 — otherwise the API
        credential could make the engine read any file and send it as a
        bind password. One probe at a time: a double click cannot hammer
        the domain controller. The password, when the request carries
        one, crosses only this call and is never stored by it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ADSettingsUpdate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Configuration rejected (validation), malformed body, a request that changes `ca_file` or `password_file`, or no password available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API writes are disabled (no -api-write at startup)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "api writes are disabled: restart the engine with -api-write (or SF_API_WRITE=1) to allow Active Directory settings"
        '501':
          description: The Active Directory surface is not armed (no -ad at startup)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The probe verdict (ok true/false with per-kind samples)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ADTestResult'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Optional: only enforced when the engine is started with
        `-api-token` (or `SF_API_TOKEN`). When enabled, every path
        below answers 401 without a valid `Authorization: Bearer`
        header, EXCEPT `/api/health`, which stays open for liveness
        probes and reveals nothing but `{"mode":"engine","status":"ok"}`.
  responses:
    Unauthorized:
      description: |
        Missing or wrong Bearer credential while the API token is
        configured. Carries a `WWW-Authenticate: Bearer` challenge and
        a JSON body naming the flag/env to configure. `/api/health`
        never answers 401.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "unauthorized: send 'Authorization: Bearer <token>' (configure it with -api-token/SF_API_TOKEN)"
    WritesDisabled:
      description: |
        The write surface is not armed: the engine is running without
        `-api-write` (or `SF_API_WRITE=1`), so `POST`/`DELETE` on
        `/api/suppressions` are refused before any validation. The body
        names the flag, like the 401 names the token. Arming also
        requires the bearer gate beyond loopback: an engine with no
        `-api-token` and a non-loopback bind refuses to arm writes at
        startup.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "api writes are disabled: restart the engine with -api-write (or SF_API_WRITE=1) to allow suppression writes"
  parameters:
    Host:
      name: host
      in: query
      required: false
      description: Exact host filter, case-insensitive.
      schema:
        type: string
    Severity:
      name: severity
      in: query
      required: false
      description: |
        Alert-only. Comma-separated severities to keep; anything else
        answers 400.
      schema:
        type: string
        example: critical,high
    RuleId:
      name: rule_id
      in: query
      required: false
      description: Alert-only. Exact rule id filter.
      schema:
        type: string
    EventType:
      name: type
      in: query
      required: false
      description: Event-only. Exact event type filter (e.g. `process.create`).
      schema:
        type: string
    Since:
      name: since
      in: query
      required: false
      description: |
        Lower time bound (inclusive window handled by the engine):
        RFC 3339 timestamp, or a positive duration counted back from now
        (`90m`, `24h`). Invalid values answer 400.
      schema:
        type: string
        example: 24h
    Until:
      name: until
      in: query
      required: false
      description: |
        Upper time bound. Same accepted forms as `since`; must not be
        earlier than `since`.
      schema:
        type: string
    Q:
      name: q
      in: query
      required: false
      description: |
        Free-text substring filter (case-insensitive) across identifiers
        and context: for alerts rule id/name, host, user, summary,
        message, event type, tags; for events id, type, source, host,
        user, process name/command line, file path, network
        destination/domain, registry key, access target.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum items to return. Non-numeric values fall back to the
        default; anything above 1000 (the ring size) is capped.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
        default: 200
    ExportFormat:
      name: format
      in: query
      required: false
      description: Download format. Defaults to `jsonl` when omitted.
      schema:
        type: string
        enum: [jsonl, csv]
        default: jsonl
  schemas:
    HotHost:
      type: object
      description: one host's decayed risk score (package A1 of the owner's roadmap).
        A triage-prioritization signal — which hosts are making noise that looks dangerous
        right now — not a compromise verdict.
      required: [host, score, alerts, last_seen]
      properties:
        host:
          type: string
          description: hostname the risk accumulated on
        score:
          type: number
          format: double
          description: current decayed score, rounded to 2 decimals (one critical alert
            starts at 10 and halves every 30 minutes without new alerts)
        alerts:
          type: integer
          description: alerts counted for this host since it started being tracked
        last_seen:
          type: string
          format: date-time
          description: timestamp (RFC 3339, UTC) of the most recent alert on this host
    Health:
      type: object
      required: [status, mode]
      properties:
        status:
          type: string
          enum: [ok]
        mode:
          type: string
          enum: [engine]
    Stats:
      type: object
      required:
        - uptime_s
        - events_total
        - dropped
        - ingest_rejected
        - ingest_identities
        - ingest_identity_violations
        - events_per_min
        - alerts_total
        - by_severity
        - rules_count
        - rules_types
        - events_buffered
        - webhook_sent
        - webhook_failed
        - webhook_dropped
        - elastic_sent
        - elastic_failed
        - elastic_dropped
        - splunk_sent
        - splunk_failed
        - splunk_dropped
        - suppressions_active
        - known_software_active
        - correlator_states
        - correlator_sequences
        - correlator_cap
        - store_enabled
        - store_write_failures
        - store_events
        - store_alerts
        - store_id_conflicts
        - mode
        - risk_hosts_tracked
        - hot_hosts
        - beacons_tracked
        - beacons_cap
        - beacons_fired
        - threshold_rules
        - threshold_keys
        - threshold_fired
        - intel_indicators
        - intel_lists
        - intel_hits
        - baseline_hosts
        - baseline_learning
        - baseline_novelties
        - notify_channels
        - version
        - alert_latency
        - store_size_bytes
        - certificates
        - beacon_quota_rejected
        - threshold_quota_rejected
        - ring_dropped_events
        - ring_dropped_alerts
        - quota_top_hosts
      properties:
        suppressions_active:
          type: integer
          description: non-expired entries in the operator allowlist
        known_software_active:
          type: integer
          description: entries in the known-software list (§2.2); 0 when -known-software is not armed
        store_enabled:
          type: boolean
          description: whether the engine runs with persistent SQLite storage (-store)
        store_write_failures:
          type: integer
          format: int64
          minimum: 0
          description: cumulative failed event or alert writes since API process start;
            affected evidence may exist only in memory. This is not a current database health probe.
        store_events:
          type: integer
          format: int64
          description: events currently persisted in the store (0 while store_enabled is false;
            includes rows that predate the current process start and survives restarts)
        store_alerts:
          type: integer
          format: int64
          description: alerts currently persisted in the store (0 while store_enabled is false)
        store_id_conflicts:
          type: integer
          format: int64
          minimum: 0
          description: event writes refused since process start because the id was already
            stored with a different payload. Stored evidence is append-only (first write wins);
            a non-zero value means a feed re-sent an id with other content (possible forgery
            or id collision). 0 while store_enabled is false.
        uptime_s:
          type: integer
          description: seconds since the API hub started
        events_total:
          type: integer
          format: int64
          description: events ingested since start (accepted by the TCP listener)
        dropped:
          type: integer
          format: int64
          description: malformed events discarded by the ingest decoder (the
            connection receives an ack error and stays open; the listener
            applies backpressure instead of dropping on a full channel)
        ingest_rejected:
          type: integer
          format: int64
          description: connections closed by the ingest shared-token
            handshake (no AUTH line, wrong or missing token, AUTH sent to
            a tokenless engine, or auth timeout) — how visible probes
            against a remote bind show up; zero while auth is disabled
        ingest_identities:
          type: integer
          minimum: 0
          description: per-sensor ingest identities configured with -ingest-identities
            (0 = shared token only or auth disabled)
        ingest_identity_violations:
          type: integer
          format: int64
          minimum: 0
          description: events refused since start because the sending sensor reported a
            host outside the binding of its ingest identity — a sensor speaking for
            another machine is a compromise signal
        events_per_min:
          type: integer
          description: events received in the last 60 seconds
        alerts_total:
          type: integer
          description: alerts raised since start (dedup excluded)
        by_severity:
          type: object
          additionalProperties:
            type: integer
          description: alerts_total broken down by severity
        rules_count:
          type: integer
          description: currently loaded rules (hot-reload aware)
        rules_types:
          type: array
          items:
            type: string
          description: distinct event types covered by the rule set
        events_buffered:
          type: integer
          description: events currently held in the API ring (max 1000)
        webhook_sent:
          type: integer
          format: int64
          description: webhook deliveries acknowledged with 2xx
        webhook_failed:
          type: integer
          format: int64
          description: webhook deliveries that exhausted their 3 attempts
        webhook_dropped:
          type: integer
          format: int64
          description: alerts discarded because the webhook queue (512) saturated
        elastic_sent:
          type: integer
          format: int64
          description: alerts bulk-indexed into Elasticsearch (items accepted by
            _bulk); retries are idempotent thanks to the deterministic per-alert _id
        elastic_failed:
          type: integer
          format: int64
          description: alerts the Elasticsearch sink gave up on (3 attempts, or
            permanently rejected items such as mapping errors)
        elastic_dropped:
          type: integer
          format: int64
          description: alerts discarded because the Elasticsearch queue (512) saturated
        splunk_sent:
          type: integer
          format: int64
          description: HEC events accepted by the Splunk collector (HTTP 2xx with
            a zero ack code)
        splunk_failed:
          type: integer
          format: int64
          description: HEC events the Splunk sink gave up on (3 attempts, or
            permanent rejections such as a non-zero ack code with HTTP 200)
        splunk_dropped:
          type: integer
          format: int64
          description: alerts discarded because the Splunk queue (512) saturated
        correlator_states:
          type: integer
          description: in-flight (sequence, host) chains currently tracked by the
            kill-chain correlator; compare against correlator_cap to watch
            headroom — reaching the cap means NEW hosts silently stop being
            tracked until states are pruned (Reload) or completed
        correlator_sequences:
          type: integer
          description: kill-chain sequences loaded from the sequences/ directory;
            zero means the correlator is off (no directory found)
        correlator_cap:
          type: integer
          description: hard cap of tracked chains (maxTrackedStates in
            internal/correlate, 8192); a hostile feed inventing hostnames is
            the usual reason to approach it
        mode:
          type: string
          enum: [engine]
        risk_hosts_tracked:
          type: integer
          description: hosts currently carrying a non-cold per-host risk score (package A1
            of the roadmap). Scores accumulate fixed weights per alert severity (critical 10,
            high 5, medium 2, low 1, info 0) and decay with a 30-minute half-life; hosts
            whose score decays to zero stop counting here. Triage status deliberately does
            not affect the score — it models detection activity, not operator judgment.
        hot_hosts:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/HotHost'
          description: top 5 hosts by current decayed risk score, highest first (ties
            broken by hostname for deterministic output)
        beacons_tracked:
          type: integer
          description: beacon keys currently holding in-window connection evidence (package
            A3 of the roadmap). One key is one (profile, host, destination) triple;
            compare against beacons_cap to watch headroom — past the cap the weakest
            keys (fewest accumulated samples) are evicted first, so a flood of unique
            fake destinations can never wash out evidence that is building
        beacons_cap:
          type: integer
          description: hard cap of tracked beacon keys (MaxKeys in internal/beacon, 8192);
            a hostile feed inventing destinations is the usual reason to approach it
        beacons_fired:
          type: integer
          format: int64
          description: beacon alerts emitted since engine start (across profile
            hot-reloads; each alert carries the profile id as rule_id)
        threshold_rules:
          type: integer
          description: volumetric threshold definitions currently loaded (package
            A2 of the roadmap). Zero when the thresholds file is absent
        threshold_keys:
          type: integer
          description: threshold aggregation keys currently holding in-window
            evidence; one key is one (definition, host, group_by value) triple.
            Compare against the per-rule quota (2048) documented in README to
            watch saturation — a flood of unique group values consumes only
            the offending rule's own quota
        threshold_fired:
          type: integer
          format: int64
          description: threshold alerts emitted since engine start (each alert
            carries the definition id as rule_id)
        intel_indicators:
          type: integer
          description: distinct threat-intel indicators loaded from the -intel
            directory (0 without lists)
        intel_lists:
          type: integer
          description: threat-intel list files loaded
        intel_hits:
          type: integer
          format: int64
          description: threat-intel hits that raised an alert since engine start
            (after the per-indicator and host cooldown)
        baseline_hosts:
          type: integer
          description: hosts tracked by the per-host process baseline
        baseline_learning:
          type: integer
          description: hosts still inside their learning period (-baseline-learn)
        baseline_novelties:
          type: integer
          format: int64
          description: never-seen processes reported since engine start
        notify_channels:
          type: array
          description: one delivery row per external notification channel
            configured via -notify (Slack, Telegram, email); empty when the
            engine runs without the flag. sent/failed/dropped mirror the
            webhook counters semantics per channel; filtered counts alerts
            skipped by the channel's min_severity floor (operator-configured
            silence, reported as data).
          items:
            $ref: '#/components/schemas/NotifyChannelStats'
        version:
          type: string
          description: engine version the running binary was built with
            (the same string `engine version` prints); "" when unset
        alert_latency:
          type: object
          description: ingest-to-alert latency (SET-3), measured from the
            event's own sensor-side timestamp to the moment its alert was
            raised by the engine, in milliseconds. count is the number of
            raised alerts observed since start (0 means no alerts yet, not
            zero latency); p50_ms/p95_ms/max_ms summarize the last 1024
            observations. Sensor clocks far ahead of the engine are skipped,
            never clamped into flattering zeros.
          properties:
            count:
              type: integer
              format: int64
              description: raised alerts observed since engine start
            p50_ms:
              type: number
              format: double
              description: median ingest-to-alert latency (ms)
            p95_ms:
              type: number
              format: double
              description: 95th percentile ingest-to-alert latency (ms)
            max_ms:
              type: number
              format: double
              description: worst ingest-to-alert latency in the window (ms)
        store_size_bytes:
          type: integer
          format: int64
          description: durable on-disk size of the SQLite store as SQLite
            accounts it (page_count x page_size; transient -wal/-shm siblings
            excluded). 0 while store_enabled is false.
        certificates:
          type: object
          description: expiry of both TLS listeners (SET-3). present=false and
            empty strings when that listener runs without TLS; not_after is
            RFC 3339 UTC. The console warns before a pair lapses instead of
            discovering it on the day sensors fail to reconnect.
          properties:
            api:
              $ref: '#/components/schemas/ADCertExpiry'
            ingest:
              $ref: '#/components/schemas/ADCertExpiry'
        beacon_quota_rejected:
          type: integer
          format: int64
          description: new beacon keys refused because the host's own admission
            quota was full (v1.1 per-team quotas -- one noisy machine may not
            monopolize the shared key table). Existing keys of the saturated
            host keep counting and firing; only new ones are refused.
        threshold_quota_rejected:
          type: integer
          format: int64
          description: new threshold keys refused because the host's own admission
            quota was full (v1.1 per-team quotas, same admission-ceiling
            semantics as the per-rule quota; dead evidence is purged before the
            refusal, so a host whose keys all expired recovers itself).
        ring_dropped_events:
          type: integer
          format: int64
          description: events rotated out of the in-memory view ring since API
            start. The rings trim oldest-first, so a noisy host filling the
            ring washes the others' recent records out -- this counter keeps
            that loss visible. Full history stays in SQLite when -store is armed.
        ring_dropped_alerts:
          type: integer
          format: int64
          description: alerts rotated out of the in-memory view ring since API
            start (same semantics as ring_dropped_events).
        quota_top_hosts:
          type: array
          description: bounded top rows (8, worst first) of the per-host
            pressure view -- ring rotation of each host's records and its
            per-detector admission refusals; empty when nothing was refused
            or rotated. /metrics serves the same totals without host labels
            to keep series cardinality bounded.
          items:
            $ref: '#/components/schemas/QuotaHostRow'
    QuotaHostRow:
      type: object
      required: [host, ring_events, ring_alerts, beacon, threshold]
      properties:
        host:
          type: string
          description: lowercased host name
        ring_events:
          type: integer
          format: int64
          description: events of this host rotated out of the view ring
        ring_alerts:
          type: integer
          format: int64
          description: alerts of this host rotated out of the view ring
        beacon:
          type: integer
          format: int64
          description: beacon keys of this host refused by its own quota
        threshold:
          type: integer
          format: int64
          description: threshold keys of this host refused by its own quota
    ADCertExpiry:
      type: object
      required: [present, not_after, path]
      properties:
        present:
          type: boolean
          description: whether the listener runs with TLS
        not_after:
          type: string
          description: certificate expiry, RFC 3339 UTC ("" while absent)
        path:
          type: string
          description: configured certificate file ("" while absent)
    ADStatus:
      type: object
      required: [connected, last_sync_at, last_success_at, next_sync_at,
        last_error, truncated, syncs, objects, warnings]
      properties:
        connected:
          type: boolean
          description: the last sync attempt reached the server and bound
        last_sync_at:
          type: string
          nullable: true
          description: RFC 3339 instant of the last sync attempt (null until one)
        last_success_at:
          type: string
          nullable: true
          description: RFC 3339 instant of the last completed snapshot
        next_sync_at:
          type: string
          nullable: true
          description: RFC 3339 instant of the next scheduled sync (null while stopped)
        last_error:
          type: string
          description: the last failed attempt's reason, credential-free
            (server and result code only — the password is never logged
            nor interpolated)
        truncated:
          type: boolean
          description: the object cap stopped the last sync; the snapshot is partial
        syncs:
          type: integer
          format: int64
          description: sync attempts since engine start
        objects:
          type: object
          description: per-kind counts of the last completed snapshot
          properties:
            users:
              type: integer
              format: int64
            groups:
              type: integer
              format: int64
            computers:
              type: integer
              format: int64
            ous:
              type: integer
              format: int64
        warnings:
          type: array
          description: connector-level observations (e.g. the service account
            being effectively privileged — it must be a plain domain user)
          items:
            type: string
    ADObject:
      type: object
      required: [dn, kind, name, user_account_control, admin_count,
        pwd_last_set_unix, last_logon_unix, spn_count, enc_types,
        when_changed_unix]
      properties:
        dn:
          type: string
          description: distinguished name of the directory object
        kind:
          type: string
          enum: [user, group, computer, ou]
        name:
          type: string
          description: sAMAccountName (or the OU's name)
        sid:
          type: string
          description: canonical SID (S-1-...) when the object has one
        user_account_control:
          type: integer
          format: int64
          description: raw userAccountControl flags (bit 0x2 = disabled)
        admin_count:
          type: integer
          format: int64
        pwd_last_set_unix:
          type: integer
          format: int64
          description: unix seconds of pwdLastSet (0 = never/unknown)
        last_logon_unix:
          type: integer
          format: int64
          description: unix seconds of lastLogonTimestamp (0 = never/unknown)
        spn_count:
          type: integer
          description: number of servicePrincipalName values
        enc_types:
          type: integer
          format: int64
          description: msDS-SupportedEncryptionTypes (0 = unset, RC4 fallback)
        os:
          type: string
          description: operatingSystem + version (computers)
        when_changed_unix:
          type: integer
          format: int64
          description: unix seconds of whenChanged (0 = unknown)
        attributes:
          type: object
          additionalProperties:
            type: string
          description: the remaining security-relevant attributes verbatim
            (UPN, mail, dNSHostName, description, SPN list, member count)
    ADObjectsPage:
      type: object
      required: [total, offset, objects]
      properties:
        total:
          type: integer
          description: rows matching the filter (for the pager)
        offset:
          type: integer
          description: page start
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ADObject'
    ADPosture:
      type: object
      required: [ready, generated_at, score, summary, findings,
        objects_checked, inactive_days, krbtgt_max_age_days]
      properties:
        ready:
          type: boolean
          description: false while the connector is armed but no sync has
            completed yet (absence is never a fabricated zero score)
        generated_at:
          type: string
          description: RFC 3339 instant the analysis was computed ("" while not ready)
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: the 0-100 posture score (null while not ready)
        summary:
          type: object
          additionalProperties:
            type: integer
          description: number of FINDING CLASSES per severity (critical/high/medium/low)
        findings:
          type: array
          items:
            type: object
            required: [id, title, severity, description, remediation, count,
              objects, objects_truncated]
            properties:
              id:
                type: string
                description: stable finding identifier (e.g. krbtgt_password_age)
              title:
                type: string
              severity:
                type: string
                enum: [critical, high, medium, low]
              description:
                type: string
                description: what the finding means, in plain language
              remediation:
                type: string
                description: what to do about it, in plain language
              count:
                type: integer
                description: affected objects (the true total, list is capped)
              objects:
                type: array
                items:
                  type: object
                  properties:
                    dn:
                      type: string
                    name:
                      type: string
                    detail:
                      type: string
              objects_truncated:
                type: boolean
                description: more objects are affected than the 50 listed
        objects_checked:
          type: integer
          description: users + groups + computers the analysis walked
        inactive_days:
          type: integer
          description: the configured stale-account threshold the findings used
        krbtgt_max_age_days:
          type: integer
          description: the configured krbtgt password-age threshold
    ADPostureHistory:
      type: object
      required: [points]
      properties:
        points:
          type: array
          description: one score point per completed sync, oldest first
          items:
            type: object
            required: [at, score]
            properties:
              at:
                type: integer
                format: int64
                description: unix seconds of the sync
              score:
                type: integer
                description: the 0-100 score that sync computed
    ADSettings:
      type: object
      required: [server, port, start_tls, base_dn, ca_file, ca_file_present,
        bind_dn, password_file, password_stored, interval_seconds,
        include_ous, exclude_ous, max_objects, page_size, inactive_days,
        krbtgt_max_age_days, work_start, work_end, work_days, reload_pending]
      description: |
        The effective connector configuration. The credential is not part
        of the document at all: `password_stored` says whether its SEC-2
        envelope file exists on the engine host, and nothing more.
      properties:
        server:
          type: string
          description: AD DS hostname (also the TLS ServerName pinned in the handshake)
        port:
          type: integer
          description: 636 for LDAPS, 389 for StartTLS
        start_tls:
          type: boolean
          description: true upgrades ldap:// with StartTLS before the bind
        base_dn:
          type: string
          description: subtree the connector reads
        ca_file:
          type: string
          description: path of the CA PEM bundle on the engine host
        ca_file_present:
          type: boolean
          description: the CA file exists right now (presence, not content)
        bind_dn:
          type: string
          description: read-only service account DN
        password_file:
          type: string
          description: path of the credential envelope on the engine host
        password_stored:
          type: boolean
          description: the credential envelope exists right now; the secret itself is never served
        interval_seconds:
          type: integer
          description: seconds between syncs (minimum 300)
        include_ous:
          type: array
          description: when set, only objects under these OUs sync
          items:
            type: string
        exclude_ous:
          type: array
          description: subtrees pruned after the include filter
          items:
            type: string
        max_objects:
          type: integer
          description: per-sync object ceiling (the fetch STOPS at the cap)
        page_size:
          type: integer
          description: RFC 2696 page size (ceiling 1000)
        inactive_days:
          type: integer
          description: AD-2 stale-account threshold in days
        krbtgt_max_age_days:
          type: integer
          description: AD-2 krbtgt password-age threshold in days
        work_start:
          type: string
          description: work-hours window start (HH:MM 24h; empty when unset)
        work_end:
          type: string
          description: work-hours window end (HH:MM 24h; empty when unset)
        work_days:
          type: array
          description: working weekdays 0=Sunday..6=Saturday (default Mon-Fri when the window is set)
          items:
            type: integer
        reload_pending:
          type: boolean
          description: >-
            a committed settings change is being applied to the live
            connector right now; the swap runs inside the PUT's serialized
            write, so a concurrent GET during that window sees true while
            the PUT response itself reports the resolved state
        last_reload_at:
          type: string
          description: RFC 3339 instant of the last reload attempt
        last_reload_error:
          type: string
          description: why the last reload could not take over (empty when it succeeded; the committed config applies on restart)
    ADSettingsUpdate:
      type: object
      description: |
        Settings change (PUT) or candidate (test): every field optional,
        a present field REPLACES the current value; absent fields keep
        theirs (or the engine default on a fresh commit). `password` is
        write-only — it updates the credential envelope and is never
        stored in, or echoed back as, configuration.
      properties:
        server:
          type: string
        port:
          type: integer
        start_tls:
          type: boolean
        base_dn:
          type: string
        ca_file:
          type: string
        bind_dn:
          type: string
        password_file:
          type: string
        password:
          type: string
          description: write-only; empty is rejected — omit the field to keep the stored credential
        interval_seconds:
          type: integer
        include_ous:
          type: array
          items:
            type: string
        exclude_ous:
          type: array
          items:
            type: string
        max_objects:
          type: integer
        page_size:
          type: integer
        inactive_days:
          type: integer
        krbtgt_max_age_days:
          type: integer
        work_start:
          type: string
        work_end:
          type: string
        work_days:
          type: array
          items:
            type: integer
    ADTestResult:
      type: object
      required: [ok, tls_version, cipher_suite, bind_dn, base_dn, kinds, duration_ms]
      description: |
        Verdict of one "Probar conexión" probe. `ok: false` means the
        probe RAN and the connection did not (dial, TLS, credentials or
        readability); the reason travels credential-free in `error`.
      properties:
        ok:
          type: boolean
          description: bind succeeded and every kind search answered
        tls_version:
          type: string
          description: negotiated TLS version (LDAPS; empty over StartTLS, whose handshake the client library performs internally)
        cipher_suite:
          type: string
          description: negotiated cipher suite (LDAPS only, same caveat)
        bind_dn:
          type: string
          description: the service account the probe bound as
        base_dn:
          type: string
          description: the subtree the probe sampled
        kinds:
          type: array
          description: per-kind readout (sample, not a directory dump)
          items:
            type: object
            required: [kind, count, cap, truncated, sample_dns]
            properties:
              kind:
                type: string
                enum: [user, group, computer, ou]
              count:
                type: integer
                description: entries actually read (a floor when truncated)
              cap:
                type: integer
                description: the per-kind sample ceiling (200)
              truncated:
                type: boolean
                description: the ceiling was hit; the directory holds at least `count`
              sample_dns:
                type: array
                description: first DNs read, for the console's preview
                items:
                  type: string
        duration_ms:
          type: integer
          format: int64
          description: wall-clock duration of the whole probe
        error:
          type: string
          description: credential-free reason when ok is false
    NotifyChannelStats:
      type: object
      description: |
        Delivery counters of one external notification channel (C2).
        name is the operator label from the -notify config (defaults to
        the channel type when unnamed); type is slack, telegram or email.
      required: [name, type, sent, failed, dropped, filtered]
      properties:
        name:
          type: string
          description: channel label used in /metrics as the channel label value
        type:
          type: string
          enum: [slack, telegram, email]
        sent:
          type: integer
          format: int64
          description: deliveries accepted by the receiver (2xx)
        failed:
          type: integer
          format: int64
          description: deliveries that exhausted their 3 attempts
        dropped:
          type: integer
          format: int64
          description: alerts discarded because the channel queue (256) saturated
        filtered:
          type: integer
          format: int64
          description: alerts skipped by the channel min_severity floor
    Event:
      type: object
      description: |
        Unified event schema (the wire contract, pkg/model). Sensors
        emit it, the engine validates and enriches it. Payload objects
        depend on type and may coexist (for example process and file).
        Imported SOC observations use attributes; source is declared, not attested.
      required: [id, timestamp, type, source, host]
      properties:
        id:
          type: string
          description: sender-provided identifier; collectors use a stable 32-hex digest of source, observer and record
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - process.create
            - process.terminate
            - process.access
            - file.write
            - network.connect
            - image.load
            - registry.set
            - network.alert
            - host.query
            - honeypot.connect
            - honeypot.login
            - honeypot.command
            - network.firewall
            - email.message
        source:
          type: string
          description: declared sender, e.g. sysmon, etw, simulate, suricata, zeek, osquery, cowrie, windows-firewall or eml
        host:
          type: string
        user:
          type: string
        process:
          $ref: '#/components/schemas/Process'
        target:
          $ref: '#/components/schemas/Process'
        access:
          type: object
          description: process-handle telemetry (Sysmon EID 10)
          properties:
            granted_access:
              type: string
              description: hex access mask, e.g. 0x1010
            call_trace:
              type: string
        file:
          type: object
          properties:
            path:
              type: string
            extension:
              type: string
            size_bytes:
              type: integer
              format: int64
            hashes:
              type: object
              additionalProperties:
                type: string
              description: digests keyed by algorithm (sha256, md5)
        network:
          type: object
          properties:
            protocol:
              type: string
            source_ip:
              type: string
            source_port:
              type: integer
            destination_ip:
              type: string
            destination_port:
              type: integer
            domain:
              type: string
        registry:
          type: object
          properties:
            key:
              type: string
              example: HKCU\Software\Microsoft\Windows\CurrentVersion\Run
            value_name:
              type: string
            value:
              type: string
              description: data written
            operation:
              type: string
              enum: [SetValue, CreateKey, DeleteKey, RenameKey]
        tags:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: string
          description: declared source observations, bounded and normalized by the collector; separate from enrichment
        enrichment:
          type: object
          additionalProperties:
            type: string
          description: added by the engine, never mutates the evidence fields
    Process:
      type: object
      required: [pid, name]
      properties:
        pid:
          type: integer
        ppid:
          type: integer
        name:
          type: string
        command_line:
          type: string
        image:
          type: string
        hashes:
          type: object
          additionalProperties:
            type: string
    AlertSearchPage:
      type: object
      required: [items, source, has_more, next_cursor, page_cursor, scanned, scan_limited]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Alert'
        source:
          type: string
          enum: [memory, sqlite]
        has_more:
          type: boolean
          description: A continuation exists; it may examine records without matching lifecycle state.
        next_cursor:
          type: string
          description: Empty at the end, otherwise the cursor for the next request.
        page_cursor:
          type: string
          description: Cursor for revisiting this page with the same upper sequence.
        scanned:
          type: integer
          minimum: 0
          maximum: 5000
        scan_limited:
          type: boolean
          description: The request reached its evidence scan cap; continue instead of assuming no results.
    Alert:
      type: object
      description: |
        Structured alert raised by a rule hit (or a kill-chain
        completion). Identical payload on the JSON log line, the
        webhook body and the console/hub stream, so consumers speak
        one format. `message` and `notify` are rendered from the
        firing rule's `alert` action, when it declares one.

        The `status*` fields are the lifecycle overlay merged by
        GET /api/alerts (and the alerts export): `status` is always
        present there (`new` when no operator decision exists), the
        rest appear once the alert has been triaged. The raw payloads
        (log line, webhook, SSE alert frames) carry no status fields —
        an alert raised seconds ago is new by definition.
      required:
        - id
        - timestamp
        - rule_id
        - rule_name
        - severity
        - host
        - event_id
        - event_type
        - summary
        - matched_on
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: unique alert id assigned by the engine (the lifecycle key)
        timestamp:
          type: string
          format: date-time
        rule_id:
          type: string
        rule_name:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        host:
          type: string
        user:
          type: string
        event_id:
          type: string
          description: id of the event that triggered the alert
        event_type:
          type: string
        source:
          type: string
          description: source declaration of the triggering observation
        attributes:
          $ref: '#/components/schemas/Event/properties/attributes'
        network:
          $ref: '#/components/schemas/Event/properties/network'
        summary:
          type: string
          description: human-readable one-liner (may contain attacker-controlled text)
        message:
          type: string
          description: rendered from the rule's alert action template, when present ({host}-style placeholders already substituted)
        notify:
          type: boolean
          description: the rule asks for external notification (alert action config)
        matched_on:
          type: array
          items:
            type: string
          description: dotted fields whose conditions matched
        tags:
          type: array
          items:
            type: string
          description: MITRE ATT&CK tags of the rule
        actions:
          type: array
          items:
            type: string
          description: action names declared by the rule; declaration is not proof of execution
        enrichment:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [new, acknowledged, closed]
          description: operator triage state (read-side overlay, always present)
        decision:
          type: string
          enum: [false_positive, authorized_activity, confirmed_incident]
          description: |
            operator verdict on the alert (read-side overlay, present
            once a verdict is recorded): false_positive feeds VIZ-3's
            «falso positivo» state and the noise report's
            false_positive_pct
        status_note:
          type: string
          description: free-text triage note from the operator decision
        status_by:
          type: string
          description: operator name as free text (the shared token does not identify users)
        status_at:
          type: string
          format: date-time
          description: when the status was recorded
    AlertStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, acknowledged, closed]
          description: '`new` doubles as the explicit reopen'
        decision:
          type: string
          enum: [false_positive, authorized_activity, confirmed_incident]
          description: |
            operator verdict (WHAT the alert was, as opposed to status,
            WHERE it sits in the workflow). Optional: omitted = no
            verdict, and a later request without it clears any previous
            one (the body is the full triage record)
        note:
          type: string
          maxLength: 2000
          description: triage note (what was seen, what was done)
        by:
          type: string
          maxLength: 200
          description: operator name, informational only
    ForensicBundle:
      type: object
      description: |
        The evidence document frozen at detection time by the engine's
        flight recorder: the alert plus the host's event timeline that
        preceded it (window `-5m` to the alert, plus the triggering
        event itself; the newest `200` events are kept when the window
        overflows). Written atomically, readable back for the lifetime
        of the bundle directory.
      required: [alert, captured_at, host, window, timeline, summary]
      properties:
        alert:
          $ref: '#/components/schemas/Alert'
        captured_at:
          type: string
          format: date-time
          description: RFC 3339 (nanosecond) capture moment.
        host:
          type: string
          description: Host whose timeline was frozen.
        window:
          type: string
          description: Human-readable window description (e.g. "5m0s
            before alert (plus the triggering event)").
        timeline:
          type: array
          description: Host events inside the window, oldest first,
            capped at 200 entries (the tail closest to the alert is
            the evidence an investigator reads first).
          items:
            $ref: '#/components/schemas/Event'
        summary:
          type: object
          description: Counted shape of the timeline — what an
            operator scans before reading a single event.
          required: [events, process_creates, network_connects, file_writes, registry_sets, process_accesses, other, distinct_users, distinct_images]
          properties:
            events:
              type: integer
            process_creates:
              type: integer
            network_connects:
              type: integer
            file_writes:
              type: integer
            registry_sets:
              type: integer
            process_accesses:
              type: integer
            other:
              type: integer
            distinct_users:
              type: integer
            distinct_images:
              type: array
              items:
                type: string

    AlertLifecycle:
      type: object
      description: One lifecycle record as stored (also the `alert_lifecycle` SSE frame payload)
      required: [alert_id, status, at]
      properties:
        alert_id:
          type: string
          pattern: '^[0-9a-f]{16}$'
        status:
          type: string
          enum: [new, acknowledged, closed]
        decision:
          type: string
          enum: [false_positive, authorized_activity, confirmed_incident]
          description: present once a verdict is recorded; omitted otherwise
        note:
          type: string
        by:
          type: string
        at:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp of the decision
    Rule:
      type: object
      required:
        - id
        - name
        - description
        - severity
        - event_type
        - tags
        - conditions
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        event_type:
          type: string
        mitre:
          type: string
          description: derived from tags, e.g. T1059.001 (empty when the rule has no attack.t tag)
        tactic:
          type: string
          description: derived from tags, e.g. Execution (empty when absent)
        tags:
          type: array
          items:
            type: string
        conditions:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field:
                type: string
                description: dotted path into the event, e.g. process.command_line
              operator:
                type: string
                enum:
                  - eq
                  - neq
                  - contains
                  - contains_any
                  - startswith
                  - endswith
                  - regex
                  - in
                  - not_in
                  - gt
                  - lt
              value:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  - type: number
    SuppressionEntry:
      type: object
      description: |
        One suppression entry: the same fields and validation as a YAML
        entry (rule_id and host must not both be empty; an entry with
        only host silences every rule on that host, an entry with only
        rule_id silences that rule everywhere). Field caps guard the
        control file: rule_id 128, host 253, reason 2000, expires 40
        characters; the request body is capped at 8 KiB and the file at
        1000 entries via the write API. The optional `when` conditions
        (§2.3) narrow the entry to events whose fields match EVERY
        condition, evaluated with the same operators the rule engine
        uses (8 conditions max; field 128 and value 2000 characters;
        value lists up to 16 items). A conditional entry only
        silences alerts whose triggering event exists (rule hits,
        intel and baseline-novelty alerts); aggregated alerts
        (kill-chains, beaconing, volumetric) carry no single event and
        are therefore never silenced by one — the failure direction is
        an alert the operator still sees.
      properties:
        rule_id:
          type: string
          maxLength: 128
          description: rule id to silence (empty = every rule, as long as host is set)
        host:
          type: string
          maxLength: 253
          description: host to scope the entry to (empty = every host); compared case-insensitively
        when:
          type: array
          maxItems: 8
          description: optional event-field conditions, ALL of which must hold for the entry to silence a hit (§2.3)
          items:
            type: object
            required: [field, operator]
            properties:
              field:
                type: string
                maxLength: 128
                description: dotted event field (e.g. process.command_line); events without the field never match
              operator:
                type: string
                maxLength: 16
                description: one of the rule engine's operators (eq, neq, contains, contains_any, startswith, endswith, regex, in, not_in, gt, lt and the case-insensitive i* variants)
              value:
                description: comparison value (string, number, boolean or a list of up to 16 of them)
        reason:
          type: string
          maxLength: 2000
          description: free-text justification stored in the file
        expires:
          type: string
          maxLength: 40
          description: RFC 3339 expiration (e.g. 2026-10-02T00:00:00Z); empty = until removed
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: actionable one-line reason (client-side problems name the fix; server-side problems point to the engine log)
    ScenarioLibrary:
      type: object
      required: [armed, dir, count, scenarios]
      properties:
        armed:
          type: boolean
          description: always true when the route answers 200 (an unarmed engine answers 501)
        dir:
          type: string
          description: the -scenarios directory the library was loaded from
        count:
          type: integer
          description: number of loaded scenarios
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioView'
    ScenarioView:
      type: object
      required: [id, name, description, attack, host, events, expected, origin]
      properties:
        id:
          type: string
          description: stable scenario identifier (sim-...)
        name:
          type: string
        description:
          type: string
        attack:
          type: array
          description: ATT&CK techniques the sequence exercises (e.g. T1003.001)
          items:
            type: string
        host:
          type: string
          description: synthetic host of the events (LAB-SIM- prefix)
        events:
          type: integer
          description: how many inert events the replay sends
        expected:
          type: array
          description: alerts that MUST fire for the scenario to pass
          items:
            $ref: '#/components/schemas/ScenarioExpected'
        origin:
          type: string
          description: file the scenario was loaded from
    ScenarioExpected:
      type: object
      required: [rule, min]
      properties:
        rule:
          type: string
          description: shipped rule id or kill-chain sequence id
        min:
          type: integer
          description: minimum alerts required (below 1 loads as 1)
    ScenarioRunStart:
      type: object
      properties:
        only:
          type: array
          description: restrict the battery to these scenario ids (empty or absent = the whole library)
          items:
            type: string
        timeout_ms:
          type: integer
          description: per-scenario wait before an expectation is declared missing (clamped to 1000..30000; default 10000)
    ScenarioRun:
      type: object
      required: [run_id, started_at, status, total, detected, missing, catalog_errors, errors, duration_ms, pass_rate]
      properties:
        run_id:
          type: string
          description: run identifier (run- + 16 hex characters)
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          description: absent while the run is in flight
        status:
          type: string
          enum: [running, completed]
        total:
          type: integer
          description: scenarios selected for the run
        detected:
          type: integer
        missing:
          type: integer
        catalog_errors:
          type: integer
          description: scenarios whose expectations name detections the engine does not have (authoring bug, not a detection failure)
        errors:
          type: integer
        duration_ms:
          type: integer
          description: wall-clock duration of the whole battery (0 while running)
        pass_rate:
          type: number
          format: float
          description: detected / total in 0..1 (the trend-graph series)
        results:
          type: array
          description: per-scenario outcomes; the history list omits them, the detail endpoint serves them
          items:
            $ref: '#/components/schemas/ScenarioResult'
    ScenarioResult:
      type: object
      required: [scenario_id, name, attack, status, host, events_sent, duration_ms]
      properties:
        scenario_id:
          type: string
        name:
          type: string
        attack:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [detected, missing, catalog, error]
        host:
          type: string
          description: the scenario's synthetic host (LAB-SIM-...)
        events_sent:
          type: integer
        duration_ms:
          type: integer
          description: replay latency of this scenario
        missing:
          type: array
          description: expectations that did not reach their minimum (status missing)
          items:
            $ref: '#/components/schemas/ScenarioMissingExpectation'
        untagged:
          type: integer
          description: alerts raised without the simulation tag (an anomaly; always 0 in a healthy pipeline)
        detail:
          type: string
          description: human-readable reason for catalog/error outcomes
    ScenarioMissingExpectation:
      type: object
      required: [rule, expected, fired]
      properties:
        rule:
          type: string
        expected:
          type: integer
        fired:
          type: integer
    RespondKillRequest:
      type: object
      required: [host, pid, process_name, operator, reason]
      properties:
        host:
          type: string
          maxLength: 253
          description: must equal the engine host's hostname (R3) — the engine refuses to guess which host the PID belongs to
        pid:
          type: integer
          minimum: 2
          description: target PID; 0/1/negative are denied as pid_invalid (mass-signal semantics on Unix)
        process_name:
          type: string
          maxLength: 256
          description: expected real name of the target (platform-resolved basename); a mismatch denies with pid_mismatch
        operator:
          type: string
          maxLength: 64
          description: human operator assuming the action; must be on the -respond-operators allowlist
        reason:
          type: string
          maxLength: 512
          description: non-empty free text recorded in the audit line
        rule_id:
          type: string
          maxLength: 128
          description: optional rule or sequence that motivated the action
        alert_id:
          type: string
          maxLength: 64
          description: optional originating alert id
        idempotency_key:
          type: string
          maxLength: 128
          description: optional client key; a repeat answers 409, the bounded map forgets the oldest key at 1024 entries
    RespondKillExecuted:
      type: object
      required: [action_id, status, signal, mechanism]
      properties:
        action_id:
          type: string
          description: 32-hex id shared by the audit line and this response
        status:
          type: string
          enum: [executed]
        signal:
          type: string
          enum: [SIGKILL]
          description: fixed for iteration 1 (dictamen Q1)
        mechanism:
          type: string
          enum: [pidfd, fallback, handle]
          description: >-
            how the verified object was killed (R1: pinned object
            on Linux/Windows, fallback re-verifies the name
            immediately before the signal)
        fallback_reason:
          type: string
          description: >-
            present ONLY when mechanism=fallback: the errno name that
            made pidfd_open fail and forced the classic-kill path
            (enosys = kernel without pidfd, permanent and expected;
            emfile/enfile = fd-table exhaustion of a live mechanism,
            transient and worth watching; enomem/eperm/einval; unknown
            errnos render as errno_<number>). Absent for pidfd/handle.
    RespondKillDenied:
      type: object
      required: [error, action_id]
      properties:
        error:
          type: string
          description: one of the denial codes of the operation description (403 family), idempotency_repeated (409) or the 429 family
        action_id:
          type: string
          description: 32-hex id of the denied attempt, matching its audit line
    RespondState:
      type: object
      required: [armed, signal, operators_count, protected_count, audit_path, audit_size, audit_ceiling]
      properties:
        armed:
          type: boolean
          description: always true in a 200 (a disarmed engine answers the real 404)
        signal:
          type: string
          enum: [SIGKILL]
          description: fixed for iteration 1 (dictamen Q1)
        operators_count:
          type: integer
          description: LIVE allowlist size (the 15 s hot-reload changes it under a running engine)
        protected_count:
          type: integer
          description: LIVE count of the operator-supplied protected names (platform defaults apply at check time)
        operators_path:
          type: string
          description: -respond-operators path as armed at startup (omitted when empty)
        protected_path:
          type: string
          description: -respond-protected path as armed (omitted when not configured)
        audit_path:
          type: string
          description: -respond-audit JSONL path as armed
        audit_size:
          type: integer
          description: current audit file size in bytes (live)
        audit_ceiling:
          type: integer
          description: the 64 MiB ceiling (67108864); at or above it every action denies with audit_unavailable until the operator rotates the file
    RespondAuditRecord:
      type: object
      description: One attempt line of the -respond-audit JSONL, verbatim (R5a schema).
      required: [ts, action_id, decision, pid, process_name, operator, reason, host, source]
      properties:
        ts:
          type: string
          description: RFC 3339 Nano, UTC
        action_id:
          type: string
          description: one id per attempt, shared with the kill API response so an incident reviewer can join both
        decision:
          type: string
          enum: [executed, denied]
        code:
          type: string
          description: denial code (present when the decision is denied; a followup line carries the failed outcome of a committed send)
        pid:
          type: integer
          description: requested PID
        process_name:
          type: string
          description: name the operator requested
        resolved_name:
          type: string
          description: platform-resolved real basename when known (re-revision O1 - denials included)
        operator:
          type: string
        rule_id:
          type: string
        alert_id:
          type: string
        reason:
          type: string
        host:
          type: string
        signal:
          type: string
          enum: [SIGKILL]
          description: stamped by the writer on every attempt (Q1 fixed)
        mechanism:
          type: string
          enum: [pidfd, fallback, handle]
          description: how the verified object was killed (present once known)
        source:
          type: string
          description: client RemoteAddr of the attempt (R5a attribution)
        followup:
          type: boolean
          description: second line of a committed send whose signal failed - the JSONL never claims an execution that did not land
    RespondAuditResponse:
      type: object
      required: [records, skipped, truncated]
      properties:
        records:
          type: array
          description: most recent attempts, newest first
          items:
            $ref: '#/components/schemas/RespondAuditRecord'
        skipped:
          type: integer
          description: lines seen that are not records (torn tail of a concurrent append, malformed) - counted, never served as data
        truncated:
          type: boolean
          description: older records exist beyond the read window (rotation stays an operator task)
    Suppressions:
      type: object
      required: [active, entries]
      properties:
        active:
          type: integer
          description: same count as `stats.suppressions_active`
        entries:
          type: array
          items:
            type: object
            required: [rule_id]
            properties:
              rule_id:
                type: string
                description: suppressed rule id (empty string = all rules)
              host:
                type: string
                description: suppressed host, lowercased (empty = every host)
              reason:
                type: string
                description: free-text justification from the YAML file
              expires:
                type: string
                description: RFC 3339 expiration as written in the file (empty = until removed)
    Fleet:
      type: object
      required: [enabled, hosts, online, silent, idle, heartbeat_grace_min_s]
      properties:
        enabled:
          type: boolean
          description: false when the engine runs without an inventory
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/FleetHost'
        online:
          type: integer
        silent:
          type: integer
        idle:
          type: integer
        heartbeat_grace_min_s:
          type: integer
          description: shortest silence that marks a sensor silent
    BaselineHost:
      type: object
      required: [enabled, learn_s, host, known, learning, processes, full]
      properties:
        enabled:
          type: boolean
          description: false when novelties are disabled (-baseline-learn 0) or there is no baseline
        learn_s:
          type: integer
        host:
          type: string
          description: the requested host, lowercase
        known:
          type: boolean
        first_seen:
          type: string
          format: date-time
          description: when the host's learning started
        learning:
          type: boolean
        learning_until:
          type: string
          format: date-time
        processes:
          type: array
          items:
            type: string
        full:
          type: boolean
    Intel:
      type: object
      required: [enabled, dir, total, lists, baseline]
      properties:
        enabled:
          type: boolean
          description: false when the engine runs without an intel directory
        dir:
          type: string
        total:
          type: integer
          description: distinct indicators across all lists
        lists:
          type: array
          items:
            $ref: '#/components/schemas/IntelList'
        baseline:
          type: object
          required: [enabled, learn_s, hosts, learning]
          properties:
            enabled:
              type: boolean
            learn_s:
              type: integer
              description: learning period per host, in seconds (0 = disabled)
            hosts:
              type: integer
            learning:
              type: integer
              description: hosts still inside their learning period
    IntelList:
      type: object
      required: [name, file, indicators, by_kind, modified, skipped]
      properties:
        name:
          type: string
          description: file name without extension; alerts use intel-match-<name>
        file:
          type: string
        indicators:
          type: integer
        by_kind:
          type: object
          description: indicators per kind (ip, cidr, domain, hash)
          additionalProperties:
            type: integer
        modified:
          type: string
          format: date-time
        skipped:
          type: integer
          description: lines that were not comments and not a usable indicator
    FleetHost:
      type: object
      required: [host, status, first_seen, last_seen, events, events_last_5m, sources, peers]
      properties:
        host:
          type: string
        status:
          type: string
          enum: [online, silent, idle]
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        last_event_type:
          type: string
        events:
          type: integer
          description: events received since the engine started (heartbeats excluded)
        events_last_5m:
          type: integer
        sources:
          type: array
          items:
            type: string
        peers:
          type: array
          description: addresses of the connections that delivered the host's events (last four)
          items:
            type: string
        identity:
          type: string
          description: per-sensor ingest identity, when identities are configured
        sensor:
          $ref: '#/components/schemas/FleetSensor'
        silent_since:
          type: string
          format: date-time
    FleetSensor:
      type: object
      required: [interval_s, uptime_s, spooled, dropped, last_heartbeat]
      properties:
        kind:
          type: string
          description: etw, sysmon...
        version:
          type: string
        os:
          type: string
        run_mode:
          type: string
          enum: [service, console]
          description: how the sensor runs - "service" (Windows service manager, starts with the machine) or "console" (started by hand); absent for sensors that do not say
        capture:
          type: string
          description: what the sensor captures, e.g. process+network+registry
        interval_s:
          type: integer
        uptime_s:
          type: integer
        queue_cap:
          type: integer
        spooled:
          type: integer
        dropped:
          type: integer
        last_heartbeat:
          type: string
          format: date-time
    Sequence:
      type: object
      description: |
        One kill-chain sequence as the correlator loaded it. Steps are
        listed in declared order for display; matching itself is
        unordered (the correlator tracks which steps already matched
        per host, in any order, inside the window).
      required: [id, name, description, severity, window_seconds, tags, steps, step_rules, scope, min_hosts]
      properties:
        id:
          type: string
          description: stable sequence id (the alert rule_id of the completion)
        name:
          type: string
          description: human-readable campaign name shown in alerts
        description:
          type: string
          description: what completing the chain means, from the YAML file
        severity:
          type: string
          enum: [low, medium, high, critical]
          description: severity of the completion alert
        window_seconds:
          type: integer
          description: effective completion window in seconds (the configured
            window, or the 5-minute default compile applies)
        tags:
          type: array
          items:
            type: string
          description: tags copied onto the completion alert (MITRE, tactic)
        steps:
          type: array
          items:
            type: string
          description: step labels in declared order; a step with alternatives reads "rule A | rule B"
        step_rules:
          type: array
          description: the rule names that advance each step (exact match against the live rule set)
          items:
            type: array
            items:
              type: string
        scope:
          type: string
          enum: [host, user]
          description: host = the chain advances per host; user = one account followed across hosts
        min_hosts:
          type: integer
          description: distinct hosts a completed chain must span (1 for host scope)
    IncidentEntry:
      type: object
      required: [at, kind, text]
      properties:
        at:
          type: string
          format: date-time
        by:
          type: string
          description: free-text operator name (informational, not authenticated)
        kind:
          type: string
          enum: [created, status, severity, owner, alerts, note]
        text:
          type: string
    Incident:
      type: object
      required: [id, title, severity, status, hosts, alert_ids, timeline, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 4000
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        status:
          type: string
          enum: [open, investigating, contained, closed]
        owner:
          type: string
        hosts:
          type: array
          items:
            type: string
        alert_ids:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/IncidentEntry'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
    IncidentList:
      type: object
      required: [incidents, persistent]
      properties:
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        persistent:
          type: boolean
          description: false when the engine runs without -incidents (cases reset on restart)
    IncidentCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        summary:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        owner:
          type: string
        by:
          type: string
        alert_ids:
          type: array
          items:
            type: string
            pattern: '^[0-9a-f]{16}$'
        hosts:
          type: array
          items:
            type: string
    IncidentPatch:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        status:
          type: string
          enum: [open, investigating, contained, closed]
        owner:
          type: string
        by:
          type: string
    IncidentAlertsAdd:
      type: object
      required: [alert_ids]
      properties:
        alert_ids:
          type: array
          maxItems: 500
          items:
            type: string
            pattern: '^[0-9a-f]{16}$'
        hosts:
          type: array
          items:
            type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        by:
          type: string
    IncidentNote:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 4000
        by:
          type: string
    RuleTestRequest:
      type: object
      required: [event]
      properties:
        event:
          type: object
          description: one event in the ingest wire format (`type` required; timestamp and id are filled when missing)
          additionalProperties: true
    RuleTestMatch:
      type: object
      required: [id, name, severity, matched_on]
      properties:
        id:
          type: string
        name:
          type: string
        severity:
          type: string
        mitre:
          type: string
        tactic:
          type: string
        tags:
          type: array
          items:
            type: string
        matched_on:
          type: array
          items:
            type: string
    RuleTestResult:
      type: object
      required: [event_type, evaluated, matches]
      properties:
        event_type:
          type: string
        evaluated:
          type: integer
          description: enabled rules for this event type
        matches:
          type: array
          items:
            $ref: '#/components/schemas/RuleTestMatch'
    ReputationProviders:
      type: object
      required: [providers]
      properties:
        providers:
          type: object
          additionalProperties:
            type: boolean
    ReputationResult:
      type: object
      required: [provider, status]
      properties:
        provider:
          type: string
          enum: [virustotal, abuseipdb]
        status:
          type: string
          enum: [ok, not_found, rate_limited, error, unsupported]
        detail:
          type: string
        link:
          type: string
        malicious:
          type: integer
        suspicious:
          type: integer
        harmless:
          type: integer
        undetected:
          type: integer
        score:
          type: integer
          description: AbuseIPDB confidence of abuse, 0-100
        reports:
          type: integer
        country:
          type: string
        owner:
          type: string
        name:
          type: string
    ReputationReport:
      type: object
      required: [indicator, kind, results, cached, at]
      properties:
        indicator:
          type: string
        kind:
          type: string
          enum: [ip, hash]
        results:
          type: array
          items:
            $ref: '#/components/schemas/ReputationResult'
        cached:
          type: boolean
        at:
          type: string
          format: date-time
    EnrollState:
      type: object
      required: [enabled, pending, active, usable_tokens, writes, tokens, hosts]
      properties:
        enabled:
          type: boolean
        hint:
          type: string
          description: how to turn enrollment on (only when it is off)
        pending:
          type: integer
        active:
          type: integer
        usable_tokens:
          type: integer
        writes:
          type: boolean
          description: whether the API has a token, which the enrollment writes need
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/EnrollToken'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/EnrolledHost'
    EnrollToken:
      type: object
      required: [id, label, max_uses, uses, created_at, expires_at, status]
      properties:
        id:
          type: string
        label:
          type: string
        max_uses:
          type: integer
        uses:
          type: integer
        auto_approve:
          type: string
          description: hostname pattern approved without a human
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_by:
          type: string
        revoked:
          type: boolean
        revoked_by:
          type: string
        status:
          type: string
          enum: [active, expired, used_up, revoked]
    EnrollTokenRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 64
        max_uses:
          type: integer
          minimum: 1
          maximum: 10000
          description: 1 when omitted
        ttl_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: 24 when omitted
        auto_approve:
          type: string
          maxLength: 64
          example: pc-conta-*
        by:
          type: string
          description: who creates it (the console sets the account name)
    EnrollTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: '#/components/schemas/EnrollToken'
        secret:
          type: string
          description: the enrollment token itself (`btenroll_` + 64 hex); never shown again
    EnrollBy:
      type: object
      additionalProperties: false
      properties:
        by:
          type: string
    EnrolledHost:
      type: object
      required: [name, host, state, token_id, enrolled_at]
      properties:
        name:
          type: string
          description: ingest identity stamped on the host's events
        host:
          type: string
        state:
          type: string
          enum: [pending, active, rejected, revoked]
        token_id:
          type: string
        peer:
          type: string
          description: address the host enrolled from
        enrolled_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        decided_by:
          type: string
        auto_approved:
          type: boolean
        conflict:
          type: string
          description: why the host needs a human although its token would approve it
        last_attempt:
          type: string
          format: date-time
          description: last connection of a pending host
    ReportCatalog:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ReportCatalogEntry'
    ReportCatalogEntry:
      type: object
      required: [kind, title, description, params, formats]
      properties:
        kind:
          type: string
          enum: [executive, incident, fleet, soc]
        title:
          type: string
        description:
          type: string
        params:
          type: object
          description: accepted query parameters and their accepted values
          additionalProperties:
            type: string
        formats:
          type: array
          items:
            type: string
            enum: [json, csv]
    ExecutiveReport:
      type: object
      required: [kind, generated_at, window, source, truncated, alerts_total, by_severity, by_status, by_tactic, hosts_affected, top_rules, incidents, fleet]
      properties:
        kind:
          type: string
          enum: [executive]
        generated_at:
          type: string
          format: date-time
        window:
          $ref: '#/components/schemas/ReportWindow'
        source:
          type: string
          enum: [store, ring]
        truncated:
          type: boolean
        oldest_record:
          type: string
          format: date-time
          description: oldest alert the ring still holds (ring mode only; empty with a store)
        alerts_total:
          type: integer
        by_severity:
          type: object
          description: info/low/medium/high/critical counts (only non-zero keys)
          additionalProperties:
            type: integer
        by_status:
          type: object
          description: new/acknowledged/closed counts (only non-zero keys)
          additionalProperties:
            type: integer
        by_tactic:
          type: object
          description: ATT&CK tactic label counts (only non-zero keys)
          additionalProperties:
            type: integer
        hosts_affected:
          type: integer
          description: distinct hosts that raised an alert in the window
        top_rules:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ReportRuleCount'
        incidents:
          $ref: '#/components/schemas/ReportIncidentTotals'
        fleet:
          $ref: '#/components/schemas/ReportFleetTotals'
    ReportWindow:
      type: object
      required: [preset, from, until]
      properties:
        preset:
          type: string
          description: the requested value (e.g. 24h, 7d, 30d)
        from:
          type: string
