    ReportIncidentTotals:
      type: object
      required: [opened_in_window, closed_in_window, open, persistent]
      properties:
        opened_in_window:
          type: integer
        closed_in_window:
          type: integer
        open:
          type: integer
          description: open cases right now
        persistent:
          type: boolean
          description: whether the incident store writes to disk
    ReportFleetTotals:
      type: object
      required: [enabled, total, online, silent, idle]
      properties:
        enabled:
          type: boolean
          description: false when the engine runs without a fleet tracker (do not render coverage from the zeros)
        total:
          type: integer
        online:
          type: integer
        silent:
          type: integer
        idle:
          type: integer
    FleetCoverageReport:
      type: object
      required: [kind, generated_at, window, source, truncated, enabled, summary, hosts]
      properties:
        kind:
          type: string
          enum: [fleet]
        generated_at:
          type: string
          format: date-time
        window:
          $ref: '#/components/schemas/ReportWindow'
        source:
          type: string
          enum: [store, ring]
        truncated:
          type: boolean
        enabled:
          type: boolean
        summary:
          type: object
          required: [total, online, silent, idle, no_signal_in_window]
          properties:
            total:
              type: integer
            online:
              type: integer
            silent:
              type: integer
            idle:
              type: integer
            no_signal_in_window:
              type: integer
              description: hosts whose events_in_window is 0 (sensor down, machine off or gone)
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/FleetCoverageHost'
    FleetCoverageHost:
      type: object
      required: [host, status, first_seen, last_seen, events, events_in_window]
      properties:
        host:
          type: string
        status:
          type: string
          enum: [online, silent, idle]
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        last_event_type:
          type: string
        events:
          type: integer
          format: int64
          description: lifetime events the tracker has seen from this host
        events_in_window:
          type: integer
        sensor_version:
          type: string
        identity:
          type: string
          description: enrollment identity stamped on the host's events
    SocActivityReport:
      type: object
      required: [kind, generated_at, window, source, truncated, created, backlog, mean_time_to_ack_seconds, mean_time_to_close_seconds, days, by_operator]
      properties:
        kind:
          type: string
          enum: [soc]
        generated_at:
          type: string
          format: date-time
        window:
          $ref: '#/components/schemas/ReportWindow'
        source:
          type: string
          enum: [store, ring]
