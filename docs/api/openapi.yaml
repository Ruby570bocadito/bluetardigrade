  /api/respond/kill:
    post:
      tags: [respond]
      operationId: respondKill
      summary: Kill one verified local process (-allow-kill, operator-invoked)
      security:
        - bearerAuth: []
        - {}
      description: |
        Active response, iteration 1 (C3): terminates ONE process on the
        engine's own host with a fixed SIGKILL, on behalf of a named
        human operator. The surface exists only when the engine started
        with `-allow-kill` (or `SF_ALLOW_KILL=1`) AND an API token is
        configured AND the `-respond-audit` file opened; a disarmed
        engine answers a real `404`, identical to any unknown path. The
        bearer token is mandatory even on loopback (kill is stricter
        than the suppression writes).

        Five permission layers run before any signal, and every
        well-formed attempt (denied included) lands in the
        `-respond-audit` JSONL BEFORE the signal — the action that
        cannot be proven to have happened, does not happen:

        - the `operator` must be on the `-respond-operators` allowlist
          (`operator_not_allowed`; a missing file means an empty
          allowlist: everything denied). With a version-2 operators
          file every operator also presents their own credential in the
          `X-SF-Operator-Token` header (`operator_credential_invalid`
          otherwise): the shared bearer token does not tell operators
          apart, their credential does. It is never audited or logged;
        - `host` must equal the engine's own hostname (`host_mismatch`)
          — a console replaying a REMOTE sensor's alert can never turn
          it into a local kill;
        - budgets: per-(host,pid) 60 s cooldown, 20 actions/min global
          and 6 actions/min per operator, all counted on COMMITTED
          actions only (`cooldown_active`, `rate_limited`,
          `operator_rate_limited`);
        - the process guard verifies the target is the object the
          operator named: the kill uses ONE pinned object (pidfd on
          Linux, a single handle on Windows — `mechanism` in the
          response says which), the real name is checked per platform
          (`pid_mismatch`), the engine and its ancestors are
          untouchable (`self_protected`), protected names (platform
          defaults plus `-respond-protected`) are refused
          (`process_protected`), and pid 0/1/negative are invalid
          (`pid_invalid`);
        - audit write failure or the 64 MiB file ceiling degrades every
          action to `audit_unavailable` — never to an unrecorded kill.

        The name check protects against the MECHANICAL error (wrong
        PID through recycling), not against malware disguising its
        identity: the kill decision belongs to the operator, backed by
        the alert. Repeating an `idempotency_key` answers `409`
        (`idempotency_repeated`); the bounded map forgets the oldest
        key when 1024 are held (a forgotten key simply executes again;
        the cooldown still covers immediate retries). There is NO
        automation path: rules, sequences, the correlator and the
        actions dispatcher cannot reach this surface (binding landing
        requirement R8).
      parameters:
        - name: X-SF-Operator-Token
          in: header
          required: false
          description: the operator's own credential, required when the
            operators file is version 2 (at most 256 bytes)
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondKillRequest'
      responses:
        '200':
          description: |
            The signal was sent to the verified object (synchronous
            contract: the response carries the outcome, not a promise —
            `202` is reserved for a future queued design).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondKillExecuted'
        '400':
          description: Malformed JSON or a structurally invalid body (missing required fields, over-cap strings)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Permission or guard denial: the body names one of
            `operator_not_allowed`, `operator_credential_invalid`,
            `host_mismatch`, `pid_invalid`,
            `pid_mismatch`, `pid_not_found`, `pid_access_denied`,
            `self_protected`, `process_protected`, `audit_unavailable`.
            Every 403 here is audited in the engine's respond-audit
            JSONL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondKillDenied'
        '409':
          description: The `idempotency_key` was already committed (client retry) — nothing is executed again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondKillDenied'
        '429':
          description: >-
            Budget denial: `cooldown_active` (same host+pid within
            60 s), `rate_limited` (global 20/min) or
            `operator_rate_limited` (6/min per operator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondKillDenied'

  /api/respond/state:
    get:
      tags: [respond]
      operationId: respondState
      summary: Armed state of the active-response surface (flags, live counters, audit file health)
      security:
        - bearerAuth: []
        - {}
      description: |
        Console visibility of the C3 surface: what the engine armed at
        startup, the LIVE allowlist/protected counts (the 15 s
        hot-reload changes them under a running engine) and the audit
        file size against its 64 MiB ceiling. The same contract as
        `POST /api/respond/kill` applies: a disarmed engine answers a
        real `404`, identical to any unknown path, so probing learns
        nothing about a surface that does not exist for it.
      responses:
        '200':
          description: The surface is armed (`armed` is always true in a 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The surface is not armed (or the engine predates the route) - a real 404, byte-identical to any unknown path.
          content:
            text/plain:
              schema:
                type: string
                example: 404 page not found

  /api/respond/audit:
    get:
      tags: [respond]
      operationId: respondAudit
      summary: Most recent active-response attempts from the audit JSONL (newest first)
      security:
        - bearerAuth: []
        - {}
      description: |
        Tails the `-respond-audit` JSONL: the most recent attempts
        (executed AND denied, the audit Record schema verbatim, newest
        first) plus the honest bookkeeping of the scan. `skipped`
        counts lines that are not records yet (the torn tail of a
        concurrent append, or a line that failed to parse) - counted,
        never served as data; `truncated` marks files where older
        records exist beyond the read window. The reader never locks,
        truncates or rewrites the file: the append-only proof surface
        keeps its writer contract untouched.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum records returned (default 100, hard cap 500; invalid values fall back to the default, same clamp style as /api/events).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: The tail of the audit file (an empty array on a fresh audit file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondAuditResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The surface is not armed - a real 404, byte-identical to any unknown path.
          content:
            text/plain:
              schema:
                type: string
                example: 404 page not found
        '500':
          description: The audit file could not be read (permissions, disk) - the failure is reported, never smoothed into an empty feed.
          content:
            text/plain:
              schema:
                type: string

