  /api/reports/{kind}:
    get:
      tags: [reports]
      operationId: getReport
      summary: One report of the catalog (JSON or CSV)
      security:
        - bearerAuth: []
        - {}
      description: |
        Generates one report on demand. Reports are read-only
        aggregations of records the engine already holds: with the
        SQLite store attached they read the full retention window,
        without it the in-memory rings (last 1000 events / 256 alerts)
        and the report carries `source: "ring"` plus `oldest_record`
        so a consumer can see whether the window is actually covered.
        A scan capped at 10000 records flags `truncated`.

        The `incident` kind takes `?id=` (16 hex) instead of a window:
        a case bundle is point in time, and alert ids the engine can no
        longer resolve stay listed with `found: false`. CSV answers
        reuse the export endpoints' spreadsheet formula escaping.
      parameters:
        - name: kind
          in: path
          required: true
          description: report kind from the catalog
          schema:
            type: string
            enum: [executive, incident, fleet, soc]
        - name: window
          in: query
          required: false
          description: |
            range to aggregate: 24h, 7d, 30d or any positive duration
            within the kind's bounds (executive/fleet/soc: 1h to 30d,
            default 7d). Not accepted for the incident kind.
          schema:
            type: string
        - name: id
          in: query
          required: false
          description: incident id (16 hex), required for the incident kind
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Unknown window for the kind, invalid format, missing/malformed incident id, or a window on the incident kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown kind (the error names the valid ones) or unknown incident id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The generated report; the schema depends on the kind
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ExecutiveReport'
                  - $ref: '#/components/schemas/FleetCoverageReport'
                  - $ref: '#/components/schemas/SocActivityReport'
                  - $ref: '#/components/schemas/IncidentReport'
            text/csv:
              schema:
                type: string
  /api/noise:
    get:
      tags: [noise]
      operationId: getNoise
      summary: Processes, DNS domains and rules that most generate events or alerts (§2.4)
      security:
        - bearerAuth: []
        - {}
      description: |
        The noise report, fleet-wide by default; with `host` it narrows
        to one machine. Processes group by executable image
        (case-insensitive), DNS lookups by the queried name and rules
        by rule id, each with its triage percentages: `false_positive_pct`
        is the REAL false-positive rate (the recorded triage decision
        `false_positive` over the rule's alerts), while
        `closed_pct`/`acknowledged_pct` stay as the workflow-progress
        proxies (the share whose CURRENT status is closed/acknowledged;
        the JSON names exactly what each measures).

        Records come from the same source as the reports (store with
        full retention, rings otherwise) with a 10000-record scan cap
        flagged in `scanned.truncated`. JSON only: the console renders
        it and adds the tuning buttons (known software, suppressions).
      parameters:
        - name: window
          in: query
          required: false
          description: range to aggregate (default 24h, 15m to 30d)
          schema:
            type: string
        - name: host
          in: query
          required: false
          description: narrow every aggregate to one machine (exact name, case-insensitive)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: entries per top list (default 10, max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Invalid window (out of the kind's bounds or not a duration)
          content:
            application/json:
