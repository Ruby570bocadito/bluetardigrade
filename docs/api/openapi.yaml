# OpenAPI specification for the bluetardigrade local engine API.
#
# Source of truth: internal/api/api.go + internal/api/export.go (handlers
# and payloads), pkg/model (Event) and internal/alert (Alert). When the
# API surface changes, update this file in the same round - the README
# links here as the contract for SIEM taps and console consumers.
#
# Lint/validate with any OpenAPI 3.0 tooling, e.g.:
#   npx @redocly/cli lint docs/api/openapi.yaml
openapi: 3.0.3
info:
  title: bluetardigrade local API
  version: 1.0.0
  description: |
    Read-only-plus-triage HTTP API served by the Go detection engine
    (default `127.0.0.1:7778`, loopback-only; start with `-api 0` to
    disable). The web console hub (`web/console-service`) consumes it,
    and SIEM/SOAR taps can too.

    Design constraints worth knowing before integrating:

    - The API is **read-only by default** with three opt-in write
      surfaces: alert triage via `POST /api/alerts/{id}/status`
      (acknowledge / close / reopen with a note; gated by the bearer
      token like every read endpoint), `POST`/`DELETE` on
      `/api/suppressions` when the engine starts with `-api-write`
      (or `SF_API_WRITE=1`; edits the `suppressions.yaml` file
      atomically, answers `403` naming the flag when it is off), and
      `POST /api/respond/kill` when the engine starts with
      `-allow-kill` plus a token plus an open audit file (C3 active
      response: one verified local process, operator-invoked, every
      attempt audited before the signal; a disarmed engine answers a
      real `404`). Everything else — configuration, rules,
      sequences — stays flag/YAML-driven, never writable through
      this API.
    - `GET /api/events` and `GET /api/alerts` return the **in-memory
      ring** (last 1000 events / 256 alerts), newest first. For bulk
      download use the `/export` endpoints.
    - `GET /api/stream` is Server-Sent Events: one connection, live
      frames of `event: event`, `event: alert` and
      `event: alert_lifecycle`, `retry: 2000`, heartbeat comments every
      15 s.
    - All timestamps are RFC 3339 (UTC, nanosecond precision).
    - **Authentication is optional**: loopback deployments run open by
      default; starting the engine with `-api-token`/`SF_API_TOKEN`
      requires a bearer credential on every path except `/api/health`
      (see `securitySchemes.bearerAuth`). Rejections answer `401` with
      a `WWW-Authenticate: Bearer` challenge and a JSON error body
      naming the flag to set; the scheme is matched case-insensitively
      (RFC 7235) and the token comparison is constant-time.

    The alert webhook (engine `-webhook` flag) pushes the same `Alert`
    object defined here as JSON to an external collector.
servers:
  - url: http://127.0.0.1:7778
    description: local engine API (default -api address, loopback only)
tags:
  - name: status
    description: liveness and runtime counters
  - name: telemetry
    description: recent events and alerts (in-memory rings)
  - name: rules
    description: live detection rule set
  - name: stream
    description: real-time Server-Sent Events feed
  - name: export
    description: bulk download (JSONL / CSV) for SIEM import and forensics
  - name: incidents
    description: investigation cases grouping alerts, with status, owner and timeline
  - name: reputation
    description: opt-in, on-demand VirusTotal and AbuseIPDB lookups
  - name: respond
    description: >
      active response (C3, opt-in): operator-invoked kill_process over a
      verified local process; armed only with -allow-kill + bearer token
      + an open audit file
paths:
  /api/health:
    get:
      tags: [status]
      operationId: getHealth
      summary: Liveness probe
      # never gated: auth() exempts the liveness probe (internal/api/api.go);
      # stays open even with a token configured (static body; monitors probe
      # it unauthenticated)
      security: []
      description: Cheap check that the engine API is up. Used by the console bridge and by `sf-engine` to detect an already-running instance.
      responses:
        '200':
          description: Engine alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/stats:
    get:
      tags: [status]
      operationId: getStats
      summary: Runtime counters
      # Optional auth, mirrored on every data path: the bearer requirement is
      # active only when the engine runs with -api-token; the anonymous entry
      # keeps default (loopback) deployments valid.
      security:
        - bearerAuth: []
        - {}
      description: |
        Uptime, ingest counters, per-severity alert totals and rule
        stats. When the engine runs with `-webhook`, the three
        `webhook_*` counters report delivery health from the outside:
        `webhook_sent` delivered (2xx), `webhook_failed` exhausted
        retries, `webhook_dropped` discarded because the bounded queue
        saturated. The SIEM sinks report the same delivery triple per
        platform when configured: `elastic_*` (bulk indexing via
        `-elastic`) and `splunk_*` (HEC events via `-splunk`). When
        ingest auth is active (`-token`),
        `ingest_rejected` counts connections rejected by the shared
        token handshake — the visible signal that the ingest port is
        being probed without credentials.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Current stats snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
  /metrics:
    get:
      tags: [status]
      operationId: getMetrics
      summary: Prometheus scrape endpoint (text exposition 0.0.4)
      # Same optional-auth model as every /api data path: the route is
      # registered on the mux wrapped by h.auth (only /api/health is
      # exempt), so with -api-token the scraper must send the Bearer
      # credential (Prometheus: authorization Credentials /
      # BearerTokenFile in the scrape config).
      security:
        - bearerAuth: []
        - {}
      description: |
        The same counters as `GET /api/stats` rendered in the Prometheus
        text exposition format (version 0.0.4,
        `text/plain; version=0.0.4`). Every `sf_*` family maps 1:1 to a
        numeric Stats field (`sf_events_total` ← `events_total`,
        `sf_alerts_by_severity{severity=...}` ← `by_severity`, and so
        on); the non-numeric Stats fields (`rules_types`, `mode`) are
        deliberately omitted. It exposes nothing the JSON endpoint does
        not already expose to the same credential — enforced by
        `TestMetricsParityWithStats` in `internal/api`.

        Scrape config hint (token-protected engine):

            scrape_configs:
              - job_name: bluetardigrade
                metrics_path: /metrics
                authorization:
                  credentials: <SF_API_TOKEN>
                static_configs:
                  - targets: ['127.0.0.1:7778']
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Prometheus text exposition of the engine counters
            (metric families prefixed `sf_`)
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP sf_events_total Events accepted by ingest since engine start.
                  # TYPE sf_events_total counter
                  sf_events_total 231
                  # HELP sf_alerts_total Alerts raised since engine start.
                  # TYPE sf_alerts_total counter
                  sf_alerts_total 4
                  # HELP sf_alerts_by_severity Alerts raised since engine start, by severity.
                  # TYPE sf_alerts_by_severity gauge
                  sf_alerts_by_severity{severity="critical"} 1
                  sf_alerts_by_severity{severity="high"} 3
  /api/suppressions:
    get:
      tags: [status]
      operationId: listSuppressions
      summary: Operator allowlist
      security:
        - bearerAuth: []
        - {}
      description: |
        The suppression entries currently active (expired ones excluded).
        The source of truth is the `suppressions.yaml` file the engine
        hot-reloads (see `suppressions.example.yaml`). When the engine
        runs with `-api-write` (or `SF_API_WRITE=1`), the same file can
        also be edited through the `post`/`delete` operations below: the
        write lands atomically (temp + rename) and is loaded back
        immediately, so hand edits and API edits share one state.
        Without the flag, both write operations answer `403` naming the
        flag. Suppressed hits raise no alert, skip the correlator and
        are logged as `[SUPPRESS]`.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Active suppression entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suppressions'
    post:
      tags: [status]
      operationId: createSuppression
      summary: Add (or update) one suppression entry (-api-write)
      security:
        - bearerAuth: []
        - {}
      description: |
        Upserts one entry keyed by the (rule_id, host) pair: posting an
        existing pair updates reason/expires instead of duplicating it.
        The body is a single SuppressionEntry, validated exactly like
        the YAML loader (rule_id and host must not both be empty,
        expires must be RFC 3339); a rejected entry answers `400` with
        the detail. The entry is written to `suppressions.yaml`
        atomically and loaded back, so it is live immediately and
        survives restarts. Every write logs an audit line
        `WRITE suppressions add/update rule=... host=... by=api`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionEntry'
      responses:
        '200':
          description: The new allowlist state (same shape as the get)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suppressions'
        '400':
          description: Malformed JSON, or an entry the validator rejects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WritesDisabled'
        '500':
          description: The suppressions file is not writable (detail in the engine log)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [status]
      operationId: deleteSuppression
      summary: Remove entries matching the exact (rule_id, host) pair (-api-write)
      security:
        - bearerAuth: []
        - {}
      description: |
        Removes every entry whose (rule_id, host) pair equals the query
        exactly — an entry that silences one rule on ALL hosts is only
        removed by a query without host, and vice versa: no silent
        wildcard expansion either way. `404` when nothing matched, `400`
        when both parameters are empty. Answers with the new state and
        logs `WRITE suppressions remove rule=... host=... by=api`.
      parameters:
        - name: rule_id
          in: query
          schema:
            type: string
          description: exact rule id of the entries to remove
        - name: host
          in: query
          schema:
            type: string
          description: exact (case-insensitive) host of the entries to remove
      responses:
        '200':
          description: The new allowlist state (same shape as the get)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suppressions'
        '400':
          description: Both query parameters are empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WritesDisabled'
        '404':
          description: No entry matches the (rule_id, host) pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/sequences:
    get:
      tags: [status]
      operationId: listSequences
      summary: Loaded kill-chain sequences (read-only view)
      security:
        - bearerAuth: []
        - {}
      description: |
        The kill-chain sequences currently loaded by the correlator
        (sorted by id, hot-reload aware). Sequences are NOT managed
        through this API: they live in the `sequences/*.yaml` files the
        engine hot-reloads every 15 s. An empty list means the
        correlator is off (the engine found no sequences/ directory);
        combined with `stats.correlator_states` this endpoint tells the
        operator which chains are armed and how their steps are wired.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Loaded sequences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sequence'
  /api/fleet:
    get:
      tags: [status]
      operationId: listFleet
      summary: Inventory of the machines reporting to the engine (read-only)
      security:
        - bearerAuth: []
        - {}
      description: |
        One entry per host seen since the engine started: first and last
        event, events in the last five minutes, telemetry sources, the
        addresses of the sensor connections, the ingest identity used and
        the sensor's last health report. Sensors report health with a
        `sensor.heartbeat` event that the engine consumes here and never
        forwards to rules, rings or storage. A host whose sensor sent
        heartbeats and then stops for longer than its grace (3 x the
        announced interval, at least `heartbeat_grace_min_s`) is `silent`
        and raises one `fleet-sensor-silent` alert per outage. Hosts
        without heartbeats are `online` while they send data and `idle`
        afterwards, never `silent`. The engine sends nothing to the
        machines listed here.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Inventory, silent hosts first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fleet'
  /api/enroll:
    get:
      tags: [status]
      operationId: getEnrollment
      summary: Sensor enrollment state - tokens and enrolled hosts (read-only)
      security:
        - bearerAuth: []
        - {}
      description: |
        Sensor enrollment (`-enroll <file>`). A new sensor opens its first
        ingest connection with `ENROLL <token> <host>` and receives a
        credential of its own, bound to that host; from then on it connects
        with `AUTH <credential>`. A host starts `pending`: the engine takes
        none of its events (the sensor keeps them in its spool) until an
        administrator approves it. ENROLL is only accepted over TLS or from
        loopback. Tokens are listed without their secrets; hosts without
        their credentials. With enrollment off, `enabled` is false and
        `hint` says how to turn it on.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Enrollment state, pending hosts first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollState'
  /api/enroll/tokens:
    post:
      tags: [status]
      operationId: createEnrollToken
      summary: Create an enrollment token (the secret is returned once)
      security:
        - bearerAuth: []
        - {}
      description: |
        Mints an enrollment token: single use by default, up to 10000 uses
        for a domain rollout, valid between 1 hour and 30 days (24 hours by
        default). `auto_approve` is an optional hostname pattern (`*` and
        `?`, case-insensitive): matching hosts are approved without a human
        unless another identity already reports as the same host. The
        engine keeps only the SHA-256 of the secret. Needs an API token
        even on loopback.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollTokenRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: 'The token and its secret, shown once (Cache-Control: no-store)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollTokenCreated'
        '400':
          description: Invalid JSON body or field (uses, lifetime, label, pattern)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            The API has no token (enrollment writes need one), or a native
            write from a foreign browser Origin / Sec-Fetch-Site cross-site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Enrollment is off (the engine runs without `-enroll`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The registry is full (1000 tokens kept)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body over 4 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/enroll/tokens/{id}/revoke:
    post:
      tags: [status]
      operationId: revokeEnrollToken
      summary: Stop a token from enrolling more hosts
      security:
        - bearerAuth: []
        - {}
      description: |
        Hosts already enrolled with the token are not affected. Revoking a
        revoked token returns it unchanged.
      parameters:
        - name: id
          in: path
          required: true
          description: token id (the `id` field of the token)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollBy'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The token, now revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollToken'
        '400':
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The API has no token, or a cross-site browser write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Enrollment is off, or no token has this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/enroll/hosts/{name}/{action}:
    post:
      tags: [status]
      operationId: decideEnrolledHost
      summary: Approve, reject or revoke an enrolled host
      security:
        - bearerAuth: []
        - {}
      description: |
        `approve` and `reject` apply to a pending host; `revoke` to a
        pending or active one. Rejecting or revoking closes the open ingest
        connections of the host's credential at once. The decision is
        recorded with `by` (the console sets it to the account name).
      parameters:
        - name: name
          in: path
          required: true
          description: identity name of the host (the `name` field, `enr-<host>-<suffix>`)
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [approve, reject, revoke]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollBy'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The host after the decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolledHost'
        '400':
          description: Unknown action or invalid JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The API has no token, or a cross-site browser write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Enrollment is off, or no host has this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The decision does not apply to the host's state (approving an active host)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/intel:
    get:
      tags: [status]
      operationId: getIntel
      summary: Offline threat-intel lists and per-host baseline state (read-only)
      security:
        - bearerAuth: []
        - {}
      description: |
        The threat-intelligence lists the engine matches events against:
        plain-text files (`*.txt`, `*.list`) the operator places in the
        `-intel` directory, one indicator per line (IPs, CIDR ranges,
        domains, URLs whose host is kept, hosts-file lines, MD5/SHA-1/
        SHA-256 hashes). The engine re-reads the directory when a file
        changes and never downloads anything. A match raises one
        `intel-match-<list>` alert per indicator and host every ten
        minutes. `baseline` reports the per-host process baseline
        (`-baseline-learn`): after its learning period a host running a
        process it never ran before raises a low `baseline-new-process`
        alert.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Lists in file-name order and baseline counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intel'
  /api/baseline:
    get:
      tags: [status]
      operationId: getBaselineHost
      summary: What the per-host process baseline knows about one machine (read-only)
      security:
        - bearerAuth: []
        - {}
      description: |
        The learning window of one host and the process names (basename,
        lowercase) the baseline treats as normal there. After the learning
        period a name outside this list raises a `baseline-new-process`
        alert. `known` is false for a host the baseline has not seen;
        `full` means the per-host cap (4096 names) was reached and the host
        no longer learns.
      parameters:
        - name: host
          in: query
          required: true
          description: host name, case-insensitive (at most 255 bytes)
          schema:
            type: string
      responses:
        '400':
          description: The host parameter is missing or too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Baseline of the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineHost'
  /api/events:
    get:
      tags: [telemetry]
      operationId: listEvents
      summary: Recent events (newest first)
      security:
        - bearerAuth: []
        - {}
      description: |
        All filters are AND-combined and applied BEFORE `limit`, so
        `?limit=50` with a filter returns the 50 most recent MATCHING
        events, not a filtered slice of the last 50.

        When the engine runs with `-store`, this list reads the persistent
        SQLite store (full history, subject to the configured retention)
        instead of the in-memory ring, so `since=24h` can reach further
        back than the ring's 1000-event window.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/EventType'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Q'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Up to `limit` events, newest first (from the in-memory
            ring, or the full stored history when `-store` is on)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /api/alerts:
    get:
      tags: [telemetry]
      operationId: listAlerts
      summary: Recent alerts (newest first) with triage status
      security:
        - bearerAuth: []
        - {}
      description: |
        Same filter semantics as `/api/events`. Each alert carries the
        lifecycle overlay merged at read time: `status` (always present,
        `new` when no operator decision exists), plus `status_note`,
        `status_by` and `status_at` when the alert has been triaged via
        `POST /api/alerts/{id}/status`. When the engine runs with
        `-store`, this list reads the persistent SQLite store (full
        history, subject to the configured retention) instead of the
        in-memory ring — the overlay applies in both modes.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Q'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Up to `limit` alerts, newest first (from the in-memory
            ring, or the full stored history when `-store` is on)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
  /api/alerts/search:
    get:
      tags: [telemetry]
      operationId: searchAlerts
      summary: Stable pages of alert history with lifecycle filters
      security:
        - bearerAuth: []
        - {}
      description: |
        Reads SQLite when enabled, otherwise the retained 256-entry memory
        ring. Pages are ordered by insertion sequence, newest received first,
        independently of event timestamps. The first page pins an upper
        sequence; subsequent arrivals do not shift earlier pages. Retention,
        ring eviction and lifecycle decisions can still change membership.
        No total count is claimed. The existing list/export routes are unchanged.
        Use page_cursor to revisit the current page and next_cursor to continue.
        A cursor is a read-only position tied to the source, engine lifetime
        and query; restart the search after changing filters or restarting the
        engine. Relative since/until bounds are frozen at the first page.
        Lifecycle filtering is applied before the page limit. Each request
        has a four-second time budget and examines at most 5000 matching
        evidence records. scan_limited with
        has_more means unexamined records remain, not that another matching
        lifecycle result is guaranteed; an empty page can have a continuation.
        Free-text q searches detection evidence, not lifecycle notes.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque page position from this same query, at most 1024 characters.
          schema: { type: string, maxLength: 1024 }
        - name: status
          in: query
          schema:
            type: string
            enum: [all, open, new, acknowledged, closed]
            default: all
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Invalid filters, limit or expired/mismatched cursor.
        '500':
          description: Persistent store read failed; no partial page is served.
        '504':
          description: The search exceeded its four-second time budget; narrow the filters.
        '200':
          description: A bounded page and an explicit continuation, when needed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSearchPage'
  /api/alerts/{id}/forensics:
    get:
      tags: [telemetry]
      operationId: getAlertForensics
      summary: Frozen evidence bundle of one alert (timeline + summary)
      security:
        - bearerAuth: []
        - {}
      description: |
        The forensic layer of the engine: when a `high` or `critical`
        alert fires, the engine freezes an evidence bundle — the alert
        itself plus the host's event timeline for the 5 minutes that
        preceded detection — to `<forensics>/<id>.json` at detection
        time (atomic write, directory capped at 256 bundles,
        oldest-first eviction).

        The bundle exists independently of the in-memory ring, of
        `-store` and of engine restarts within retention: an
        investigation must not depend on where the alert currently
        lives. Disabling capture (`-forensic=false`) keeps the route
        answering `501` so the console can render "feature off"
        instead of a misleading 404.
      parameters:
        - name: id
          in: path
          required: true
          description: alert id (16 lowercase hex characters, the `id` field of the alert)
          schema:
            type: string
            pattern: '^[0-9a-f]{16}$'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The evidence bundle frozen at detection time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForensicBundle'
        '400':
          description: Malformed alert id (not 16 lowercase hex). The
            JSON body names the problem.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Well-formed id but no bundle for it — severity
            below the capture threshold (only high/critical freeze
            evidence), evicted by the retention cap, or the engine
            restarted before capture. The JSON body says which.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: The bundle exists but could not be decoded
            (integrity failure; details in the engine log, a generic
            body on the wire).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '501':
          description: Forensic capture disabled on this engine
            (`-forensic=false`); the id was never going to have a
            bundle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/alerts/{id}/status:
    post:
      tags: [telemetry]
      operationId: setAlertStatus
      summary: Record the operator triage decision for one alert
      security:
        - bearerAuth: []
        - {}
      description: |
        The WRITE surface of the alert lifecycle. `status` is one of
        `acknowledged` (seen, under investigation), `closed` (handled)
        or `new` (explicit reopen). The optional `note` is the triage
        note (max 2000 chars) and `by` a free-text operator name (max
        200 chars; the API has a single shared bearer token, so `by`
        is informational and NOT authenticated).

        The lifecycle store is the source of truth for STATUS: the
        target alert does not need to be in the 256-entry ring (an
        evicted alert can legitimately be closed). Without
        `-lifecycle` the engine keeps statuses in memory only and they
        reset on restart; with it, the JSON file is written atomically
        on every change. Success broadcasts an `alert_lifecycle` SSE
        frame so live consumers update without polling.
      parameters:
        - name: id
          in: path
          required: true
          description: alert id (16 lowercase hex characters, the `id` field of the alert)
          schema:
            type: string
            pattern: '^[0-9a-f]{16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertStatusUpdate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Native API writes reject a foreign or malformed browser Origin
            and Sec-Fetch-Site cross-site. Originless CLI clients remain supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The stored lifecycle entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertLifecycle'
        '400':
          description: |
            Malformed alert id, invalid JSON body, unknown status, or
            note/by over their length limits. The JSON body names the
            problem (`{"error":"..."}`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
