        The report kinds this engine can compute today (REP-1 part A:
        executive, incident, fleet coverage, SOC activity). The catalog
        is static per engine version: a console renders the picker from
        it without hard-coding kinds, and kinds that need data the
        engine does not have yet (AD posture, logon audit) appear only
        when the engine can actually compute them.
      responses:
        '401':
