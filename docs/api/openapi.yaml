          items:
            type: object
            required: [day, created, acknowledged, closed]
            properties:
              day:
                type: string
                description: UTC day (YYYY-MM-DD)
              created:
                type: integer
              acknowledged:
                type: integer
                description: triage actions that happened this day
              closed:
                type: integer
                description: triage actions that happened this day
        by_operator:
          type: object
          description: status_by -> latest triage actions inside the window
          additionalProperties:
            type: integer
    IncidentReport:
      type: object
      required: [kind, generated_at, incident, alerts, timeline]
      properties:
        kind:
          type: string
          enum: [incident]
        generated_at:
          type: string
          format: date-time
        incident:
          $ref: '#/components/schemas/IncidentCaseSummary'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/IncidentReportAlert'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/IncidentReportEntry'
    IncidentCaseSummary:
      type: object
      required: [id, title, severity, status, hosts, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        status:
          type: string
          enum: [open, investigating, contained, closed]
        owner:
          type: string
        hosts:
          type: array
          items:
            type: string
        created_at:
          type: string
        updated_at:
          type: string
        closed_at:
          type: string
    IncidentReportAlert:
      type: object
      required: [id, status, found]
      description: an alert of the case with its triage overlay; found false means the engine can no longer resolve its content
      properties:
        id:
          type: string
        rule_id:
          type: string
        rule_name:
          type: string
        severity:
          type: string
        host:
          type: string
        event_type:
          type: string
        timestamp:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [new, acknowledged, closed]
        status_at:
          type: string
        status_by:
          type: string
        found:
          type: boolean
    IncidentReportEntry:
      type: object
      required: [at, kind, text]
      properties:
        at:
          type: string
        by:
          type: string
        kind:
          type: string
        text:
          type: string
    NoiseReport:
      type: object
      required: [kind, generated_at, window, host, source, scanned, processes, domains, rules]
      properties:
        kind:
          type: string
          enum: [noise]
        generated_at:
          type: string
          format: date-time
        window:
          $ref: '#/components/schemas/ReportWindow'
        host:
          type: string
          description: empty for the whole fleet
        source:
          type: string
          enum: [store, ring]
        scanned:
          type: object
          required: [events, alerts, truncated]
          properties:
            events:
              type: integer
            alerts:
              type: integer
            truncated:
              type: boolean
              description: the scan hit its 10000-record cap (it then sees the newest slice of the window)
            known_software_events:
              type: integer
              description: process boots excluded from the process aggregate because the known-software list labelled them (§2.2); the events stay stored and searchable
        processes:
          type: array
          items:
            $ref: '#/components/schemas/NoiseProcess'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/NoiseDomain'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/NoiseRule'
    NoiseProcess:
      type: object
      required: [image, count, distinct_hosts, first_seen, last_seen]
      properties:
        image:
          type: string
          description: group key, lowercased executable path (or name when the sensor cannot provide one)
        count:
          type: integer
        distinct_hosts:
          type: integer
        first_seen:
          type: string
        last_seen:
          type: string
        parent:
          type: string
          description: parent process name of the newest sample, when the engine's enricher resolved it
        command_line:
          type: string
          description: newest sample, truncated to 200 characters
        sha256:
          type: string
          description: newest sample carrying one
    NoiseDomain:
      type: object
      required: [domain, count, distinct_hosts, first_seen, last_seen]
      properties:
        domain:
          type: string
          description: queried name, lowercased
        count:
          type: integer
        distinct_hosts:
          type: integer
        first_seen:
          type: string
        last_seen:
          type: string
    NoiseRule:
      type: object
      required: [rule_id, rule_name, count, distinct_hosts, false_positive_pct, acknowledged_pct, closed_pct]
      properties:
        rule_id:
          type: string
        rule_name:
          type: string
        count:
          type: integer
        by_severity:
          type: object
          additionalProperties:
            type: integer
        distinct_hosts:
          type: integer
        false_positive_pct:
          type: number
          format: float
          description: share of the rule's alerts whose recorded triage DECISION is false_positive — the real false-positive rate (0 when no decision exists yet)
        acknowledged_pct:
          type: number
          format: float
          description: share of the rule's alerts whose CURRENT status is acknowledged (workflow-progress proxy)
        closed_pct:
          type: number
          format: float
          description: share of the rule's alerts whose CURRENT status is closed (workflow-progress proxy)
