                $ref: '#/components/schemas/Error'
        '500':
          description: Store query failed (the engine log carries the detail)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: The noise report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoiseReport'
  /api/ad/status:
    get:
      tags: [ad]
      operationId: getADStatus
      summary: Read-only Active Directory connector state (AD-1)
      security:
        - bearerAuth: []
        - {}
      description: |
        State of the directory snapshot the connector maintains: when the
        last sync attempt/completion happened, when the next one is due,
        the per-kind object counts of the last completed snapshot and any
        connector-level warnings (for example, the service account turning
        out to be a member of a privileged group).

        The routes under `/api/ad` answer 501 with an arming hint while the
        engine runs without `-ad` (and `-store`, which keeps the snapshot):
        the feature exists but is off, distinguishable from a 404. Reads
        only — the connector never writes to the domain.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
