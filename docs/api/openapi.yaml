# OpenAPI specification for the security-framework local engine API.
#
# Source of truth: internal/api/api.go + internal/api/export.go (handlers
# and payloads), pkg/model (Event) and internal/alert (Alert). When the
# API surface changes, update this file in the same round - the README
# links here as the contract for SIEM taps and console consumers.
#
# Lint/validate with any OpenAPI 3.0 tooling, e.g.:
#   npx @redocly/cli lint docs/api/openapi.yaml
openapi: 3.0.3
info:
  title: security-framework local API
  version: 0.1.0
  description: |
    Read-only-plus-triage HTTP API served by the Go detection engine
    (default `127.0.0.1:7778`, loopback-only; start with `-api 0` to
    disable). The web console hub (`web/console-service`) consumes it,
    and SIEM/SOAR taps can too.

    Design constraints worth knowing before integrating:

    - The API is **read-only by default** with three opt-in write
      surfaces: alert triage via `POST /api/alerts/{id}/status`
      (acknowledge / close / reopen with a note; gated by the bearer
      token like every read endpoint), `POST`/`DELETE` on
      `/api/suppressions` when the engine starts with `-api-write`
      (or `SF_API_WRITE=1`; edits the `suppressions.yaml` file
      atomically, answers `403` naming the flag when it is off), and
      `POST /api/respond/kill` when the engine starts with
      `-allow-kill` plus a token plus an open audit file (C3 active
      response: one verified local process, operator-invoked, every
      attempt audited before the signal; a disarmed engine answers a
      real `404`). Everything else — configuration, rules,
      sequences — stays flag/YAML-driven, never writable through
      this API.
    - `GET /api/events` and `GET /api/alerts` return the **in-memory
      ring** (last 1000 events / 256 alerts), newest first. For bulk
      download use the `/export` endpoints.
    - `GET /api/stream` is Server-Sent Events: one connection, live
      frames of `event: event`, `event: alert` and
      `event: alert_lifecycle`, `retry: 2000`, heartbeat comments every
      15 s.
    - All timestamps are RFC 3339 (UTC, nanosecond precision).
    - **Authentication is optional**: loopback deployments run open by
      default; starting the engine with `-api-token`/`SF_API_TOKEN`
      requires a bearer credential on every path except `/api/health`
      (see `securitySchemes.bearerAuth`). Rejections answer `401` with
      a `WWW-Authenticate: Bearer` challenge and a JSON error body
      naming the flag to set; the scheme is matched case-insensitively
      (RFC 7235) and the token comparison is constant-time.

    The alert webhook (engine `-webhook` flag) pushes the same `Alert`
    object defined here as JSON to an external collector.
servers:
  - url: http://127.0.0.1:7778
    description: local engine API (default -api address, loopback only)
tags:
  - name: status
    description: liveness and runtime counters
  - name: telemetry
    description: recent events and alerts (in-memory rings)
  - name: rules
    description: live detection rule set
  - name: stream
    description: real-time Server-Sent Events feed
  - name: export
    description: bulk download (JSONL / CSV) for SIEM import and forensics
  - name: respond
    description: >
      active response (C3, opt-in): operator-invoked kill_process over a
      verified local process; armed only with -allow-kill + bearer token
      + an open audit file
paths:
  /api/health:
    get:
      tags: [status]
      operationId: getHealth
      summary: Liveness probe
      # never gated: auth() exempts the liveness probe (internal/api/api.go);
      # stays open even with a token configured (static body; monitors probe
      # it unauthenticated)
      security: []
      description: Cheap check that the engine API is up. Used by the console bridge and by `sf-engine` to detect an already-running instance.
      responses:
        '200':
          description: Engine alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/stats:
    get:
      tags: [status]
      operationId: getStats
      summary: Runtime counters
      # Optional auth, mirrored on every data path: the bearer requirement is
      # active only when the engine runs with -api-token; the anonymous entry
      # keeps default (loopback) deployments valid.
      security:
        - bearerAuth: []
        - {}
      description: |
        Uptime, ingest counters, per-severity alert totals and rule
        stats. When the engine runs with `-webhook`, the three
        `webhook_*` counters report delivery health from the outside:
        `webhook_sent` delivered (2xx), `webhook_failed` exhausted
        retries, `webhook_dropped` discarded because the bounded queue
        saturated. The SIEM sinks report the same delivery triple per
        platform when configured: `elastic_*` (bulk indexing via
        `-elastic`) and `splunk_*` (HEC events via `-splunk`). When
        ingest auth is active (`-token`),
        `ingest_rejected` counts connections rejected by the shared
        token handshake — the visible signal that the ingest port is
        being probed without credentials.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Current stats snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
  /metrics:
    get:
      tags: [status]
      operationId: getMetrics
      summary: Prometheus scrape endpoint (text exposition 0.0.4)
      # Same optional-auth model as every /api data path: the route is
      # registered on the mux wrapped by h.auth (only /api/health is
      # exempt), so with -api-token the scraper must send the Bearer
      # credential (Prometheus: authorization Credentials /
      # BearerTokenFile in the scrape config).
      security:
        - bearerAuth: []
        - {}
      description: |
        The same counters as `GET /api/stats` rendered in the Prometheus
        text exposition format (version 0.0.4,
        `text/plain; version=0.0.4`). Every `sf_*` family maps 1:1 to a
        numeric Stats field (`sf_events_total` ← `events_total`,
        `sf_alerts_by_severity{severity=...}` ← `by_severity`, and so
        on); the non-numeric Stats fields (`rules_types`, `mode`) are
        deliberately omitted. It exposes nothing the JSON endpoint does
        not already expose to the same credential — enforced by
        `TestMetricsParityWithStats` in `internal/api`.

        Scrape config hint (token-protected engine):

            scrape_configs:
              - job_name: security-framework
                metrics_path: /metrics
                authorization:
                  credentials: <SF_API_TOKEN>
                static_configs:
                  - targets: ['127.0.0.1:7778']
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Prometheus text exposition of the engine counters
            (metric families prefixed `sf_`)
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP sf_events_total Events accepted by ingest since engine start.
                  # TYPE sf_events_total counter
                  sf_events_total 231
                  # HELP sf_alerts_total Alerts raised since engine start.
                  # TYPE sf_alerts_total counter
                  sf_alerts_total 4
                  # HELP sf_alerts_by_severity Alerts raised since engine start, by severity.
                  # TYPE sf_alerts_by_severity gauge
                  sf_alerts_by_severity{severity="critical"} 1
                  sf_alerts_by_severity{severity="high"} 3
  /api/suppressions:
    get:
      tags: [status]
      operationId: listSuppressions
      summary: Operator allowlist
      security:
        - bearerAuth: []
        - {}
      description: |
        The suppression entries currently active (expired ones excluded).
        The source of truth is the `suppressions.yaml` file the engine
        hot-reloads (see `suppressions.example.yaml`). When the engine
        runs with `-api-write` (or `SF_API_WRITE=1`), the same file can
        also be edited through the `post`/`delete` operations below: the
        write lands atomically (temp + rename) and is loaded back
        immediately, so hand edits and API edits share one state.
        Without the flag, both write operations answer `403` naming the
        flag. Suppressed hits raise no alert, skip the correlator and
        are logged as `[SUPPRESS]`.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Active suppression entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suppressions'
    post:
      tags: [status]
      operationId: createSuppression
      summary: Add (or update) one suppression entry (-api-write)
      security:
        - bearerAuth: []
        - {}
      description: |
        Upserts one entry keyed by the (rule_id, host) pair: posting an
        existing pair updates reason/expires instead of duplicating it.
        The body is a single SuppressionEntry, validated exactly like
        the YAML loader (rule_id and host must not both be empty,
        expires must be RFC 3339); a rejected entry answers `400` with
        the detail. The entry is written to `suppressions.yaml`
        atomically and loaded back, so it is live immediately and
        survives restarts. Every write logs an audit line
        `WRITE suppressions add/update rule=... host=... by=api`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionEntry'
      responses:
        '200':
          description: The new allowlist state (same shape as the get)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suppressions'
        '400':
          description: Malformed JSON, or an entry the validator rejects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WritesDisabled'
        '500':
          description: The suppressions file is not writable (detail in the engine log)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [status]
      operationId: deleteSuppression
      summary: Remove entries matching the exact (rule_id, host) pair (-api-write)
      security:
        - bearerAuth: []
        - {}
      description: |
        Removes every entry whose (rule_id, host) pair equals the query
        exactly — an entry that silences one rule on ALL hosts is only
        removed by a query without host, and vice versa: no silent
        wildcard expansion either way. `404` when nothing matched, `400`
        when both parameters are empty. Answers with the new state and
        logs `WRITE suppressions remove rule=... host=... by=api`.
      parameters:
        - name: rule_id
          in: query
          schema:
            type: string
          description: exact rule id of the entries to remove
        - name: host
          in: query
          schema:
            type: string
          description: exact (case-insensitive) host of the entries to remove
      responses:
        '200':
          description: The new allowlist state (same shape as the get)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suppressions'
        '400':
          description: Both query parameters are empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WritesDisabled'
        '404':
          description: No entry matches the (rule_id, host) pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/sequences:
    get:
      tags: [status]
      operationId: listSequences
      summary: Loaded kill-chain sequences (read-only view)
      security:
        - bearerAuth: []
        - {}
      description: |
        The kill-chain sequences currently loaded by the correlator
        (sorted by id, hot-reload aware). Sequences are NOT managed
        through this API: they live in the `sequences/*.yaml` files the
        engine hot-reloads every 15 s. An empty list means the
        correlator is off (the engine found no sequences/ directory);
        combined with `stats.correlator_states` this endpoint tells the
        operator which chains are armed and how their steps are wired.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Loaded sequences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sequence'
  /api/events:
    get:
      tags: [telemetry]
      operationId: listEvents
      summary: Recent events (newest first)
      security:
        - bearerAuth: []
        - {}
      description: |
        All filters are AND-combined and applied BEFORE `limit`, so
        `?limit=50` with a filter returns the 50 most recent MATCHING
        events, not a filtered slice of the last 50.

        When the engine runs with `-store`, this list reads the persistent
        SQLite store (full history, subject to the configured retention)
        instead of the in-memory ring, so `since=24h` can reach further
        back than the ring's 1000-event window.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/EventType'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Q'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Up to `limit` events, newest first (from the in-memory
            ring, or the full stored history when `-store` is on)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /api/alerts:
    get:
      tags: [telemetry]
      operationId: listAlerts
      summary: Recent alerts (newest first) with triage status
      security:
        - bearerAuth: []
        - {}
      description: |
        Same filter semantics as `/api/events`. Each alert carries the
        lifecycle overlay merged at read time: `status` (always present,
        `new` when no operator decision exists), plus `status_note`,
        `status_by` and `status_at` when the alert has been triaged via
        `POST /api/alerts/{id}/status`. When the engine runs with
        `-store`, this list reads the persistent SQLite store (full
        history, subject to the configured retention) instead of the
        in-memory ring — the overlay applies in both modes.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Q'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Up to `limit` alerts, newest first (from the in-memory
            ring, or the full stored history when `-store` is on)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
  /api/alerts/search:
    get:
      tags: [telemetry]
      operationId: searchAlerts
      summary: Stable pages of alert history with lifecycle filters
      security:
        - bearerAuth: []
        - {}
      description: |
        Reads SQLite when enabled, otherwise the retained 256-entry memory
        ring. Pages are ordered by insertion sequence, newest received first,
        independently of event timestamps. The first page pins an upper
        sequence; subsequent arrivals do not shift earlier pages. Retention,
        ring eviction and lifecycle decisions can still change membership.
        No total count is claimed. The existing list/export routes are unchanged.
        Use page_cursor to revisit the current page and next_cursor to continue.
        A cursor is a read-only position tied to the source, engine lifetime
        and query; restart the search after changing filters or restarting the
        engine. Relative since/until bounds are frozen at the first page.
        Lifecycle filtering is applied before the page limit. Each request
        has a four-second time budget and examines at most 5000 matching
        evidence records. scan_limited with
        has_more means unexamined records remain, not that another matching
        lifecycle result is guaranteed; an empty page can have a continuation.
        Free-text q searches detection evidence, not lifecycle notes.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque page position from this same query, at most 1024 characters.
          schema: { type: string, maxLength: 1024 }
        - name: status
          in: query
          schema:
            type: string
            enum: [all, open, new, acknowledged, closed]
            default: all
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Invalid filters, limit or expired/mismatched cursor.
        '500':
          description: Persistent store read failed; no partial page is served.
        '504':
          description: The search exceeded its four-second time budget; narrow the filters.
        '200':
          description: A bounded page and an explicit continuation, when needed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSearchPage'
  /api/alerts/{id}/forensics:
    get:
      tags: [telemetry]
      operationId: getAlertForensics
      summary: Frozen evidence bundle of one alert (timeline + summary)
      security:
        - bearerAuth: []
        - {}
      description: |
        The forensic layer of the engine: when a `high` or `critical`
        alert fires, the engine freezes an evidence bundle — the alert
        itself plus the host's event timeline for the 5 minutes that
        preceded detection — to `<forensics>/<id>.json` at detection
        time (atomic write, directory capped at 256 bundles,
        oldest-first eviction).

        The bundle exists independently of the in-memory ring, of
        `-store` and of engine restarts within retention: an
        investigation must not depend on where the alert currently
        lives. Disabling capture (`-forensic=false`) keeps the route
        answering `501` so the console can render "feature off"
        instead of a misleading 404.
      parameters:
        - name: id
          in: path
          required: true
          description: alert id (16 lowercase hex characters, the `id` field of the alert)
          schema:
            type: string
            pattern: '^[0-9a-f]{16}$'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The evidence bundle frozen at detection time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForensicBundle'
        '400':
          description: Malformed alert id (not 16 lowercase hex). The
            JSON body names the problem.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Well-formed id but no bundle for it — severity
            below the capture threshold (only high/critical freeze
            evidence), evicted by the retention cap, or the engine
            restarted before capture. The JSON body says which.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: The bundle exists but could not be decoded
            (integrity failure; details in the engine log, a generic
            body on the wire).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '501':
          description: Forensic capture disabled on this engine
            (`-forensic=false`); the id was never going to have a
            bundle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/alerts/{id}/status:
    post:
      tags: [telemetry]
      operationId: setAlertStatus
      summary: Record the operator triage decision for one alert
      security:
        - bearerAuth: []
        - {}
      description: |
        The WRITE surface of the alert lifecycle. `status` is one of
        `acknowledged` (seen, under investigation), `closed` (handled)
        or `new` (explicit reopen). The optional `note` is the triage
        note (max 2000 chars) and `by` a free-text operator name (max
        200 chars; the API has a single shared bearer token, so `by`
        is informational and NOT authenticated).

        The lifecycle store is the source of truth for STATUS: the
        target alert does not need to be in the 256-entry ring (an
        evicted alert can legitimately be closed). Without
        `-lifecycle` the engine keeps statuses in memory only and they
        reset on restart; with it, the JSON file is written atomically
        on every change. Success broadcasts an `alert_lifecycle` SSE
        frame so live consumers update without polling.
      parameters:
        - name: id
          in: path
          required: true
          description: alert id (16 lowercase hex characters, the `id` field of the alert)
          schema:
            type: string
            pattern: '^[0-9a-f]{16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertStatusUpdate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The stored lifecycle entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertLifecycle'
        '400':
          description: |
            Malformed alert id, invalid JSON body, unknown status, or
            note/by over their length limits. The JSON body names the
            problem (`{"error":"..."}`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/rules:
    get:
      tags: [rules]
      operationId: listRules
      summary: Live rule set
      security:
        - bearerAuth: []
        - {}
      description: |
        The rules currently loaded (hot-reload aware, sorted by id).
        `mitre` and `tactic` are derived from the rule tags: the
        `attack.txxxxxx` tag upper-cased, the first `attack.<tactic>`
        tag title-cased. Conditions mirror the YAML rule format.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Current rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'
  /api/stream:
    get:
      tags: [stream]
      operationId: streamFeed
      summary: Server-Sent Events feed of live events and alerts
      security:
        - bearerAuth: []
        - {}
      description: |
        Long-lived `text/event-stream`. Frame types:

        - `event: event` - data is one `Event` JSON
        - `event: alert` - data is one `Alert` JSON (rule hits and
          kill-chain completions from the correlator)
        - `event: alert_lifecycle` - data is one `AlertLifecycle` JSON
          (a triage decision recorded via `POST /api/alerts/{id}/status`)

        Control lines: `retry: 2000`, heartbeat comments (`: hb`) every
        15 s. Slow consumers with a full per-client buffer miss frames
        instead of blocking the engine; reconnect and re-sync with
        `/api/events` and `/api/alerts`.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  retry: 2000

                  event: event
                  data: {"id":"9c1f...","timestamp":"2026-09-29T16:20:11.512Z","type":"process.create","source":"sf-sensor","host":"LAB-WKS-01","process":{"pid":4212,"name":"powershell.exe","command_line":"powershell -enc SQBF..."}}

                  : hb
  /api/events/export:
    get:
      tags: [export]
      operationId: exportEvents
      summary: Bulk download of the event ring
      security:
        - bearerAuth: []
        - {}
      description: |
        `limit` (default 1000, capped at 1000) keeps the most recent
        matching events. When the engine runs with `-store`, the export
        reads the persistent SQLite store (full history, subject to the
        configured retention) instead of the in-memory ring.
        JSONL round-trips the full `Event` records (same contract as the
        NDJSON wire). CSV flattens to stable columns (`id`, `timestamp`,
        `type`, `source`, `host`, `user`, `process_name`,
        `process_pid`, `process_command_line`, `file_path`,
        `network_destination`, `network_port`, `registry_key`) and
        neutralizes spreadsheet formula injection on
        attacker-controlled cells (leading `= + - @`, tab or CR are
        quoted). Response carries `Content-Disposition: attachment`
        with a dated filename.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ExportFormat'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/EventType'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Q'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Filtered event ring (oldest first) in the requested format
          content:
            application/x-ndjson:
              schema:
                type: string
                description: one Event JSON object per line
            text/csv:
              schema:
                type: string
                description: header row + one row per event
        '400':
          description: Unknown `format` value
          content:
            text/plain:
              schema:
                type: string
                example: 'unsupported format: use jsonl, ndjson or csv'
  /api/alerts/export:
    get:
      tags: [export]
      operationId: exportAlerts
      summary: Bulk download of the alert ring
      security:
        - bearerAuth: []
        - {}
      description: |
        Same semantics as `/api/events/export` for alerts. CSV columns:
        `id`, `status`, `timestamp`, `severity`, `rule_id`, `rule_name`,
        `event_type`, `host`, `user`, `summary`, `matched_on`
        (space-joined), `tags` (space-joined), `message`, `notify`,
        `status_note`, `status_by`. When the engine runs with `-store`,
        the export reads the persistent SQLite store (full history,
        subject to the configured retention) instead of the alert ring.
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
        - $ref: '#/components/parameters/Host'
        - $ref: '#/components/parameters/Severity'
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Q'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: |
            Filtered alert ring (oldest first) in the requested format.
            `limit` caps the FILTERED set, keeping the most recent.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: one Alert JSON object per line
            text/csv:
              schema:
                type: string
                description: header row + one row per alert
        '400':
          description: Unknown `format` value
          content:
            text/plain:
              schema:
                type: string
                example: 'unsupported format: use jsonl, ndjson or csv'
  /api/respond/kill:
    post:
      tags: [respond]
      operationId: respondKill
      summary: Kill one verified local process (-allow-kill, operator-invoked)
      security:
        - bearerAuth: []
        - {}
      description: |
        Active response, iteration 1 (C3): terminates ONE process on the
        engine's own host with a fixed SIGKILL, on behalf of a named
        human operator. The surface exists only when the engine started
        with `-allow-kill` (or `SF_ALLOW_KILL=1`) AND an API token is
        configured AND the `-respond-audit` file opened; a disarmed
        engine answers a real `404`, identical to any unknown path. The
        bearer token is mandatory even on loopback (kill is stricter
        than the suppression writes).

        Five permission layers run before any signal, and every
        well-formed attempt (denied included) lands in the
        `-respond-audit` JSONL BEFORE the signal — the action that
        cannot be proven to have happened, does not happen:

        - the `operator` must be on the `-respond-operators` allowlist
          (`operator_not_allowed`; a missing file means an empty
          allowlist: everything denied);
        - `host` must equal the engine's own hostname (`host_mismatch`)
          — a console replaying a REMOTE sensor's alert can never turn
          it into a local kill;
        - budgets: per-(host,pid) 60 s cooldown, 20 actions/min global
          and 6 actions/min per operator, all counted on COMMITTED
          actions only (`cooldown_active`, `rate_limited`,
          `operator_rate_limited`);
        - the process guard verifies the target is the object the
          operator named: the kill uses ONE pinned object (pidfd on
          Linux, a single handle on Windows — `mechanism` in the
          response says which), the real name is checked per platform
          (`pid_mismatch`), the engine and its ancestors are
          untouchable (`self_protected`), protected names (platform
          defaults plus `-respond-protected`) are refused
          (`process_protected`), and pid 0/1/negative are invalid
          (`pid_invalid`);
        - audit write failure or the 64 MiB file ceiling degrades every
          action to `audit_unavailable` — never to an unrecorded kill.

        The name check protects against the MECHANICAL error (wrong
        PID through recycling), not against malware disguising its
        identity: the kill decision belongs to the operator, backed by
        the alert. Repeating an `idempotency_key` answers `409`
        (`idempotency_repeated`); the bounded map forgets the oldest
        key when 1024 are held (a forgotten key simply executes again;
        the cooldown still covers immediate retries). There is NO
        automation path: rules, sequences, the correlator and the
        actions dispatcher cannot reach this surface (binding landing
        requirement R8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondKillRequest'
      responses:
        '200':
          description: |
            The signal was sent to the verified object (synchronous
            contract: the response carries the outcome, not a promise —
            `202` is reserved for a future queued design).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondKillExecuted'
        '400':
          description: Malformed JSON or a structurally invalid body (missing required fields, over-cap strings)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Permission or guard denial: the body names one of
            `operator_not_allowed`, `host_mismatch`, `pid_invalid`,
            `pid_mismatch`, `pid_not_found`, `pid_access_denied`,
            `self_protected`, `process_protected`, `audit_unavailable`.
            Every 403 here is audited in the engine's respond-audit
            JSONL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondKillDenied'
        '409':
          description: The `idempotency_key` was already committed (client retry) — nothing is executed again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondKillDenied'
        '429':
          description: >-
            Budget denial: `cooldown_active` (same host+pid within
            60 s), `rate_limited` (global 20/min) or
            `operator_rate_limited` (6/min per operator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondKillDenied'

  /api/respond/state:
    get:
      tags: [respond]
      operationId: respondState
      summary: Armed state of the active-response surface (flags, live counters, audit file health)
      security:
        - bearerAuth: []
        - {}
      description: |
        Console visibility of the C3 surface: what the engine armed at
        startup, the LIVE allowlist/protected counts (the 15 s
        hot-reload changes them under a running engine) and the audit
        file size against its 64 MiB ceiling. The same contract as
        `POST /api/respond/kill` applies: a disarmed engine answers a
        real `404`, identical to any unknown path, so probing learns
        nothing about a surface that does not exist for it.
      responses:
        '200':
          description: The surface is armed (`armed` is always true in a 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The surface is not armed (or the engine predates the route) - a real 404, byte-identical to any unknown path.
          content:
            text/plain:
              schema:
                type: string
                example: 404 page not found

  /api/respond/audit:
    get:
      tags: [respond]
      operationId: respondAudit
      summary: Most recent active-response attempts from the audit JSONL (newest first)
      security:
        - bearerAuth: []
        - {}
      description: |
        Tails the `-respond-audit` JSONL: the most recent attempts
        (executed AND denied, the audit Record schema verbatim, newest
        first) plus the honest bookkeeping of the scan. `skipped`
        counts lines that are not records yet (the torn tail of a
        concurrent append, or a line that failed to parse) - counted,
        never served as data; `truncated` marks files where older
        records exist beyond the read window. The reader never locks,
        truncates or rewrites the file: the append-only proof surface
        keeps its writer contract untouched.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum records returned (default 100, hard cap 500; invalid values fall back to the default, same clamp style as /api/events).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: The tail of the audit file (an empty array on a fresh audit file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondAuditResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The surface is not armed - a real 404, byte-identical to any unknown path.
          content:
            text/plain:
              schema:
                type: string
                example: 404 page not found
        '500':
          description: The audit file could not be read (permissions, disk) - the failure is reported, never smoothed into an empty feed.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Optional: only enforced when the engine is started with
        `-api-token` (or `SF_API_TOKEN`). When enabled, every path
        below answers 401 without a valid `Authorization: Bearer`
        header, EXCEPT `/api/health`, which stays open for liveness
        probes and reveals nothing but `{"mode":"engine","status":"ok"}`.
  responses:
    Unauthorized:
      description: |
        Missing or wrong Bearer credential while the API token is
        configured. Carries a `WWW-Authenticate: Bearer` challenge and
        a JSON body naming the flag/env to configure. `/api/health`
        never answers 401.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "unauthorized: send 'Authorization: Bearer <token>' (configure it with -api-token/SF_API_TOKEN)"
    WritesDisabled:
      description: |
        The write surface is not armed: the engine is running without
        `-api-write` (or `SF_API_WRITE=1`), so `POST`/`DELETE` on
        `/api/suppressions` are refused before any validation. The body
        names the flag, like the 401 names the token. Arming also
        requires the bearer gate beyond loopback: an engine with no
        `-api-token` and a non-loopback bind refuses to arm writes at
        startup.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "api writes are disabled: restart the engine with -api-write (or SF_API_WRITE=1) to allow suppression writes"
  parameters:
    Host:
      name: host
      in: query
      required: false
      description: Exact host filter, case-insensitive.
      schema:
        type: string
    Severity:
      name: severity
      in: query
      required: false
      description: |
        Alert-only. Comma-separated severities to keep; anything else
        answers 400.
      schema:
        type: string
        example: critical,high
    RuleId:
      name: rule_id
      in: query
      required: false
      description: Alert-only. Exact rule id filter.
      schema:
        type: string
    EventType:
      name: type
      in: query
      required: false
      description: Event-only. Exact event type filter (e.g. `process.create`).
      schema:
        type: string
    Since:
      name: since
      in: query
      required: false
      description: |
        Lower time bound (inclusive window handled by the engine):
        RFC 3339 timestamp, or a positive duration counted back from now
        (`90m`, `24h`). Invalid values answer 400.
      schema:
        type: string
        example: 24h
    Until:
      name: until
      in: query
      required: false
      description: |
        Upper time bound. Same accepted forms as `since`; must not be
        earlier than `since`.
      schema:
        type: string
    Q:
      name: q
      in: query
      required: false
      description: |
        Free-text substring filter (case-insensitive) across identifiers
        and context: for alerts rule id/name, host, user, summary,
        message, event type, tags; for events id, type, source, host,
        user, process name/command line, file path, network
        destination/domain, registry key, access target.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum items to return. Non-numeric values fall back to the
        default; anything above 1000 (the ring size) is capped.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
        default: 200
    ExportFormat:
      name: format
      in: query
      required: false
      description: Download format. Defaults to `jsonl` when omitted.
      schema:
        type: string
        enum: [jsonl, csv]
        default: jsonl
  schemas:
    HotHost:
      type: object
      description: one host's decayed risk score (package A1 of the owner's roadmap).
        A triage-prioritization signal — which hosts are making noise that looks dangerous
        right now — not a compromise verdict.
      required: [host, score, alerts, last_seen]
      properties:
        host:
          type: string
          description: hostname the risk accumulated on
        score:
          type: number
          format: double
          description: current decayed score, rounded to 2 decimals (one critical alert
            starts at 10 and halves every 30 minutes without new alerts)
        alerts:
          type: integer
          description: alerts counted for this host since it started being tracked
        last_seen:
          type: string
          format: date-time
          description: timestamp (RFC 3339, UTC) of the most recent alert on this host
    Health:
      type: object
      required: [status, mode]
      properties:
        status:
          type: string
          enum: [ok]
        mode:
          type: string
          enum: [engine]
    Stats:
      type: object
      required:
        - uptime_s
        - events_total
        - dropped
        - ingest_rejected
        - events_per_min
        - alerts_total
        - by_severity
        - rules_count
        - rules_types
        - events_buffered
        - webhook_sent
        - webhook_failed
        - webhook_dropped
        - elastic_sent
        - elastic_failed
        - elastic_dropped
        - splunk_sent
        - splunk_failed
        - splunk_dropped
        - suppressions_active
        - correlator_states
        - correlator_sequences
        - correlator_cap
        - store_enabled
        - store_events
        - store_alerts
        - mode
        - risk_hosts_tracked
        - hot_hosts
        - beacons_tracked
        - beacons_cap
        - beacons_fired
        - threshold_rules
        - threshold_keys
        - threshold_fired
        - notify_channels
      properties:
        suppressions_active:
          type: integer
          description: non-expired entries in the operator allowlist
        store_enabled:
          type: boolean
          description: whether the engine runs with persistent SQLite storage (-store)
        store_events:
          type: integer
          format: int64
          description: events currently persisted in the store (0 while store_enabled is false;
            includes rows that predate the current process start and survives restarts)
        store_alerts:
          type: integer
          format: int64
          description: alerts currently persisted in the store (0 while store_enabled is false)
        uptime_s:
          type: integer
          description: seconds since the API hub started
        events_total:
          type: integer
          format: int64
          description: events ingested since start (accepted by the TCP listener)
        dropped:
          type: integer
          format: int64
          description: malformed events discarded by the ingest decoder (the
            connection receives an ack error and stays open; the listener
            applies backpressure instead of dropping on a full channel)
        ingest_rejected:
          type: integer
          format: int64
          description: connections closed by the ingest shared-token
            handshake (no AUTH line, wrong or missing token, AUTH sent to
            a tokenless engine, or auth timeout) — how visible probes
            against a remote bind show up; zero while auth is disabled
        events_per_min:
          type: integer
          description: events received in the last 60 seconds
        alerts_total:
          type: integer
          description: alerts raised since start (dedup excluded)
        by_severity:
          type: object
          additionalProperties:
            type: integer
          description: alerts_total broken down by severity
        rules_count:
          type: integer
          description: currently loaded rules (hot-reload aware)
        rules_types:
          type: array
          items:
            type: string
          description: distinct event types covered by the rule set
        events_buffered:
          type: integer
          description: events currently held in the API ring (max 1000)
        webhook_sent:
          type: integer
          format: int64
          description: webhook deliveries acknowledged with 2xx
        webhook_failed:
          type: integer
          format: int64
          description: webhook deliveries that exhausted their 3 attempts
        webhook_dropped:
          type: integer
          format: int64
          description: alerts discarded because the webhook queue (512) saturated
        elastic_sent:
          type: integer
          format: int64
          description: alerts bulk-indexed into Elasticsearch (items accepted by
            _bulk); retries are idempotent thanks to the deterministic per-alert _id
        elastic_failed:
          type: integer
          format: int64
          description: alerts the Elasticsearch sink gave up on (3 attempts, or
            permanently rejected items such as mapping errors)
        elastic_dropped:
          type: integer
          format: int64
          description: alerts discarded because the Elasticsearch queue (512) saturated
        splunk_sent:
          type: integer
          format: int64
          description: HEC events accepted by the Splunk collector (HTTP 2xx with
            a zero ack code)
        splunk_failed:
          type: integer
          format: int64
          description: HEC events the Splunk sink gave up on (3 attempts, or
            permanent rejections such as a non-zero ack code with HTTP 200)
        splunk_dropped:
          type: integer
          format: int64
          description: alerts discarded because the Splunk queue (512) saturated
        correlator_states:
          type: integer
          description: in-flight (sequence, host) chains currently tracked by the
            kill-chain correlator; compare against correlator_cap to watch
            headroom — reaching the cap means NEW hosts silently stop being
            tracked until states are pruned (Reload) or completed
        correlator_sequences:
          type: integer
          description: kill-chain sequences loaded from the sequences/ directory;
            zero means the correlator is off (no directory found)
        correlator_cap:
          type: integer
          description: hard cap of tracked chains (maxTrackedStates in
            internal/correlate, 8192); a hostile feed inventing hostnames is
            the usual reason to approach it
        mode:
          type: string
          enum: [engine]
        risk_hosts_tracked:
          type: integer
          description: hosts currently carrying a non-cold per-host risk score (package A1
            of the roadmap). Scores accumulate fixed weights per alert severity (critical 10,
            high 5, medium 2, low 1, info 0) and decay with a 30-minute half-life; hosts
            whose score decays to zero stop counting here. Triage status deliberately does
            not affect the score — it models detection activity, not operator judgment.
        hot_hosts:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/HotHost'
          description: top 5 hosts by current decayed risk score, highest first (ties
            broken by hostname for deterministic output)
        beacons_tracked:
          type: integer
          description: beacon keys currently holding in-window connection evidence (package
            A3 of the roadmap). One key is one (profile, host, destination) triple;
            compare against beacons_cap to watch headroom — past the cap the weakest
            keys (fewest accumulated samples) are evicted first, so a flood of unique
            fake destinations can never wash out evidence that is building
        beacons_cap:
          type: integer
          description: hard cap of tracked beacon keys (MaxKeys in internal/beacon, 8192);
            a hostile feed inventing destinations is the usual reason to approach it
        beacons_fired:
          type: integer
          format: int64
          description: beacon alerts emitted since engine start (across profile
            hot-reloads; each alert carries the profile id as rule_id)
        threshold_rules:
          type: integer
          description: volumetric threshold definitions currently loaded (package
            A2 of the roadmap). Zero when the thresholds file is absent
        threshold_keys:
          type: integer
          description: threshold aggregation keys currently holding in-window
            evidence; one key is one (definition, host, group_by value) triple.
            Compare against the per-rule quota (2048) documented in README to
            watch saturation — a flood of unique group values consumes only
            the offending rule's own quota
        threshold_fired:
          type: integer
          format: int64
          description: threshold alerts emitted since engine start (each alert
            carries the definition id as rule_id)
        notify_channels:
          type: array
          description: one delivery row per external notification channel
            configured via -notify (Slack, Telegram, email); empty when the
            engine runs without the flag. sent/failed/dropped mirror the
            webhook counters semantics per channel; filtered counts alerts
            skipped by the channel's min_severity floor (operator-configured
            silence, reported as data).
          items:
            $ref: '#/components/schemas/NotifyChannelStats'
    NotifyChannelStats:
      type: object
      description: |
        Delivery counters of one external notification channel (C2).
        name is the operator label from the -notify config (defaults to
        the channel type when unnamed); type is slack, telegram or email.
      required: [name, type, sent, failed, dropped, filtered]
      properties:
        name:
          type: string
          description: channel label used in /metrics as the channel label value
        type:
          type: string
          enum: [slack, telegram, email]
        sent:
          type: integer
          format: int64
          description: deliveries accepted by the receiver (2xx)
        failed:
          type: integer
          format: int64
          description: deliveries that exhausted their 3 attempts
        dropped:
          type: integer
          format: int64
          description: alerts discarded because the channel queue (256) saturated
        filtered:
          type: integer
          format: int64
          description: alerts skipped by the channel min_severity floor
    Event:
      type: object
      description: |
        Unified event schema (the wire contract, pkg/model). Sensors
        emit it, the engine validates and enriches it. Payload objects
        depend on type and may coexist (for example process and file).
        Imported SOC observations use attributes; source is declared, not attested.
      required: [id, timestamp, type, source, host]
      properties:
        id:
          type: string
          description: sender-provided identifier; collectors use a stable 32-hex digest of source, observer and record
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - process.create
            - process.terminate
            - process.access
            - file.write
            - network.connect
            - image.load
            - registry.set
            - network.alert
            - host.query
            - honeypot.connect
            - honeypot.login
            - honeypot.command
            - network.firewall
            - email.message
        source:
          type: string
          description: declared sender, e.g. sysmon, etw, simulate, suricata, zeek, osquery, cowrie, windows-firewall or eml
        host:
          type: string
        user:
          type: string
        process:
          $ref: '#/components/schemas/Process'
        target:
          $ref: '#/components/schemas/Process'
        access:
          type: object
          description: process-handle telemetry (Sysmon EID 10)
          properties:
            granted_access:
              type: string
              description: hex access mask, e.g. 0x1010
            call_trace:
              type: string
        file:
          type: object
          properties:
            path:
              type: string
            extension:
              type: string
            size_bytes:
              type: integer
              format: int64
            hashes:
              type: object
              additionalProperties:
                type: string
              description: digests keyed by algorithm (sha256, md5)
        network:
          type: object
          properties:
            protocol:
              type: string
            source_ip:
              type: string
            source_port:
              type: integer
            destination_ip:
              type: string
            destination_port:
              type: integer
            domain:
              type: string
        registry:
          type: object
          properties:
            key:
              type: string
              example: HKCU\Software\Microsoft\Windows\CurrentVersion\Run
            value_name:
              type: string
            value:
              type: string
              description: data written
            operation:
              type: string
              enum: [SetValue, CreateKey, DeleteKey, RenameKey]
        tags:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: string
          description: declared source observations, bounded and normalized by the collector; separate from enrichment
        enrichment:
          type: object
          additionalProperties:
            type: string
          description: added by the engine, never mutates the evidence fields
    Process:
      type: object
      required: [pid, name]
      properties:
        pid:
          type: integer
        ppid:
          type: integer
        name:
          type: string
        command_line:
          type: string
        image:
          type: string
        hashes:
          type: object
          additionalProperties:
            type: string
    AlertSearchPage:
      type: object
      required: [items, source, has_more, next_cursor, page_cursor, scanned, scan_limited]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Alert'
        source:
          type: string
          enum: [memory, sqlite]
        has_more:
          type: boolean
          description: A continuation exists; it may examine records without matching lifecycle state.
        next_cursor:
          type: string
          description: Empty at the end, otherwise the cursor for the next request.
        page_cursor:
          type: string
          description: Cursor for revisiting this page with the same upper sequence.
        scanned:
          type: integer
          minimum: 0
          maximum: 5000
        scan_limited:
          type: boolean
          description: The request reached its evidence scan cap; continue instead of assuming no results.
    Alert:
      type: object
      description: |
        Structured alert raised by a rule hit (or a kill-chain
        completion). Identical payload on the JSON log line, the
        webhook body and the console/hub stream, so consumers speak
        one format. `message` and `notify` are rendered from the
        firing rule's `alert` action, when it declares one.

        The `status*` fields are the lifecycle overlay merged by
        GET /api/alerts (and the alerts export): `status` is always
        present there (`new` when no operator decision exists), the
        rest appear once the alert has been triaged. The raw payloads
        (log line, webhook, SSE alert frames) carry no status fields —
        an alert raised seconds ago is new by definition.
      required:
        - id
        - timestamp
        - rule_id
        - rule_name
        - severity
        - host
        - event_id
        - event_type
        - summary
        - matched_on
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: unique alert id assigned by the engine (the lifecycle key)
        timestamp:
          type: string
          format: date-time
        rule_id:
          type: string
        rule_name:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        host:
          type: string
        user:
          type: string
        event_id:
          type: string
          description: id of the event that triggered the alert
        event_type:
          type: string
        source:
          type: string
          description: source declaration of the triggering observation
        attributes:
          $ref: '#/components/schemas/Event/properties/attributes'
        network:
          $ref: '#/components/schemas/Event/properties/network'
        summary:
          type: string
          description: human-readable one-liner (may contain attacker-controlled text)
        message:
          type: string
          description: rendered from the rule's alert action template, when present ({host}-style placeholders already substituted)
        notify:
          type: boolean
          description: the rule asks for external notification (alert action config)
        matched_on:
          type: array
          items:
            type: string
          description: dotted fields whose conditions matched
        tags:
          type: array
          items:
            type: string
          description: MITRE ATT&CK tags of the rule
        actions:
          type: array
          items:
            type: string
          description: action names declared by the rule; declaration is not proof of execution
        enrichment:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [new, acknowledged, closed]
          description: operator triage state (read-side overlay, always present)
        status_note:
          type: string
          description: free-text triage note from the operator decision
        status_by:
          type: string
          description: operator name as free text (the shared token does not identify users)
        status_at:
          type: string
          format: date-time
          description: when the status was recorded
    AlertStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, acknowledged, closed]
          description: '`new` doubles as the explicit reopen'
        note:
          type: string
          maxLength: 2000
          description: triage note (what was seen, what was done)
        by:
          type: string
          maxLength: 200
          description: operator name, informational only
    ForensicBundle:
      type: object
      description: |
        The evidence document frozen at detection time by the engine's
        flight recorder: the alert plus the host's event timeline that
        preceded it (window `-5m` to the alert, plus the triggering
        event itself; the newest `200` events are kept when the window
        overflows). Written atomically, readable back for the lifetime
        of the bundle directory.
      required: [alert, captured_at, host, window, timeline, summary]
      properties:
        alert:
          $ref: '#/components/schemas/Alert'
        captured_at:
          type: string
          format: date-time
          description: RFC 3339 (nanosecond) capture moment.
        host:
          type: string
          description: Host whose timeline was frozen.
        window:
          type: string
          description: Human-readable window description (e.g. "5m0s
            before alert (plus the triggering event)").
        timeline:
          type: array
          description: Host events inside the window, oldest first,
            capped at 200 entries (the tail closest to the alert is
            the evidence an investigator reads first).
          items:
            $ref: '#/components/schemas/Event'
        summary:
          type: object
          description: Counted shape of the timeline — what an
            operator scans before reading a single event.
          required: [events, process_creates, network_connects, file_writes, registry_sets, process_accesses, other, distinct_users, distinct_images]
          properties:
            events:
              type: integer
            process_creates:
              type: integer
            network_connects:
              type: integer
            file_writes:
              type: integer
            registry_sets:
              type: integer
            process_accesses:
              type: integer
            other:
              type: integer
            distinct_users:
              type: integer
            distinct_images:
              type: array
              items:
                type: string

    AlertLifecycle:
      type: object
      description: One lifecycle record as stored (also the `alert_lifecycle` SSE frame payload)
      required: [alert_id, status, at]
      properties:
        alert_id:
          type: string
          pattern: '^[0-9a-f]{16}$'
        status:
          type: string
          enum: [new, acknowledged, closed]
        note:
          type: string
        by:
          type: string
        at:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp of the decision
    Rule:
      type: object
      required:
        - id
        - name
        - description
        - severity
        - event_type
        - tags
        - conditions
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        event_type:
          type: string
        mitre:
          type: string
          description: derived from tags, e.g. T1059.001 (empty when the rule has no attack.t tag)
        tactic:
          type: string
          description: derived from tags, e.g. Execution (empty when absent)
        tags:
          type: array
          items:
            type: string
        conditions:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field:
                type: string
                description: dotted path into the event, e.g. process.command_line
              operator:
                type: string
                enum:
                  - eq
                  - neq
                  - contains
                  - contains_any
                  - startswith
                  - endswith
                  - regex
                  - in
                  - not_in
                  - gt
                  - lt
              value:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  - type: number
    SuppressionEntry:
      type: object
      description: |
        One suppression entry: the same fields and validation as a YAML
        entry (rule_id and host must not both be empty; an entry with
        only host silences every rule on that host, an entry with only
        rule_id silences that rule everywhere). Field caps guard the
        control file: rule_id 128, host 253, reason 2000, expires 40
        characters; the request body is capped at 8 KiB and the file at
        1000 entries via the write API.
      properties:
        rule_id:
          type: string
          maxLength: 128
          description: rule id to silence (empty = every rule, as long as host is set)
        host:
          type: string
          maxLength: 253
          description: host to scope the entry to (empty = every host); compared case-insensitively
        reason:
          type: string
          maxLength: 2000
          description: free-text justification stored in the file
        expires:
          type: string
          maxLength: 40
          description: RFC 3339 expiration (e.g. 2026-10-02T00:00:00Z); empty = until removed
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: actionable one-line reason (client-side problems name the fix; server-side problems point to the engine log)
    RespondKillRequest:
      type: object
      required: [host, pid, process_name, operator, reason]
      properties:
        host:
          type: string
          maxLength: 253
          description: must equal the engine host's hostname (R3) — the engine refuses to guess which host the PID belongs to
        pid:
          type: integer
          minimum: 2
          description: target PID; 0/1/negative are denied as pid_invalid (mass-signal semantics on Unix)
        process_name:
          type: string
          maxLength: 256
          description: expected real name of the target (platform-resolved basename); a mismatch denies with pid_mismatch
        operator:
          type: string
          maxLength: 64
          description: human operator assuming the action; must be on the -respond-operators allowlist
        reason:
          type: string
          maxLength: 512
          description: non-empty free text recorded in the audit line
        rule_id:
          type: string
          maxLength: 128
          description: optional rule or sequence that motivated the action
        alert_id:
          type: string
          maxLength: 64
          description: optional originating alert id
        idempotency_key:
          type: string
          maxLength: 128
          description: optional client key; a repeat answers 409, the bounded map forgets the oldest key at 1024 entries
    RespondKillExecuted:
      type: object
      required: [action_id, status, signal, mechanism]
      properties:
        action_id:
          type: string
          description: 32-hex id shared by the audit line and this response
        status:
          type: string
          enum: [executed]
        signal:
          type: string
          enum: [SIGKILL]
          description: fixed for iteration 1 (dictamen Q1)
        mechanism:
          type: string
          enum: [pidfd, fallback, handle]
          description: >-
            how the verified object was killed (R1: pinned object
            on Linux/Windows, fallback re-verifies the name
            immediately before the signal)
        fallback_reason:
          type: string
          description: >-
            present ONLY when mechanism=fallback: the errno name that
            made pidfd_open fail and forced the classic-kill path
            (enosys = kernel without pidfd, permanent and expected;
            emfile/enfile = fd-table exhaustion of a live mechanism,
            transient and worth watching; enomem/eperm/einval; unknown
            errnos render as errno_<number>). Absent for pidfd/handle.
    RespondKillDenied:
      type: object
      required: [error, action_id]
      properties:
        error:
          type: string
          description: one of the denial codes of the operation description (403 family), idempotency_repeated (409) or the 429 family
        action_id:
          type: string
          description: 32-hex id of the denied attempt, matching its audit line
    RespondState:
      type: object
      required: [armed, signal, operators_count, protected_count, audit_path, audit_size, audit_ceiling]
      properties:
        armed:
          type: boolean
          description: always true in a 200 (a disarmed engine answers the real 404)
        signal:
          type: string
          enum: [SIGKILL]
          description: fixed for iteration 1 (dictamen Q1)
        operators_count:
          type: integer
          description: LIVE allowlist size (the 15 s hot-reload changes it under a running engine)
        protected_count:
          type: integer
          description: LIVE count of the operator-supplied protected names (platform defaults apply at check time)
        operators_path:
          type: string
          description: -respond-operators path as armed at startup (omitted when empty)
        protected_path:
          type: string
          description: -respond-protected path as armed (omitted when not configured)
        audit_path:
          type: string
          description: -respond-audit JSONL path as armed
        audit_size:
          type: integer
          description: current audit file size in bytes (live)
        audit_ceiling:
          type: integer
          description: the 64 MiB ceiling (67108864); at or above it every action denies with audit_unavailable until the operator rotates the file
    RespondAuditRecord:
      type: object
      description: One attempt line of the -respond-audit JSONL, verbatim (R5a schema).
      required: [ts, action_id, decision, pid, process_name, operator, reason, host, source]
      properties:
        ts:
          type: string
          description: RFC 3339 Nano, UTC
        action_id:
          type: string
          description: one id per attempt, shared with the kill API response so an incident reviewer can join both
        decision:
          type: string
          enum: [executed, denied]
        code:
          type: string
          description: denial code (present when the decision is denied; a followup line carries the failed outcome of a committed send)
        pid:
          type: integer
          description: requested PID
        process_name:
          type: string
          description: name the operator requested
        resolved_name:
          type: string
          description: platform-resolved real basename when known (re-revision O1 - denials included)
        operator:
          type: string
        rule_id:
          type: string
        alert_id:
          type: string
        reason:
          type: string
        host:
          type: string
        signal:
          type: string
          enum: [SIGKILL]
          description: stamped by the writer on every attempt (Q1 fixed)
        mechanism:
          type: string
          enum: [pidfd, fallback, handle]
          description: how the verified object was killed (present once known)
        source:
          type: string
          description: client RemoteAddr of the attempt (R5a attribution)
        followup:
          type: boolean
          description: second line of a committed send whose signal failed - the JSONL never claims an execution that did not land
    RespondAuditResponse:
      type: object
      required: [records, skipped, truncated]
      properties:
        records:
          type: array
          description: most recent attempts, newest first
          items:
            $ref: '#/components/schemas/RespondAuditRecord'
        skipped:
          type: integer
          description: lines seen that are not records (torn tail of a concurrent append, malformed) - counted, never served as data
        truncated:
          type: boolean
          description: older records exist beyond the read window (rotation stays an operator task)
    Suppressions:
      type: object
      required: [active, entries]
      properties:
        active:
          type: integer
          description: same count as `stats.suppressions_active`
        entries:
          type: array
          items:
            type: object
            required: [rule_id]
            properties:
              rule_id:
                type: string
                description: suppressed rule id (empty string = all rules)
              host:
                type: string
                description: suppressed host, lowercased (empty = every host)
              reason:
                type: string
                description: free-text justification from the YAML file
              expires:
                type: string
                description: RFC 3339 expiration as written in the file (empty = until removed)
    Sequence:
      type: object
      description: |
        One kill-chain sequence as the correlator loaded it. Steps are
        listed in declared order for display; matching itself is
        unordered (the correlator tracks which steps already matched
        per host, in any order, inside the window).
      required: [id, name, description, severity, window_seconds, tags, steps]
      properties:
        id:
          type: string
          description: stable sequence id (the alert rule_id of the completion)
        name:
          type: string
          description: human-readable campaign name shown in alerts
        description:
          type: string
          description: what completing the chain means, from the YAML file
        severity:
          type: string
          enum: [low, medium, high, critical]
          description: severity of the completion alert
        window_seconds:
          type: integer
          description: effective completion window in seconds (the configured
            window, or the 5-minute default compile applies)
        tags:
          type: array
          items:
            type: string
          description: tags copied onto the completion alert (MITRE, tactic)
        steps:
          type: array
          items:
            type: string
          description: contributing rule names (exact match against the live rule set)
