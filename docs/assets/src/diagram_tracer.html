<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1060px;
    font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    color: #1e2021;
  }
  .canvas { width: 1060px; padding: 26px 24px; background: #ffffff; }
  .pipeline { display: flex; align-items: center; gap: 0; max-width: 100%; }
  .step {
    flex: 1 1 auto;
    min-width: 150px;
    max-width: 100%;
    background: #f4f6f7;
    border: 1.4px solid #a2bac5;
    border-top: 3px solid #298bbc;
    border-radius: 6px;
    padding: 12px 10px;
    text-align: center;
  }
  .step .num {
    display: inline-block;
    width: 26px; height: 26px; line-height: 26px;
    border-radius: 50%;
    background: #344a55; color: #ffffff;
    font-size: 15px; font-weight: 700;
    margin-bottom: 6px;
  }
  .step .nt { font-size: 18px; font-weight: 700; color: #1e2021; line-height: 1.25; }
  .step .nd { font-size: 14.5px; color: #6f7578; margin-top: 5px; line-height: 1.3; }
  .arrow { flex: 0 0 auto; display: flex; align-items: center; padding: 0 4px; }
  .arrow svg { display: block; }
  .result {
    border-top-color: #437153;
    background: #f2f7f4;
    border-color: #9dbfa9;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="pipeline">

    <div class="step">
      <div class="num">1</div>
      <div class="nt">devsensor</div>
      <div class="nd">genera eventos de proceso simulados (Go)</div>
    </div>

    <div class="arrow">
      <svg width="34" height="18"><line x1="0" y1="9" x2="26" y2="9" stroke="#298bbc" stroke-width="2.2" marker-end="url(#a2)"/><defs><marker id="a2" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#298bbc"/></marker></defs></svg>
    </div>

    <div class="step">
      <div class="num">2</div>
      <div class="nt">TCP :7777</div>
      <div class="nd">protocolo NDJSON, 1 evento por linea</div>
    </div>

    <div class="arrow">
      <svg width="34" height="18"><line x1="0" y1="9" x2="26" y2="9" stroke="#298bbc" stroke-width="2.2" marker-end="url(#a3)"/><defs><marker id="a3" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#298bbc"/></marker></defs></svg>
    </div>

    <div class="step">
      <div class="num">3</div>
      <div class="nt">engine</div>
      <div class="nd">ingesta, parseo y normalizacion (Go)</div>
    </div>

    <div class="arrow">
      <svg width="34" height="18"><line x1="0" y1="9" x2="26" y2="9" stroke="#298bbc" stroke-width="2.2" marker-end="url(#a4)"/><defs><marker id="a4" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#298bbc"/></marker></defs></svg>
    </div>

    <div class="step">
      <div class="num">4</div>
      <div class="nt">Motor de reglas</div>
      <div class="nd">evalua reglas YAML del directorio rules/</div>
    </div>

    <div class="arrow">
      <svg width="34" height="18"><line x1="0" y1="9" x2="26" y2="9" stroke="#437153" stroke-width="2.2" marker-end="url(#a5)"/><defs><marker id="a5" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#437153"/></marker></defs></svg>
    </div>

    <div class="step result">
      <div class="num" style="background:#437153;">5</div>
      <div class="nt">Alerta</div>
      <div class="nd">imprime en consola y log JSON estructurado</div>
    </div>

  </div>
</div>
</body>
</html>
