# Credential access / lateral movement / defense evasion detections
# (process.create). Same schema as the seeded pack: one YAML list per
# file, indexed by event_type, hot-reloaded every 15s. These eight
# rules round the pack up to 15 and give the sequence correlator
# (sequences/) enough stages to assemble full kill chains.
# T1003.002 - SAM hive dump via reg.exe save
# Source TTP: extracting local account hashes from the registry before
# exfiltration. Validated in lab: fires on reg save HKLM\SAM.
- name: "Volcado del registro SAM"
  id: "3e6a9c15-8d47-4b2e-9f01-5a8c3d7e2b55"
  description: >
    Detecta el volcado de la colmena del registro SAM con reg.exe save,
    tecnica de acceso a credenciales que extrae los hashes de las
    cuentas locales sin tocar LSASS ni usar herramientas ofensivas.
  severity: critical
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "reg.exe"
    - field: process.command_line
      operator: contains
      value: " save "
    - field: process.command_line
      operator: contains_any
      value: ["HKLM\\SAM", "HKLM\\SYSTEM"]
  actions:
    - type: alert
      config:
        message: "Volcado de la colmena SAM en {host} por {user} - hashes locales expuestos"
        notify: "true"
  tags: ["attack.t1003.002", "attack.credential-access"]
  enabled: true
# T1003.001 - LSASS dump via procdump (signed Sysinternals variant)
# Source TTP: dumping LSASS with a signed, whitelisted tool to avoid
# detection. Validated in lab: fires on procdump -ma lsass.
- name: "Volcado de LSASS con procdump"
  id: "4f7b0d26-9e58-4c3f-a112-6b9d4e8f3c66"
  description: >
    Detecta el volcado de memoria de LSASS con procdump, variante que
    abusa de un binario firmado de Sysinternals para evadir politicas
    de aplicacion mientras captura las credenciales en claro del equipo.
  severity: critical
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "procdump.exe"
    - field: process.command_line
      operator: contains
      value: "-ma"
    - field: process.command_line
      operator: contains
      value: "lsass"
  actions:
    - type: alert
      config:
        message: "LSASS volcado con procdump en {host} - credenciales en riesgo inmediato"
        notify: "true"
  tags: ["attack.t1003.001", "attack.credential-access"]
  enabled: true
# T1218.010 - Regsvr32 scriptlet execution
# Source TTP: loading remote scriptlets (scrobj.dll) through a signed
# Windows binary. Validated in lab: fires on regsvr32 /i:http.
- name: "Ejecucion de scripts con regsvr32"
  id: "5a8c1e37-af69-4d40-b223-7cae5f9a4d77"
  description: >
    Detecta la ejecucion de scriptlets remotos o locales mediante
    regsvr32 con scrobj.dll, tecnica LOLBas que ejecuta codigo firmado
    por el binario de Windows y evita controles de aplicacion clasicos.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "regsvr32.exe"
    - field: process.command_line
      operator: contains_any
      value: ["/i:http", "scrobj.dll"]
  actions:
    - type: alert
      config:
        message: "regsvr32 cargando scriptlets en {host} - validar origen del fichero .sct"
        notify: "true"
  tags: ["attack.t1218.010", "attack.defense-evasion"]
  enabled: true
# T1218.005 - Remote MSI installation
# Source TTP: pulling and executing packages straight from the
# internet. Validated in lab: fires on msiexec /i http.
- name: "Instalacion remota con msiexec"
  id: "6b9d2f48-b07a-4e51-8334-8dbf60ab5e88"
  description: >
    Detecta la instalacion de paquetes MSI directamente desde URLs
    remotas con msiexec, via de ejecucion que salta el disco y las
    pasarelas de correo al no existir un fichero adjunto que analizar.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "msiexec.exe"
    - field: process.command_line
      operator: contains
      value: "/i"
    - field: process.command_line
      operator: contains
      value: "http"
  actions:
    - type: alert
      config:
        message: "Instalacion MSI remota en {host} - revisar la URL del paquete"
        notify: "true"
  tags: ["attack.t1218.005", "attack.defense-evasion"]
  enabled: true
# T1562.004 - Firewall impairment
# Source TTP: disabling the host firewall before lateral movement.
# Validated in lab: fires on netsh advfirewall state off.
- name: "Desactivacion del firewall de Windows"
  id: "7cae3059-c18b-4f62-9445-9ec071bc6f99"
  description: >
    Detecta la desactivacion de perfiles del firewall de Windows con
    netsh advfirewall, paso habitual para abrir el trafico de red antes
    del movimiento lateral o para mantener canales de mando encubiertos.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "netsh.exe"
    - field: process.command_line
      operator: contains
      value: "advfirewall"
    - field: process.command_line
      operator: contains
      value: "state off"
  actions:
    - type: alert
      config:
        message: "Firewall de Windows desactivado en {host} - expone servicios internos"
        notify: "true"
  tags: ["attack.t1562.004", "attack.defense-evasion"]
  enabled: true
# T1070.001 - Clear Windows event logs
# Source TTP: covering tracks by clearing Security/System channels.
# Validated in lab: fires on wevtutil cl.
- name: "Borrado de registros de eventos"
  id: "8dbf416a-d29c-4073-a556-afd182cd70aa"
  description: >
    Detecta el borrado de canales de registro de eventos con wevtutil
    (cl o clear-log), tecnica de encubrimiento que destruye la trazas
    forenses justo antes o despues de la accion destructiva.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "wevtutil.exe"
    - field: process.command_line
      operator: contains_any
      value: [" cl ", "clear-log"]
  actions:
    - type: alert
      config:
        message: "Registros de eventos borrados en {host} - accion tipica de encubrimiento"
        notify: "true"
  tags: ["attack.t1070.001", "attack.defense-evasion"]
  enabled: true
# T1547.001 - Registry Run key persistence
# Source TTP: surviving reboots via HKCU/HKLM CurrentVersion\Run.
# Validated in lab: fires on reg add ...\CurrentVersion\Run.
- name: "Persistencia en clave Run"
  id: "9ec0527b-e3ad-4184-b667-be92593de81b"
  description: >
    Detecta la escritura de valores en claves Run del registro, el
    mecanismo de persistencia mas clasico: cualquier binario alli se
    relanza en cada inicio de sesion sin requerir privilegios.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "reg.exe"
    - field: process.command_line
      operator: contains
      value: " add "
    - field: process.command_line
      operator: contains_any
      value: ["CurrentVersion\\Run", "CurrentVersion\\RunOnce"]
  actions:
    - type: alert
      config:
        message: "Clave Run modificada en {host} - verificar el binario configurado"
        notify: "true"
  tags: ["attack.t1547.001", "attack.persistence"]
  enabled: true
# T1021.001 - Lateral movement with PsExec
# Source TTP: remote execution against other hosts via admin shares.
# Validated in lab: fires on psexec \\remote -c.
- name: "Movimiento lateral con PsExec"
  id: "afd1638c-f4be-4295-c778-cfa36a4ef92c"
  description: >
    Detecta la ejecucion remota de procesos con PsExec contra otros
    equipos, tecnica estandar de movimiento lateral que abusa de
    recursos administrativos y deja servicios temporales en el destino.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "psexec.exe"
    - field: process.command_line
      operator: contains
      value: "\\\\"
  actions:
    - type: alert
      config:
        message: "PsExec contra equipo remoto desde {host} - confirmar movimiento lateral"
        notify: "true"
  tags: ["attack.t1021.002", "attack.lateral-movement"]
  enabled: true
