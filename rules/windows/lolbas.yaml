# Indirect execution and process-context anomalies (LOLBAS): signed
# OS binaries abused as script interpreters or execution trampolines,
# and the parent/child relationships that phishing and droppers always
# produce. Two signal classes live here:
#   1. interpreter abuse — the binary itself interprets remote or
#      inline script (mshta, rundll32 javascript:, installutil).
#   2. context anomalies — an interpreter spawned by a document
#      editor (macro payload) or a script running from user-writable
#      staging paths. The parent signal comes from the engine's
#      pid->name flight recorder (enrichment.parent_name), so it
#      degrades to no-match instead of false-matching when the parent
#      already left the window. The same class also covers wrapped
#      interpreters: a binary of its own (a renamed interpreter, or a
#      wrapper spawning one) betrays itself by the interpreter's
#      argument grammar, not by a name from a list.
#
# Sources: LOLBAS project entries and the parent-child anomaly
# references in ATT&CK (T1204 technique notes), re-expressed with
# multi-condition logic instead of single-markers.

# T1218.005 - mshta executing remote or inline script
- name: "Ejecucion de scripts con mshta"
  id: "b2c3d4e5-0001-4b01-9e01-010101010101"
  description: >
    Detecta mshta ejecutando contenido remoto o script embebido
    (http(s), javascript: o vbscript: en su linea de comandos). mshta
    es un interprete firmado de Windows sin uso legtimo en una
    estacion de trabajo y el vehiculo clasico de droppers de
    phishing.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "mshta.exe"
    - field: process.command_line
      operator: regex
      value: '(?i)(https?://|javascript:|vbscript:|about:blank.*)'
  actions:
    - type: alert
      config:
        message: "mshta ejecutando script remoto/embebido en {host}"
        notify: "true"
  tags: ["attack.t1218.005", "attack.defense-evasion"]
  enabled: true

# T1218.011 - rundll32 as a JavaScript execution trampoline
- name: "Ejecucion de JavaScript con rundll32"
  id: "b2c3d4e5-0002-4b02-9e02-020202020202"
  description: >
    Detecta rundll32 invocando javascript: (eval embebido) o
    ejecutando DLLs por ordinal desde rutas de usuario. La forma
    javascript: es generacion cero de ofuscacion de campaigns de
    malspam; el ordinal remoto (rundll32.exe shell32.dll,SHRunDLL
    http...) lo extiende al mismo patron con otro binario.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "rundll32.exe"
    - field: process.command_line
      operator: regex
      value: '(?i)javascript:|shell32\.dll,SHRunDLL'
  actions:
    - type: alert
      config:
        message: "rundll32 como interprete de JavaScript/pipe en {host}"
        notify: "true"
  tags: ["attack.t1218.011", "attack.defense-evasion"]
  enabled: true

# T1218.001 - InstallUtil code execution via uninstall flag
- name: "Ejecucion evasiva con InstallUtil"
  id: "b2c3d4e5-0003-4b03-9e03-030303030303"
  description: >
    Detecta InstallUtil con las banderas de bypass clsicas
    (/U=desinstalacion, /LogFile=, bandera de log). El binario firmado
    compila y ejecuta ensamblados .NET bajo un proceso legitimo,
    tecnica preferida para saltar listas blancas de aplicacion.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "installutil.exe"
    - field: process.command_line
      operator: regex
      value: '(?i)/logfile=|/u(ninstall)?\s|/enabledirenterop'
  actions:
    - type: alert
      config:
        message: "InstallUtil con banderas de bypass en {host}"
        notify: "true"
  tags: ["attack.t1218.001", "attack.defense-evasion"]
  enabled: true

# T1202 - forfiles as an indirect command executor
- name: "Ejecucion indirecta con forfiles"
  id: "b2c3d4e5-0004-4b04-9e04-040404040404"
  description: >
    Detecta forfiles lanzando cmd o powershell via /p y /c. El abuso
    estandar usa forfiles como lanzador indirecto: los productos de
    lista blanca ven forfiles.exe firmado y el comando real viaja en
    /c. Un forfiles legitimo no lanza interpretes.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: eq
      value: "forfiles.exe"
    - field: process.command_line
      operator: regex
      value: '(?i)/c\s+"?(cmd|powershell|wscript|cscript|mshta)'
  actions:
    - type: alert
      config:
        message: "forfiles lanzando un interprete en {host}"
        notify: "true"
  tags: ["attack.t1202", "attack.defense-evasion"]
  enabled: true

# T1566.001/T1204.002 - office documents spawning interpreters
- name: "Editor de Office lanzando un interprete"
  id: "b2c3d4e5-0005-4b05-9e05-050505050505"
  description: >
    Detecta un editor de documentos (Word, Excel, PowerPoint,
    Publisher, visor de Office) como padre de un interprete de
    comandos o de scripts. Es la firma de ejecucion de macro maliciosa
    o de plantilla maliciosa: ningun documento legitimo necesita
    cmd, powershell, mshta ni wscript de hijo directo.
  severity: critical
  event_type: process.create
  conditions:
    - field: enrichment.parent_name
      operator: iin
      value: ["winword.exe", "excel.exe", "powerpnt.exe", "mspub.exe", "winproj.exe", "wordview.exe", "xlview.exe"]
    - field: process.name
      operator: in
      value: ["cmd.exe", "powershell.exe", "wscript.exe", "cscript.exe", "mshta.exe", "rundll32.exe"]
  actions:
    - type: alert
      config:
        message: "Documento de Office lanzo un interprete en {host} (macro maliciosa)"
        notify: "true"
  tags: ["attack.t1566.001", "attack.execution"]
  enabled: true

# T1204.002 - script interpreters running from user-writable staging
- name: "Interprete de script ejecutando desde staging de usuario"
  id: "b2c3d4e5-0006-4b06-9e06-060606060606"
  description: >
    Detecta wscript/cscript/mshta ejecutando un script cuyo path vive
    en directorios de escritura libre del usuario (AppData, Temp,
    Downloads, Perfil). Los controles de aplicacion confian en el
    interprete firmado; el payload de phishing siempre aterriza en
    staging de usuario antes de invocarlo.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: in
      value: ["wscript.exe", "cscript.exe", "mshta.exe"]
    - field: process.command_line
      operator: regex
      value: '(?i)\\appdata\\|\\temp\\|\\downloads\\|%appdata%|%temp%'
  actions:
    - type: alert
      config:
        message: "Script ejecutado desde staging de usuario en {host}"
        notify: "true"
  tags: ["attack.t1204.002", "attack.execution"]
  enabled: true

# T1059.001 - PowerShell download cradles
- name: "Cradle de descarga en PowerShell"
  id: "b2c3d4e5-0007-4b07-9e07-070707070707"
  description: >
    Detecta el cradle de descarga canonico de PowerShell: IEX con
    WebClient/Invoke-WebRequest/Invoke-RestMethod o descarga seguida
    de invocacion en memoria. Combinacion de trafico y ejecucion en
    una sola linea que define la primera etapa de casi todo ataque
    moderno que llega por correo o documento.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: in
      value: ["powershell.exe", "pwsh.exe"]
    - field: process.command_line
      operator: regex
      value: '(?i)(iex|invoke-expression|\.\s+downloadstring|downloadfile)\b.*(net\.webclient|invoke-webrequest|invoke-restmethod|http)|\biwr\b.*\biex\b'
  actions:
    - type: alert
      config:
        message: "Cradle de descarga PowerShell en {host} por {user}"
        notify: "true"
  tags: ["attack.t1059.001", "attack.execution"]
  enabled: true

# T1055 - interpreter spawning from a browser sandbox escape pattern
- name: "Navegador lanzando un interprete de comandos"
  id: "b2c3d4e5-0008-4b08-9e08-080808080808"
  description: >
    Detecta navegadores y plugins de escritorio como padres directos
    de interpretes. Legitimamente un navegador no engendra cmd ni
    powershell; el patron indica explotacion tipo drive-by o descarga
    autoejecutada. El conjunto de padres cubre los binarios de
    escritorio mas comunes sin incluir procesos de instalacion.
  severity: high
  event_type: process.create
  conditions:
    - field: enrichment.parent_name
      operator: iin
      value: ["chrome.exe", "msedge.exe", "firefox.exe", "brave.exe", "opera.exe", "acrobat.exe", "acrord32.exe"]
    - field: process.name
      operator: in
      value: ["cmd.exe", "powershell.exe", "wscript.exe", "mshta.exe"]
  actions:
    - type: alert
      config:
        message: "Navegador lanzo un interprete de comandos en {host} (posible drive-by)"
        notify: "true"
  tags: ["attack.t1203", "attack.execution"]
  enabled: true

# T1036.005 - a renamed (or hosted) interpreter betrays itself by its
# own argument grammar, not by a name from a list
- name: "Interprete renombrado por su gramatica de argumentos"
  id: "b2c3d4e5-0009-4b09-9e09-090909090909"
  description: >
    Detecta un binario cuyo nombre NO es el de un interprete conocido
    pero cuya linea de comandos lleva la gramatica propia de uno:
    -EncodedCommand o un blob Base64 tras -enc (PowerShell renombrado
    o alojado), hosting vbscript:/javascript: (mshta-like), o codigo
    inline de Python tras -c. Es la firma del wrapper con nombre
    propio y del interprete renombrado: wrapper.exe -enc no dispara
    ninguna regla por nombre y esta si la caza. Los interpretes
    canonicos quedan fuera (los cubren sus reglas propias); el alias
    corto -enc se exige seguido de un blob Base64 largo para no
    confundirlo con -Encoding de herramientas legitimas.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: not_in
      value: ["powershell.exe", "pwsh.exe", "cmd.exe", "wscript.exe", "cscript.exe", "mshta.exe", "rundll32.exe", "installutil.exe", "python.exe", "pythonw.exe", "python3.exe", "py.exe", "node.exe"]
    - field: process.command_line
      operator: regex
      value: '(?i)(-encodedcommand(\s|=)|-enc\s+["'']?[A-Za-z0-9+/=]{20,}|\bvbscript:|\bjavascript:|-c\s*["'']?(import|from)\s+(os|sys|socket|subprocess|ctypes|base64)\b)'
  actions:
    - type: alert
      config:
        message: "Binario con nombre propio ejecutando un interprete (renombrado o alojado) en {host} por {user}"
        notify: "true"
  tags: ["attack.t1036.005", "attack.t1059", "attack.defense_evasion"]
  enabled: true

# T1059 - the wrapper behind the interpreter: a parent of its own
# launching a canonical interpreter with covert flags
- name: "Binario con nombre propio lanzando un interprete encubierto"
  id: "b2c3d4e5-0010-4b10-9e10-101010101010"
  description: >
    Detecta el caso literal wrapper.exe -> powershell -enc: el padre
    (resuelto por el grabador de vuelo del motor) tiene un nombre que
    no es un lanzador canonico y el hijo es un interprete canonico
    con marcadores encubiertos (-EncodedCommand, blob tras -enc, -w
    hidden, vbscript:). Se empareja deliberadamente con la regla del
    comando codificado (el angulo de esta es el PADRE, no el hijo) y
    excluye los padres que ya tienen su propia regla dedicada
    (navegadores, Office) para no duplicar alertas. Falsos positivos
    documentados: agentes de despliegue legitimos (SCCM, GPO) que
    lanzan PowerShell con -EncodedCommand desde un binario propio;
    si existen en tu flota, anadelos a la exclusion en tu despliegue.
  severity: medium
  event_type: process.create
  conditions:
    - field: enrichment.parent_name
      operator: neq
      value: ""
    - field: enrichment.parent_name
      operator: not_in
      value: ["cmd.exe", "powershell.exe", "pwsh.exe", "wscript.exe", "cscript.exe", "mshta.exe", "explorer.exe", "services.exe", "svchost.exe", "taskhostw.exe", "taskeng.exe", "wmiprvse.exe", "userinit.exe", "conhost.exe", "python.exe", "pythonw.exe", "node.exe", "rundll32.exe", "regsvr32.exe", "msiexec.exe", "chrome.exe", "msedge.exe", "firefox.exe", "winword.exe", "excel.exe", "powerpnt.exe", "w3wp.exe", "java.exe"]
    - field: process.name
      operator: in
      value: ["powershell.exe", "pwsh.exe", "wscript.exe", "cscript.exe", "mshta.exe", "cmd.exe"]
    - field: process.command_line
      operator: regex
      value: '(?i)(-encodedcommand(\s|=)|-enc\s+["'']?[A-Za-z0-9+/=]{20,}|-w\s+hidden\b|-windowstyle\s+hidden\b|\bvbscript:)'
  actions:
    - type: alert
      config:
        message: "Interprete encubierto lanzado por un binario con nombre propio en {host} por {user} (ver el padre en el detalle del evento)"
        notify: "true"
  tags: ["attack.t1059", "attack.t1036.005", "attack.defense_evasion"]
  enabled: true
