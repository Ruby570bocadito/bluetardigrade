# T1059.001 - PowerShell with encoded command
# Source TTP: phishing delivery with obfuscated PowerShell execution.
# Validated in lab: fires on powershell.exe -nop -w hidden -enc <b64>.
- name: "PowerShell con comando codificado"
  id: "9f31c2a4-5d7b-4e18-8a02-3b9c6d1e7f40"
  description: >
    Detecta PowerShell con comandos Base64 (-enc / -EncodedCommand) o
    ventana oculta (-w hidden), patron habitual en phishing y en la
    ejecucion ofuscada de payloads.
  severity: high
  event_type: process.create
  conditions:
    - field: process.name
      operator: iin
      value: ["powershell.exe", "pwsh.exe"]
    - field: process.command_line
      # regex instead of contains_any: a bare "-enc" substring also
      # matched "-Encoding UTF8" in legitimate sign/scripts and raised
      # a HIGH alert on it. The alternation with a word boundary keeps
      # every real flag (-enc, -eNcoDeDcommand...) and drops -Encoding.
      operator: regex
      # (?i): powershell flags are case-insensitive (-ENC works); the
      # colon/space class covers both -w hidden and -w:hidden syntax.
      # PowerShell accepts ANY prefix of a parameter name (-e, -ec,
      # -enco, -encod... and -w, -win, -windowst...), a slash or a
      # Unicode dash instead of the hyphen, and pwsh.exe takes the
      # same flags: the nested optionals spell every prefix out. The
      # encoded flag must be followed by its argument, which is what
      # keeps -Encoding out.
      value: '(?i)(^|\s)([-/\x{2013}\x{2014}\x{2015}]e(c|n(c(o(d(e(d(c(o(m(m(a(n(d)?)?)?)?)?)?)?)?)?)?)?)?)?[\s:]+\S|[-/\x{2013}\x{2014}\x{2015}]w(i(n(d(o(w(s(t(y(l(e)?)?)?)?)?)?)?)?)?)?[\s:=]+["'']?(hid\w*|1)\b)'
  actions:
    - type: alert
      config:
        message: "PowerShell con comando codificado detectado en {host} por {user}"
        notify: "true"
  tags: ["attack.t1059.001", "attack.execution"]
  enabled: true
