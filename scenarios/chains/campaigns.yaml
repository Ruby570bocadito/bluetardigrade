- name: Escalada y volcado de credenciales (sintetico)
  id: sim-chain-cf86-be62
  description: 'Secuencia sintetica que completa la cadena: bypass de UAC y volcado de LSASS. Telemetria inerte;
    nada se ejecuta en ningun equipo.'
  attack:
  - t1548.002
  - t1003.001
  host: LAB-SIM-CHAIN2
  user: CORP\sim
  expected:
  - rule: ad51cf86-be62-40d3-8fa7-6b8c9daebfc5
  events:
  - type: registry.set
    user: CORP\sim
    process:
      pid: 4390
      name: explorer.exe
    registry:
      key: HKCU\Software\Classes\ms-settings\shell\open\command
      operation: SetValue
      value_name: (predeterminado)
      value: cmd.exe /c C:\Users\Public\p.exe
  - type: process.create
    user: CORP\sim
    process:
      pid: 4391
      name: rundll32.exe
      command_line: rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump 744 C:\Windows\Temp\lsass.dmp full
