# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: 'Phishing: enlace HTML muestra otro host (sintetico)'
  id: sim-phishing-html-mismatch
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: el enlace HTML
    anuncia un host y apunta a otro. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1566.002
  host: LAB-SIM-PHISHING-HTML-MISM
  user: CORP\sim
  expected:
  - rule: soc-mail-html-link-mismatch
  events:
  - type: email.message
    source: eml
    attributes:
      mail_html_link_host_mismatch: 'true'
      mail_subject: Factura pendiente
      mail_from: billing@ejemplo-corp.tk
- name: 'Phishing: URL contiene credenciales antes del host (sintetico)'
  id: sim-phishing-url-credentials
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: la URL lleva
    usuario y contrasena antes del host. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1566.002
  host: LAB-SIM-PHISHING-URL-CREDE
  user: CORP\sim
  expected:
  - rule: soc-mail-url-credentials
  events:
  - type: email.message
    source: eml
    attributes:
      mail_url_credentials: 'true'
      mail_subject: Verifique su cuenta
      mail_from: soporte@banco-seguro.tk
