# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: 'Phishing: adjunto de extension activa (sintetico)'
  id: sim-mail-risky-attachment
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: el correo trae
    un adjunto de extension activa. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1566.001
  host: LAB-SIM-MAIL-RISKY-ATTACHM
  user: CORP\sim
  expected:
  - rule: soc-mail-risky-attachment
  events:
  - type: email.message
    source: eml
    attributes:
      mail_risky_attachment: 'true'
      mail_subject: Albaran firmado
      mail_from: logistica@transportista.tk
- name: 'Phishing: fallo DMARC declarado en cabecera (sintetico)'
  id: sim-mail-dmarc-fail
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: la cabecera
    declara un fallo DMARC. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
