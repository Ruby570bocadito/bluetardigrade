- name: 'NDR: SMB hacia una direccion publica (sintetico)'
  id: sim-ndr-public-smb
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: el monitor de
    red ve SMB hacia una direccion publica. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1021.002
  host: LAB-SIM-NDR-PUBLIC-SMB
  user: CORP\sim
  expected:
  - rule: soc-ndr-public-smb
  events:
  - type: network.connect
    source: zeek
    network:
      protocol: TCP
      destination_ip: 203.0.113.50
      destination_port: 445
    attributes:
      destination_scope: public
