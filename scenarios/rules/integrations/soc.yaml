- name: 'osquery: nuevo puerto administrativo en todas las interfaces (sintetico)'
  id: sim-osquery-admin-listener
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: osquery descubre
    un puerto administrativo expuesto en todas las interfaces. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack: []
  host: LAB-SIM-OSQUERY-ADMIN-LIST
  user: CORP\sim
  expected:
  - rule: soc-osquery-admin-listener
  events:
  - type: host.query
    source: osquery
    attributes:
      query_name: bt_exposed_admin_ports
      query_action: added
      query_counter: '3'
      column_address: 0.0.0.0
      column_port: '22'
