# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Borrado del registro de eventos con PowerShell (sintetico)
  id: sim-ps-clear-eventlog
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: borrado del
    registro de eventos con PowerShell. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1070.001
  host: LAB-SIM-PS-CLEAR-EVENTLOG
  user: CORP\sim
  expected:
  - rule: c3d4e5f6-0001-4c01-9e01-010101010101
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4100
      name: powershell.exe
      command_line: powershell.exe -c Clear-EventLog -LogName Security
