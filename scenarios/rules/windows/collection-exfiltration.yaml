# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Compresion de datos protegida con contrasena (sintetico)
  id: sim-7z-password-archive
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: compresion de
    datos protegida con contrasena. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1560.001
  host: LAB-SIM-7Z-PASSWORD-ARCHIV
  user: CORP\sim
  expected:
  - rule: ae3ac8b8-76bf-4d9e-ba1d-2b2f5568b35e
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4120
      name: 7za.exe
      command_line: 7za.exe a -pS3cret! C:\Users\Public\staged.7z C:\Users\sim\Documents
