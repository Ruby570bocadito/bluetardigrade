# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Volcado del registro SAM (sintetico)
  id: sim-reg-save-sam
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: volcado del
    registro SAM con reg save. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1003.002
  host: LAB-SIM-REG-SAVE-SAM
  user: CORP\sim
  expected:
  - rule: 3e6a9c15-8d47-4b2e-9f01-5a8c3d7e2b55
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4130
      name: reg.exe
      command_line: reg.exe save HKLM\SAM C:\Users\Public\sam.hiv
- name: Volcado de LSASS con procdump (sintetico)
  id: sim-procdump-lsass
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: volcado de LSASS
    con procdump -ma. Telemetria inerte; nada se ejecuta en ningun equipo.'
