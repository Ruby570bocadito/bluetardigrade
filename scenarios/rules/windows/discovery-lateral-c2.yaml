# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Reconocimiento lanzado desde un proceso sospechoso (sintetico)
  id: sim-office-spawns-recon
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: reconocimiento
    lanzado desde winword.exe. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1082
  - t1033
  host: LAB-SIM-OFFICE-SPAWNS-RECO
  user: CORP\sim
  expected:
  - rule: 6a6b145f-34d4-440e-8041-238dde766981
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 800
      name: winword.exe
      command_line: winword.exe /x informe.docm
      image: C:\Apps\winword.exe
  - type: process.create
    user: CORP\sim
    process:
      pid: 4140
      name: whoami.exe
      ppid: 800
      command_line: whoami.exe /priv
