# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Bypass de AMSI en PowerShell (sintetico)
  id: sim-amsi-bypass
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: bypass de AMSI
    en PowerShell. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1562.001
  host: LAB-SIM-AMSI-BYPASS
  user: CORP\sim
  expected:
  - rule: 4c877f28-95f0-4c8d-b4ad-e4e904274d56
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4150
      name: powershell.exe
      command_line: powershell.exe -c "[Ref].Assembly.GetType('System.Management.Automation.AmsiUtils')"
- name: Suscripcion permanente de eventos WMI (sintetico)
  id: sim-wmi-subscription
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: suscripcion
    permanente de eventos WMI. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1546.003
  host: LAB-SIM-WMI-SUBSCRIPTION
  user: CORP\sim
  expected:
  - rule: 87f5f6c7-1ce0-4d07-b2f9-c1732e3e7163
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4151
      name: powershell.exe
      command_line: powershell.exe -c New-CimInstance -ClassName __EventFilter; Register-CimIndicationEvent -ConsumerName
        CommandLineEventConsumer
- name: Borrado del historial de PowerShell (sintetico)
  id: sim-ps-history-clear
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: borrado del
