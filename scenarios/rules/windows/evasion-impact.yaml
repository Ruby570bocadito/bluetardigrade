  attack:
  - t1070.003
  host: LAB-SIM-PS-HISTORY-CLEAR
  user: CORP\sim
  expected:
  - rule: 2a01df90-a2e0-4a97-a01e-55f2a2c6360c
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4152
      name: powershell.exe
      command_line: powershell.exe -c Remove-Item (Get-PSReadlineOption).HistorySavePath
- name: Registro de bloques de PowerShell desactivado (sintetico)
  id: sim-ps-scriptblock-off
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: registro de
    bloques de PowerShell desactivado. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1562.002
  host: LAB-SIM-PS-SCRIPTBLOCK-OFF
  user: CORP\sim
  expected:
  - rule: f000c873-4dbe-485e-8328-120a9e3e8339
  events:
  - type: registry.set
    user: CORP\sim
    process:
      pid: 4153
      name: explorer.exe
    registry:
      key: HKLM\Software\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
      operation: SetValue
      value_name: EnableScriptBlockLogging
      value: '0'
- name: Busqueda de contrasenas en ficheros (sintetico)
  id: sim-findstr-passwords
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: busqueda de
    contrasenas en ficheros con findstr. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1552.001
  host: LAB-SIM-FINDSTR-PASSWORDS
  user: CORP\sim
  expected:
  - rule: f6cd9a23-7e15-4721-83e3-d8115583e6e4
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4154
      name: findstr.exe
      command_line: findstr.exe /si password C:\Users\sim\Documents\*.txt
