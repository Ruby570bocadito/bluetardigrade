# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Office escribe un payload en una ruta de usuario (sintetico)
  id: sim-office-payload-drop
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: Office escribe
    un payload en una ruta de usuario. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1204.002
  host: LAB-SIM-OFFICE-PAYLOAD-DRO
  user: CORP\sim
  expected:
  - rule: d4e5f607-1001-4a00-8000-000000000001
  events:
  - type: file.write
    user: CORP\sim
    process:
      pid: 4160
      name: winword.exe
    file:
      path: C:\Users\Public\payload.exe
