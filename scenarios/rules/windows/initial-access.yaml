# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Proceso hijo de un servidor web o de base de datos (sintetico)
  id: sim-webshell-child
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: cmd.exe lanzado
    por el servidor web w3wp.exe. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1505.003
  - t1190
  host: LAB-SIM-WEBSHELL-CHILD
  user: CORP\sim
  expected:
  - rule: ca55c08b-ae3e-4e55-a2b0-32bc8c383187
  events:
  - type: process.create
    user: CORP\sim
    process:
      pid: 800
      name: w3wp.exe
      command_line: w3wp.exe -ap "Sitio Web"
      image: C:\Apps\w3wp.exe
  - type: process.create
    user: CORP\sim
    process:
      pid: 4180
      name: cmd.exe
      ppid: 800
      command_line: cmd.exe /c whoami
