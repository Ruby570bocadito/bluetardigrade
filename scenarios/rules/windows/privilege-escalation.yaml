# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Bypass de UAC con fodhelper o computerdefaults (sintetico)
  id: sim-fodhelper-uac
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: bypass de UAC
    con la clase ms-settings. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1548.002
  host: LAB-SIM-FODHELPER-UAC
  user: CORP\sim
  expected:
  - rule: 1039ed0d-bec2-47ce-a651-9395cb069219
  events:
  - type: registry.set
    user: CORP\sim
    process:
      pid: 4200
      name: explorer.exe
    registry:
      key: HKCU\Software\Classes\ms-settings\shell\open\command
      operation: SetValue
      value_name: (predeterminado)
      value: cmd.exe /c C:\Users\Public\payload.exe
