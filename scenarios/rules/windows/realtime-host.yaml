# Escenarios de validacion de deteccion (SIM-1/SIM-2).
# Telemetria sintetica e inerte: el mismo esquema de eventos que
# envia el sensor, sin ejecutar nada en ningun equipo. Cada escenario
# declara las alertas que el motor DEBE disparar (shipped rule/sequence
# id); el test de CI falla si una deja de detectarse.

- name: Persistencia en clave Run via registro (sintetico)
  id: sim-run-key-registry
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: persistencia
    en clave Run via registro. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1547.001
  host: LAB-SIM-RUN-KEY-REGISTRY
  user: CORP\sim
  expected:
  - rule: 7d1e2f40-5a6b-4c7d-9e8f-0a1b2c3d4e5f
  events:
  - type: registry.set
    user: CORP\sim
    process:
      pid: 4210
      name: explorer.exe
    registry:
      key: HKCU\Software\Microsoft\Windows\CurrentVersion\Run
      operation: SetValue
      value_name: OneDriveSync
      value: C:\Users\Public\payload.exe
- name: Defensa antivirus desactivada via registro (sintetico)
  id: sim-defender-registry-off
  description: 'Invocacion sintetica que valida la regla con los mismos campos que envia el sensor: defensa antivirus
    desactivada via registro. Telemetria inerte; nada se ejecuta en ningun equipo.'
  attack:
  - t1562.001
  host: LAB-SIM-DEFENDER-REGISTRY-
  user: CORP\sim
  expected:
  - rule: 8e2f3a51-6b7c-4d8e-af90-1b2c3d4e5f60
  events:
  - type: registry.set
    user: CORP\sim
    process:
      pid: 4211
      name: explorer.exe
    registry:
      key: HKLM\Software\Microsoft\Windows Defender
      operation: SetValue
      value_name: DisableAntiSpyware
      value: '1'
