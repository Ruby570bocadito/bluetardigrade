[package]
name = "security-sensor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ETW sensor for the bluetardigrade detection engine"

[dependencies]
anyhow = "1"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

# ETW consumption is Windows-only. The crate still builds anywhere
# (argument parsing, normalization and transport compile on any OS),
# but the binary refuses to run off-Windows instead of making data up.
[target.'cfg(target_os = "windows")'.dependencies]
ferrisetw = { version = "1", features = ["time_rs"] }
# TLS sits below the AUTH handshake of the engine connection and is
# Windows-gated like its only consumer (transport.rs). native-tls keeps
# this target's dependency tree C-free (schannel: pure-Rust bindings to
# the OS TLS stack), so the CI cross-check of the Windows target stays
# a pure cargo check with no C toolchain on the runner.
native-tls = "0.2"
# SetConsoleCtrlHandler: Ctrl+C stops the kernel ETW session instead of
# leaving it running after the process exits; RegGetValueW reads the
# Windows version for the heartbeat. Already in the dependency tree
# (same version), so no new crate is pulled in.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry"] }

[profile.release]
lto = true
strip = true
