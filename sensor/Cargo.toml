[package]
name = "security-sensor"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "ETW sensor for the bluetardigrade detection engine"

[dependencies]
anyhow = "1"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
# YARA scanning (S-2): pure Rust (VirusTotal), so the Windows cross-check
# stays a plain cargo check with no C toolchain. All the standard modules
# are enabled except `crx` (the sensor never parses Chrome extensions).
# pe-module and macho-module enable yara-x's `crypto` feature, which
# pulls `rsa` 0.10.0-rc.19 carrying RUSTSEC-2023-0071 (Marvin Attack, no
# patched release exists): parse-only Authenticode use on the host is
# outside that advisory's network-timing surface, and the reviewed
# exception lives in .cargo/audit.toml. The WASM runtime below the module
# system is part of yara-x and comes with it (compile time grows
# accordingly, measured in the round report). Rules load from a directory
# the engine manages (contract S-2<->M-3); the scanner only runs when
# --yara-rules is given.
yara-x = { version = "1.22", default-features = false, features = [
    "constant-folding",
    "exact-atoms",
    "fast-regexp",
    "generate-proto-code",
    "console-module",
    "cuckoo-module",
    "dex-module",
    "dotnet-module",
    "elf-module",
    "lnk-module",
    "macho-module",
    "math-module",
    "hash-module",
    "pe-module",
    "string-module",
    "time-module",
    "vt-module",
    "zip-module",
] }

# ETW consumption is Windows-only. The crate still builds anywhere
# (argument parsing, normalization and transport compile on any OS),
# but the binary refuses to run off-Windows instead of making data up.
[target.'cfg(target_os = "windows")'.dependencies]
ferrisetw = { version = "1", features = ["time_rs"] }
# TLS sits below the AUTH handshake of the engine connection and is
# Windows-gated like its only consumer (transport.rs). native-tls keeps
# this target's dependency tree C-free (schannel: pure-Rust bindings to
# the OS TLS stack), so the CI cross-check of the Windows target stays
# a pure cargo check with no C toolchain on the runner.
native-tls = "0.2"
# SetConsoleCtrlHandler: Ctrl+C stops the kernel ETW session instead of
# leaving it running after the process exits; RegGetValueW reads the
# Windows version for the heartbeat. ControlTraceW answers the heartbeat
# with what the two ETW sessions lost (EventsLost, RealTimeBuffersLost).
# Already in the dependency tree (same version), so no new crate is
# pulled in. The YARA memory sweep (S-2) adds: ToolHelp (the process
# snapshot), Memory (VirtualQueryEx walks the committed regions) and
# Diagnostics/Debug (ReadProcessMemory reads them) — no new crate.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Services"] }

[profile.release]
lto = true
strip = true
