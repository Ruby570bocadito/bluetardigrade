<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="bluetardigrade">
  <defs>
    <linearGradient id="btBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dc3ff"/>
      <stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
    <linearGradient id="btGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dc3ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f6fed" stop-opacity="0.05"/>
    </linearGradient>
    <style>
      .bt-breathe { animation: bt-breathe 3.2s ease-in-out infinite; }
      @keyframes bt-breathe {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bt-breathe { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- halo -->
  <circle cx="32" cy="34" r="26" fill="url(#btGlow)" class="bt-breathe"/>

  <!-- patas: 4 pares, cápsulas cortas -->
  <g stroke="url(#btBody)" stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M22 30 C17 29 14 26 13 22"/>
    <path d="M21 37 C15 37 11 35 9 32"/>
    <path d="M22 44 C16 45 13 48 12 52"/>
    <path d="M42 30 C47 29 50 26 51 22"/>
    <path d="M43 37 C49 37 53 35 55 32"/>
    <path d="M42 44 C48 45 51 48 52 52"/>
  </g>

  <!-- cuerpo segmentado -->
  <g fill="url(#btBody)">
    <rect x="20" y="24" width="24" height="22" rx="11"/>
    <rect x="26" y="25" width="12" height="20" rx="6" opacity="0.25" stroke="#4dc3ff" stroke-width="1" fill="none"/>
    <rect x="21.5" y="32" width="21" height="1.6" rx="0.8" opacity="0.28"/>
    <rect x="21.5" y="38" width="21" height="1.6" rx="0.8" opacity="0.28"/>
  </g>

  <!-- cabeza + ojos -->
  <circle cx="32" cy="25.5" r="7.5" fill="url(#btBody)"/>
  <circle cx="29" cy="24" r="1.7" fill="#060a10"/>
  <circle cx="35" cy="24" r="1.7" fill="#060a10"/>
  <circle cx="29.5" cy="23.4" r="0.55" fill="#cfeaff"/>
  <circle cx="35.5" cy="23.4" r="0.55" fill="#cfeaff"/>
</svg>
